perimetre: >
  Le programme de mathématiques de cycle 4 (BO n° 31 du 30 juillet 2020) est fixé pour les trois
  années 5e-4e-3e sans détail réglementaire année par année : les notions n'y sont associées qu'à
  des « attendus de fin de cycle ». Le document éduscol « Attendus de fin d'année de 3e » précise
  ce qui doit être maîtrisé au sortir de la 3e et sert ici de critère pour distinguer
  niveau_programme: "3e" (notion explicitement décrite dans ce document) de niveau_programme:
  "cycle 4" (notion du programme non détaillée spécifiquement pour la 3e dans ce document, en
  l'absence d'accès complet aux repères annuels de progression détaillés par le présent travail).
brevet:
  evalue: true
  epreuve: >
    Épreuve écrite de mathématiques du DNB (coefficient 2), durée 2 heures, notée sur 20.
    Porte sur les connaissances et compétences attendues en fin de cycle 4, déclinées par le
    programme de la classe de troisième s'il est en vigueur ou, à défaut, du cycle 4.
    Partie 1 — automatismes et applications directes : 6 points, 20 minutes, sans calculatrice,
    questions à réponses courtes. Partie 2 — raisonnement et résolution de problèmes : 14 points,
    1 h 40, avec calculatrice, aucune modalité QCM, réponses justifiées, 2 points évalués sur la
    maîtrise de la langue. Les deux parties sont traitées sans pause mais sur deux copies séparées,
    la première étant relevée à l'issue de la partie 1.
  source: "https://www.education.gouv.fr/bo/2026/Hebdo4/MENE2623228N"
