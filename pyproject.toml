[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jules-tuteur"
version = "0.1.0"
description = "Tuteur de devoirs libre et gratuit, du CM1 à la 3e aujourd'hui : il guide sans jamais donner la réponse."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Les contributeurs de Jules" }]
keywords = ["education", "tuteur", "primaire", "college", "ia", "socratique"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: French",
  "Topic :: Education",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16",
  "mypy>=1.13",
  "types-PyYAML",
  "pre-commit>=4",
  "pip-audit>=2.7",
]

[project.scripts]
jules = "jules.cli:main"

[project.urls]
Documentation = "https://github.com/alexxb2mg-svg/jules#readme"
Issues = "https://github.com/alexxb2mg-svg/jules/issues"

[tool.setuptools.packages.find]
include = ["jules*"]

[tool.setuptools.package-data]
jules = ["web/static/*"]

# --- Qualite ------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", "F", "W",   # erreurs et style de base
  "I",             # ordre des imports
  "B",             # bugs probables
  "UP",            # syntaxe Python moderne
  "S",             # securite (bandit)
  "C4", "SIM",     # simplifications
  "PTH",           # pathlib plutot que os.path
  "RUF",           # regles propres a ruff
]
ignore = [
  "RUF001", "RUF002", "RUF003",  # le projet est en francais : apostrophes et guillemets typographiques voulus
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert et faux codes d'acces sont normaux dans les tests

[tool.ruff.lint.isort]
known-first-party = ["jules", "tests"]

[tool.mypy]
python_version = "3.10"
files = ["jules"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.coverage.run]
source = ["jules"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
