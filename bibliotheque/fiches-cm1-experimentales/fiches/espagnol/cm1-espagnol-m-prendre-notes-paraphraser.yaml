notion: cm1-espagnol-m-prendre-notes-paraphraser
declencheurs:
- noter des informations en espagnol
- recopier une liste de mots espagnols
- reformuler en espagnol
essentiel: 'Prendre des notes, c''est lister et transmettre, à l''écrit ou à l''oral, des informations importantes
  (des noms, des nombres, des prix, des détails).

  On recopie sans erreurs un court texte ou une liste de mots, et on copie sous la dictée quelques mots très courants
  déjà connus.

  On peut aussi passer d''une langue à l''autre pour aider un camarade à comprendre une consigne : c''est la traduction.'
methode:
- Écouter ou lire attentivement pour repérer les informations importantes (nom, nombre, prix).
- Noter ces informations avec des mots simples ou des dessins.
- Transmettre l'information à l'oral ou à l'écrit, sans erreur.
- Traduire une consigne pour un camarade s'il en a besoin.
vocabulaire:
- terme: médiation
  definition: le fait d'aider une autre personne à comprendre, par exemple en traduisant
erreurs_frequentes:
- Noter trop d'informations et oublier l'essentiel (nom, nombre).
- Recopier une liste de mots avec des erreurs.
exemple:
  enonce: 'Un camarade dit à l''oral : « Se llama Tomás. Tiene 7 años. ». Note ces informations.'
  solution: 'Nom : Tomás. Âge : 7 ans.'
exercices:
- enonce: 'Recopie sans erreur cette courte liste de mots : « lápiz, goma, regla ».'
  indices:
  - Vérifie chaque mot lettre par lettre, y compris les accents.
  solution: lápiz, goma, regla
- enonce: Un camarade ne comprend pas la consigne « Dibuja una línea para cada letra. ». Traduis-la pour l'aider.
  indices:
  - Dibuja = dessine, línea = ligne/trait, letra = lettre.
  solution: Dessine un trait pour chaque lettre.
sources:
- titre: Programme de langues vivantes étrangères et régionales pour le cours moyen, arrêté du 26-2-2026, BO n°
    12 du 19/03/2026, p. 18
  url: https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf
  auteurs: Ministère de l'Éducation nationale (DGESCO)
  licence: etalab-2.0
  consulte_le: '2026-09-24'
  usage: reformulé et résumé
