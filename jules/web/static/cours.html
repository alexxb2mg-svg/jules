<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jules - Mes leçons</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/icone-192.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#1F4E8C">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/symboles.css">
  <link rel="stylesheet" href="/static/cours.css">
  <link rel="stylesheet" href="/static/navigation.css">
  <link rel="stylesheet" href="/static/adaptations.css">
</head>
<body>
  <div id="porte" class="porte cache">
    <img src="/api/persona/avatar" alt="">
    <h1>Jules</h1>
    <p>Tape ton code secret pour commencer</p>
    <form id="porte-form" class="rangee colonne">
      <input id="porte-code" type="password" autocomplete="current-password" inputmode="text" aria-label="Code">
      <button class="bouton" type="submit">Entrer</button>
    </form>
    <div id="porte-erreur" class="erreur"></div>
  </div>

  <div id="contenu" class="cours-appli">
    <header class="cours-entete">
      <span class="cours-marque">
        <img src="/api/persona/avatar" alt="">
        <span id="nom-persona">Jules</span>
      </span>
      <button type="button" class="bouton-panneau" id="menu-jules" aria-label="Ouvrir Jules" aria-expanded="false" aria-controls="panneau-jules">💬 <span>Jules</span></button>
    </header>

    <div class="cours-corps">
      <main class="lecon-zone">
        <!-- Tant qu'aucune lecon n'est ouverte : la liste des notions, ici, dans la zone centrale (EX-209). La
             matiere se choisit dans la barre ; a la premiere visite, la page propose la liste des matieres. -->
        <section id="catalogue" class="catalogue" aria-labelledby="catalogue-titre">
          <h1 id="catalogue-titre" class="catalogue-titre" tabindex="-1">Mes leçons</h1>
          <div id="choix-matiere" class="choix-matiere cache">
            <p class="choix-matiere-consigne">Choisis une matière</p>
            <ul id="choix-matiere-liste" class="choix-matiere-liste"></ul>
          </div>
          <div id="parcours" class="parcours cache">
            <p id="parcours-estimation" class="avertissement"></p>
            <div id="parcours-liste" class="parcours-liste" aria-live="polite"></div>
          </div>
          <p id="liste-dans-barre" class="liste-dans-barre">Les leçons de cette matière sont listées dans la barre, à gauche.</p>
          <div id="parcours-attente" class="attente-ligne cache" aria-live="polite">Chargement…</div>
        </section>
        <div id="lecon" class="lecon cache">
          <div class="lecon-entete">
            <h1 id="lecon-titre"></h1>
            <p id="lecon-meta" class="lecon-meta"></p>
          </div>
          <p id="lecon-avertissement" class="avertissement cache"></p>

          <div class="progression" aria-hidden="false">
            <div class="progression-barre"><div id="progression-remplie" class="progression-remplie"></div></div>
            <span id="progression-texte" class="progression-texte"></span>
          </div>

          <div id="blocs" class="blocs"></div>

          <div id="lecon-fin" class="lecon-fin cache" aria-live="polite">
            <p>🎉 Bravo, tu as fini cette leçon !</p>
            <button type="button" class="bouton" id="retour-parcours">Retour au parcours</button>
          </div>
        </div>

        <div id="lecon-erreur" class="erreur-page cache" role="alert"></div>
      </main>

      <aside id="panneau-jules" class="panneau-jules" aria-label="Jules, à côté du cours">
        <div class="panneau-entete">
          <img src="/api/persona/avatar" alt="">
          <strong id="jules-nom">Jules</strong>
          <button type="button" class="fermer" id="jules-fermer" aria-label="Fermer le panneau de Jules">✕</button>
        </div>
        <div id="jules-fil" class="jules-fil" aria-live="polite"></div>
        <form id="jules-formulaire" class="jules-saisie">
          <label for="jules-texte" class="cache-visuel">Écrire à Jules</label>
          <textarea id="jules-texte" rows="1" placeholder="Écris à Jules…" disabled></textarea>
          <button type="submit" class="rond envoyer" id="jules-envoyer" title="Envoyer" disabled>➤</button>
        </form>
      </aside>
    </div>
  </div>

  <script src="/static/symboles.js"></script>
  <script src="/rappels.js"></script>
  <script src="/static/commun.js"></script>
  <script src="/static/navigation.js"></script>
  <script src="/static/outils-hote.js"></script>
  <script src="/static/lecture-vocale.js"></script>
  <script src="/static/cours.js"></script>
</body>
</html>
