      - id: notions-cycle4-non-datees-3e
        titre: "Notions de cycle 4 non spécifiquement datées en 3e (grammaire générale de la phrase)"
        notions:
          - id: constituants-phrase-simple
            titre: "Constituants et fonctions de la phrase simple"
            niveau_programme: "cycle 4"
            attendus:
              - "Distinguer les principaux constituants de la phrase et les hiérarchiser."
              - "Reconnaître le sujet même dans les cas complexes (sujet éloigné) ; approfondir la connaissance du COD et du COI ; identifier les compléments circonstanciels."
              - "Analyser la phrase à la forme impersonnelle."
              - "Identifier les expansions du nom (épithète, complément du nom) et l'apposition."
              - "Identifier les classes de mots (nom, verbe, adjectif et ses degrés, déterminants, pronoms, adverbe, préposition, conjonctions, groupe nominal)."
              - "Identifier les types (déclaratif, interrogatif, impératif) et les formes (négative, passive, exclamative, impersonnelle) de phrase."
            mots_cles: [constituants de la phrase, classes de mots, types de phrase, formes de phrase]
            brevet: true
            source: "Programme cycle 4, annexe 3, Français — Étude de la langue, « Analyser le fonctionnement de la phrase simple et de la phrase complexe »"
          - id: constituants-phrase-complexe
            titre: "Constituants et relations de la phrase complexe"
            niveau_programme: "cycle 4"
            attendus:
              - "Distinguer phrase simple / complexe."
              - "Connaître les notions de juxtaposition, coordination, subordination."
              - "Analyser les positions des propositions subordonnées (conjonctive, interrogative indirecte, relative, infinitive, participiale) et leurs relations avec les autres constituants de la phrase."
            mots_cles: [juxtaposition, coordination, subordination, proposition subordonnée]
            brevet: true
            source: "Programme cycle 4, annexe 3, Français — Étude de la langue, « Analyser le fonctionnement de la phrase simple et de la phrase complexe »"
