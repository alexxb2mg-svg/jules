notion: cm1-espagnol-m-participer-travail-collectif
declencheurs:
- travailler en groupe en espagnol
- coopérer avec des correspondants espagnols
- travail de groupe en espagnol
essentiel: 'Participer à un travail collectif, c''est faciliter un échange en se montrant accueillant, avec des
  mots simples ou des gestes : Hola, bienvenido.

  On donne des consignes ou des ordres simples et ritualisés : Te toca, ¡Vamos a jugar!, ¡Se acabó el tiempo!

  On demande ou on dit si on a compris : ¿Entiendes?'
methode:
- Accueillir les autres avec un mot simple (Hola, bienvenido).
- Donner un tour de parole ou une consigne simple pendant le travail de groupe.
- Demander régulièrement si tout le monde a compris.
- Répondre si on a compris ou pas, pour que le groupe avance ensemble.
vocabulaire: []
erreurs_frequentes:
- Ne jamais vérifier si les autres ont compris pendant un travail de groupe.
- Oublier d'accueillir poliment un nouveau camarade ou un correspondant.
exemple:
  enonce: 'Tu expliques à un camarade comment plier un papier : « Coge una hoja de papel cuadrada. ». Comment vérifies-tu
    qu''il a compris ?'
  solution: ¿Entiendes? (Est-ce que tu as compris ?)
exercices:
- enonce: C'est le tour de ton camarade de jouer. Dis-le-lui simplement.
  indices:
  - Utilise une expression courte et ritualisée.
  solution: ¡Te toca!
- enonce: Le temps est écoulé pendant un jeu de groupe. Que dis-tu ?
  indices:
  - Utilise une expression toute faite pour signaler la fin du temps.
  solution: ¡Se acabó el tiempo!
