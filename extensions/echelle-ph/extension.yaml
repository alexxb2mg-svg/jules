discussion:
  echelle-ph:
    quand: "Pour faire voir l'échelle de pH : ph = pH de la solution (0 à 14) ; le repère glisse sur l'échelle, le bécher montre plus d'ions H⁺ (rouges) en milieu acide, autant à pH 7, plus d'ions HO⁻ (bleus) en milieu basique ; signe d'avertissement « corrosif » à pH ≤ 2 ou ≥ 12."
