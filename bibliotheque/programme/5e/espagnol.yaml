    - id: 5e-espagnol-grammaire-adverbes-et-groupes-prepositionnels
      titre: 'Grammaire : les adverbes et les groupes prepositionnels pour situer dans le temps et l''espace'
      niveau_programme: 5e
      attendus:
      - >-
        Niveau A1+ : exprimer les dates (el 5 de mayo de 2025) et l'heure (son las tres, es la
        una) ; utiliser des marqueurs temporels simples (hoy, esta manana, manana, ayer) ; situer
        dans l'espace a l'aide de prepositions ou d'expressions lexicalisees (debajo de, encima
        de, al lado de, a la derecha, a la izquierda, delante de, detras de) ; utiliser des
        adverbes de frequence (siempre, a menudo, a veces, nunca).
      - >-
        Niveau A2 : utiliser des marqueurs temporels (a las dos, todos los dias, el mes pasado,
        hace seis meses, dentro de dos anos) ; situer dans l'espace (en primer plano / en segundo
        plano, arriba/abajo, a la derecha/a la izquierda) ; exprimer une opposition, une
        concession ou un contraste (pero, sino, sin embargo, en cambio, aunque).
      mots_cles:
      - adverbes
