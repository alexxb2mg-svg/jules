              - "Mettre en évidence les changements de catégorie syntaxique induits par la dérivation (déménager/déménagement ; beau/beauté) et leurs incidences orthographiques."
            mots_cles: [dérivation, composition, néologie, catégorie syntaxique]
            brevet: true
            source: "Programme cycle 4, annexe 3, Français — Étude de la langue, « Enrichir et structurer le lexique »"
