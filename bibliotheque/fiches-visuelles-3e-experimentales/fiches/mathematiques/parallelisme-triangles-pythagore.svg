<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="180.0" y="40" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="59" text-anchor="middle" dominant-baseline="central">Un triangle ABC</text>
<text class="ts" x="340" y="77" text-anchor="middle" dominant-baseline="central">[BC] est son plus grand côté</text></g>
<line x1="300" y1="96" x2="170" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="96" x2="430" y2="140" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="40.0" y="150" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="169" text-anchor="middle" dominant-baseline="central">On sait qu'il est rectangle</text>
<text class="ts" x="140" y="187" text-anchor="middle" dominant-baseline="central">on cherche une longueur</text></g>
<g class="node c-teal"><rect x="320.0" y="150" width="270" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="455" y="169" text-anchor="middle" dominant-baseline="central">On se demande s'il l'est</text>
<text class="ts" x="455" y="187" text-anchor="middle" dominant-baseline="central">on compare BC² et AB² + AC²</text></g>
<line x1="140" y1="206" x2="140" y2="250" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="206" x2="375" y2="250" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="206" x2="545" y2="250" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="372" y="226" text-anchor="end">égaux</text>
<text class="ts" x="538" y="226" text-anchor="start">différents</text>
<g class="node c-purple"><rect x="40.0" y="260" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="279" text-anchor="middle" dominant-baseline="central">Théorème de Pythagore</text>
<text class="ts" x="140" y="297" text-anchor="middle" dominant-baseline="central">BC² = AB² + AC²</text></g>
<g class="node c-green"><rect x="275.0" y="260" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="360" y="279" text-anchor="middle" dominant-baseline="central">Rectangle en A</text>
<text class="ts" x="360" y="297" text-anchor="middle" dominant-baseline="central">réciproque</text></g>
<g class="node c-red"><rect x="470.0" y="260" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="555" y="279" text-anchor="middle" dominant-baseline="central">Pas rectangle</text>
<text class="ts" x="555" y="297" text-anchor="middle" dominant-baseline="central">contraposée</text></g>
<g class="c-gray"><rect x="40" y="350" width="600" height="44" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="372" text-anchor="middle" dominant-baseline="central">Toujours : BC² d'un côté, AB² + AC² de l'autre, puis on conclut.</text></g>
</svg>
