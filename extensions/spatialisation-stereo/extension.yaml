# Fiche 3e d'education musicale « le timbre et l'espace ». Volumes des deux enceintes : loi de panoramique a
# puissance constante, attenuation en 1/distance ; barres sans chiffre. revele: false.
discussion:
  spatialisation-stereo:
    quand: "Pour faire voir la spatialisation en stéréo (éducation musicale) : pan de -5 (gauche) à 5 (droite) place la source, distance de 1 (proche) à 5 (lointain) l'éloigne ; deux barres montrent le volume envoyé à l'enceinte gauche et à l'enceinte droite."
