discussion:
  courbe-releves:
    quand: "Pour faire lire en même temps une courbe de température et un thermomètre : la courbe d'une journée type, un point à l'heure choisie relié au haut de la colonne du thermomètre. heure de 0 à 23, saison 1 hiver, 2 printemps, 3 été, 4 automne (toute la courbe monte ou descend)."
    valeurs:
      heure: {min: 0, max: 23, pas: 1, defaut: 8}
      saison: {min: 1, max: 4, pas: 1, defaut: 2}
