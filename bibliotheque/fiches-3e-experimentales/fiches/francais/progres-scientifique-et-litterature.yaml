notion: progres-scientifique-et-litterature
declencheurs:
- science-fiction
- anticipation
- robot
- voyage dans le temps
- savant fou
- utopie
- dystopie
- monde futuriste
- invention scientifique dans un roman
essentiel: 'La science-fiction est un genre narratif qui raconte des fictions reposant sur des progrès scientifiques
  et techniques, réels ou imaginés, situés dans un futur plus ou moins lointain (l''anticipation), parfois dans
  un passé fictif ou un univers parallèle. Elle explore des thèmes comme le voyage dans le temps, la conquête spatiale,
  la rencontre avec des extraterrestres, ou la confrontation entre l''être humain et ses propres créations (robots,
  clones, intelligences artificielles).

  Cette littérature interroge souvent l''idée de progrès scientifique, tantôt admiré comme une promesse de mieux-être,
  tantôt craint comme une menace. La figure du savant y est ambivalente : génie bienfaiteur ou inventeur dangereux
  et incontrôlable.

  L''utopie (mot inventé par Thomas More, du grec « en nul lieu ») imagine une société idéale, opposée aux sociétés
  réelles imparfaites, souvent pour dénoncer, par contraste, les injustices du monde réel. La dystopie (ou contre-utopie)
  décrit à l''inverse une société où les dirigeants exercent une autorité totale et où les citoyens perdent leur
  liberté : elle sert d''avertissement sur les dérives possibles d''une idéologie ou d''une pratique du présent,
  y compris en matière d''environnement.'
methode:
- Identifier les éléments scientifiques ou techniques (réels ou imaginés) qui font avancer l'histoire.
- Repérer si la société décrite est présentée comme meilleure (utopie) ou pire (dystopie) que la nôtre.
- 'Analyser la figure du savant ou de l''inventeur : est-il présenté positivement ou négativement ?'
- Chercher ce que le texte critique ou questionne dans notre société actuelle, en le projetant dans le futur.
- Distinguer l'aspect divertissant (l'aventure) de l'aspect réflexif (les questions posées) du texte.
vocabulaire:
- terme: anticipation
  definition: récit qui imagine un futur possible à partir de tendances du présent
- terme: utopie
  definition: représentation d'une société idéale, imaginaire
- terme: dystopie
  definition: récit d'une société future organisée pour être impossible à fuir, mettant en garde le lecteur
erreurs_frequentes:
- 'Confondre utopie (société idéale) et dystopie (société oppressive) : la dystopie est souvent une utopie qui a
  mal tourné.'
- Réduire la science-fiction à un simple décor futuriste sans y chercher de questionnement.
- Oublier que la figure du savant peut être ambivalente (à la fois admirable et inquiétante).
- 'Croire que la science-fiction ne parle que du futur : elle parle surtout, indirectement, du présent.'
exemple:
  enonce: Un roman imagine une société parfaitement organisée, où plus personne ne connaît la pauvreté, mais où
    chaque citoyen est surveillé en permanence et n'a plus le droit de choisir son métier. S'agit-il d'une utopie
    ou d'une dystopie ?
  solution: 'C''est une dystopie : malgré l''apparence de perfection (plus de pauvreté), la perte de liberté individuelle
    (surveillance totale, absence de choix) en fait une société oppressive que l''auteur donne probablement à voir
    comme un avertissement.'
exercices:
- enonce: Donne un exemple de thème classique de la science-fiction.
  indices:
  - 'Relis l''essentiel : voyage dans le temps, robots…'
  solution: 'Par exemple : le voyage dans le temps, la conquête spatiale, les robots, le clonage, l''intelligence
    artificielle.'
- enonce: Invente en 5-6 lignes le début d'un court récit d'anticipation situé dans cent ans, qui critique, même
    discrètement, un problème de notre époque actuelle (pollution, écrans, inégalités…).
  indices:
  - Choisis d'abord le problème actuel à critiquer, puis imagine comment il a évolué dans le futur.
  solution: Réussite si le texte situe clairement l'action dans un futur imaginé et si un problème actuel y est
    transposé, même de façon discrète.
