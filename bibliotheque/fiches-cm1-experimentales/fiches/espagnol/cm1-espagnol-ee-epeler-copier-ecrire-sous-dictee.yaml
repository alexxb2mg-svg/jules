notion: cm1-espagnol-ee-epeler-copier-ecrire-sous-dictee
declencheurs:
- copier des mots espagnols
- écrire sous la dictée en espagnol
- épeler un mot en espagnol à l'écrit
essentiel: 'Pour épeler, copier ou écrire sous la dictée en espagnol, on recopie dans son cahier des éléments écrits
  au tableau ou dans un texte court.

  On retranscrit aussi quelques mots qu''on entend, à condition qu''ils soient déjà connus.

  L''important est de bien recopier chaque lettre, sans en oublier, et de penser aux accents (á, é, í, ó, ú) et
  au ñ.'
methode:
- Regarder le mot ou la phrase à copier en entier avant de commencer.
- Copier lettre par lettre, en vérifiant chaque mot et chaque accent.
- Relire ce qu'on a écrit en le comparant au modèle.
- Pour un mot entendu, le répéter dans sa tête avant de l'écrire.
vocabulaire: []
erreurs_frequentes:
- Oublier une lettre ou un accent en copiant un mot espagnol.
- Confondre des lettres qui se ressemblent à l'écrit (b et d, par exemple).
- Ne pas relire ce qu'on a copié.
exemple:
  enonce: Tu dois copier la phrase « En mi mochila, hay un bolígrafo azul y una regla. » depuis l'affichage de la classe.
  solution: Tu recopies la phrase entière, lettre par lettre, en vérifiant chaque mot et chaque accent avec l'affichage.
exercices:
- enonce: 'Copie ce mot déjà connu sans erreur : « tijeras ».'
  indices:
  - Vérifie chaque lettre avant d'écrire la suivante.
  solution: tijeras
- enonce: 'Le professeur dicte lentement : « unas tijeras ». Écris ce que tu entends.'
  indices:
  - Répète les mots dans ta tête avant de les écrire.
  solution: unas tijeras
