notion: cm1-empathie-lutte-discriminations-harcelement
declencheurs:
- se mettre à la place de l'autre
- empathie
- comprendre ce que ressent l'autre
- égoïsme
- altruisme
essentiel: 'L''empathie, c''est le fait de comprendre ce que ressent une autre personne, et de s''en soucier.

  L''altruisme est le contraire de l''égoïsme : c''est penser aux autres et à leur bien-être, pas seulement à soi.

  L''empathie aide à lutter contre les discriminations, la violence physique ou verbale, le harcèlement et les cyberviolences,
  car elle pousse à ne pas faire du mal à quelqu''un dont on comprend la souffrance.'
methode:
- Demande-toi ce que ressent la personne concernée par la situation.
- Distingue une attitude égoïste (penser seulement à soi) d'une attitude altruiste (penser aux autres).
- Relie l'empathie à la lutte contre les discriminations et le harcèlement.
vocabulaire:
- terme: égoïsme
  definition: le fait de penser seulement à soi-même
- terme: altruisme
  definition: le fait de penser aux autres et à leur bien-être
erreurs_frequentes:
- Confondre empathie et simple gentillesse.
- Croire que l'empathie signifie être d'accord avec tout ce que ressent l'autre.
exemple:
  enonce: Un élève voit qu'un camarade est triste parce qu'il est mis à l'écart par le groupe. Il va lui parler
    et l'invite à jouer avec lui. Quelle attitude illustre-t-il ?
  solution: 'Il illustre l''empathie et l''altruisme : il comprend ce que ressent son camarade et agit pour l''aider,
    plutôt que de penser seulement à lui-même.'
exercices:
- enonce: Explique avec tes mots la différence entre égoïsme et altruisme.
  indices:
  - Un des deux mots veut dire « penser seulement à soi ».
  solution: L'égoïsme, c'est penser seulement à soi. L'altruisme, c'est penser aussi aux autres et à leur bien-être.
- enonce: Explique comment l'empathie peut aider à lutter contre le harcèlement.
  indices:
  - Pense à ce que ressent une personne harcelée.
  solution: En comprenant ce que ressent une personne harcelée, on est moins tenté de lui faire du mal, et plus
    tenté de l'aider ou de la défendre.
sources:
