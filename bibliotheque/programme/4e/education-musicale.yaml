matiere: Éducation musicale
id: education-musicale
niveau: 4e
annee_scolaire: 2026-2027
textes_officiels:
- intitule: Programme du cycle 4 (annexe 3) — partie « Éducation musicale »
  reference: BO n° 31 du 30 juillet 2020 (arrêté du 17 juillet 2020)
  url: https://eduscol.education.fr/document/621/download
  consulte_le: '2026-09-24'
- intitule: Enseigner au cycle 4 — confirme que le programme d'éducation musicale 2020 est inchangé pour
    la rentrée 2026-2027
  reference: éduscol
  url: https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4
  consulte_le: '2026-09-24'
perimetre: |
  Le programme d'éducation musicale du cycle 4 (BO n° 31 du 30 juillet 2020) est un programme de cycle, non décliné par année (5e/4e/3e) : deux champs de compétences (production et perception) organisent le programme sur l'ensemble du cycle, structurés autour de six domaines de connaissances complémentaires. Aucune notion n'est réservée explicitement à la 3e seule ; toutes portent la mention "cycle 4". Ce programme est inchangé pour l'année 2026-2027.

  Ce fichier 4e reprend donc le même choix que le référentiel de 3e : les notions du programme de cycle 4 ne sont pas réparties par année car le texte officiel ne le fait pas lui-même (aucun repère annuel de progression n'est publié pour l'éducation musicale) ; les mêmes compétences et domaines de connaissances s'appliquent identiquement en 5e, en 4e et en 3e, la progressivité relevant du choix pédagogique du professeur d'une année sur l'autre.
brevet:
  evalue: false
  epreuve: |
    Pas d'épreuve écrite spécifique d'éducation musicale au DNB. Depuis la session 2026, le contrôle continu se fonde uniquement sur les moyennes annuelles des enseignements obligatoires suivis en classe de 3e (note de service du 2 septembre 2025, BO du 4 septembre 2025) : les notes d'éducation musicale obtenues en classe de 4e n'entrent donc plus dans le calcul du contrôle continu du DNB. Les notions de classe de 4e peuvent en revanche nourrir un objet d'étude présenté à l'épreuve orale de soutenance en 3e.
  source: https://www.education.gouv.fr/bo/2026/Hebdo4/MENE2623228N ; https://www.education.gouv.fr/bo/2026/Special4/MENE2623194N
    ; note de service du 2 septembre 2025 (BO du 4 septembre 2025) sur le contrôle continu
themes:
- id: competences-travaillees
  titre: Compétences travaillées
  chapitres:
  - id: quatre-competences
    titre: Les quatre compétences travaillées
    notions:
    - id: 4e-realiser-projets-musicaux
      titre: Réaliser des projets musicaux d'interprétation ou de création
      niveau_programme: cycle 4
      attendus:
      - Définir les caractéristiques musicales d'un projet, puis en assurer la mise en œuvre en mobilisant
        les ressources adaptées.
      - Interpréter un projet devant d'autres élèves et présenter les choix artistiques effectués.
      mots_cles:
      - interprétation
      - création
      - projet musical
      brevet: false
      source: Programme cycle 4, section « Compétences travaillées »
    - id: 4e-ecouter-comparer-construire-culture
      titre: Écouter, comparer, construire une culture musicale commune
      niveau_programme: cycle 4
      attendus:
      - Analyser des œuvres musicales en utilisant un vocabulaire précis.
      - Situer et comparer des musiques de styles proches ou éloignés dans l'espace et/ou dans le temps
        pour construire des repères techniques et culturels.
      - Identifier par comparaison les différences et ressemblances dans l'interprétation d'une œuvre
        donnée.
      mots_cles:
      - écoute
      - comparaison
      - culture musicale
      brevet: false
      source: Programme cycle 4, section « Compétences travaillées »
    - id: 4e-explorer-imaginer-creer-produire
      titre: Explorer, imaginer, créer et produire
      niveau_programme: cycle 4
      attendus:
      - Réutiliser certaines caractéristiques (style, technique, etc.) d'une œuvre connue pour nourrir
        son travail.
      - Concevoir, réaliser, arranger, pasticher une courte pièce préexistante, notamment à l'aide d'outils
        numériques.
      - Réinvestir ses expériences personnelles de la création musicale pour écouter, comprendre et commenter
        celles des autres.
      mots_cles:
      - exploration
      - création
      - arrangement
      - numérique
      brevet: false
      source: Programme cycle 4, section « Compétences travaillées »
    - id: 4e-echanger-partager-argumenter-debattre
      titre: Échanger, partager, argumenter et débattre
      niveau_programme: cycle 4
      attendus:
      - Porter un regard critique sur sa production individuelle.
      - Développer une critique constructive sur une production collective.
      - Argumenter une critique adossée à une analyse objective.
      - Distinguer les postures de créateur, d'interprète et d'auditeur.
      - Respecter les sources et les droits d'auteur et l'utilisation de sons libres de droit.
      mots_cles:
      - critique
      - argumentation
      - droits d'auteur
      brevet: false
      source: Programme cycle 4, section « Compétences travaillées »
