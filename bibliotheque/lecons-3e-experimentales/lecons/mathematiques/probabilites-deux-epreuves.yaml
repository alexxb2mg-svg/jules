notion: probabilites-deux-epreuves
titre: Probabilités avec deux épreuves
duree_minutes: 30
auteurs:
- projet-jules
licence: CC-BY-SA-4.0
sources:
- titre: Programme du cycle 4 (annexe 3), partie Mathématiques, BO n° 31 du 30 juillet 2020
  url: https://eduscol.education.fr/document/621/download
  licence: etalab-2.0
- titre: Attendus de fin d'année de 3e, Mathématiques, éduscol, 2019
  url: https://eduscol.education.gouv.fr/sites/default/files/document/18-maths-3e-attendus-eduscol1114748pdf-74688.pdf
  licence: etalab-2.0
- titre: Repères annuels de progression, Mathématiques, cycle 4, éduscol, 2019
  url: https://eduscol.education.gouv.fr/sites/default/files/document/26-maths-c4-reperes-eduscol1114756pdf-74694.pdf
  licence: etalab-2.0
relecture:
  statut: a_relire
blocs:
- type: objectifs
  items:
  - Écrire toutes les issues d'une expérience à deux épreuves avec un tableau à double entrée.
  - 'Calculer une probabilité : cases favorables ÷ cases au total.'
  - Distinguer un tirage avec remise et un tirage sans remise.
- type: texte
  titre: Deux épreuves, un couple
  contenu: 'Une expérience à **deux épreuves** enchaîne deux expériences au hasard : deux dés, une pièce
    puis un dé, deux tirages de boules...


    Une **issue** est un **couple** : (premier résultat ; second résultat).


    **L''ordre compte.** Avec deux pièces, (pile ; face) et (face ; pile) sont deux issues différentes.'
- type: texte
  titre: Le tableau à double entrée
  contenu: 'On écrit les résultats de la 1re épreuve en **lignes** et ceux de la 2e en **colonnes**. Chaque
    case est une issue.


    | | P | F |

    |---|---|---|

    | **P** | (P ; P) | (P ; F) |

    | **F** | (F ; P) | (F ; F) |


    Ici : 2 × 2 = 4 issues. Avec deux dés à 6 faces : 6 × 6 = 36 issues.'
- type: texte
  titre: Calculer une probabilité
  contenu: 'Si toutes les cases sont équiprobables :


    **probabilité = nombre de cases favorables ÷ nombre total de cases**


    - Une probabilité est un nombre entre 0 et 1.

    - On simplifie la fraction, ou on donne l''écriture décimale.

    - Événement contraire : **p(non A) = 1 − p(A)**.'
- type: texte
  titre: Avec remise, sans remise
  contenu: '- **Avec remise** : on remet l''objet avant le 2e tirage. La 2e épreuve est la même que la
    1re.

    - **Sans remise** : l''objet tiré n''est plus là. Il ne peut pas sortir deux fois : on barre ces cases
    dans le tableau.


    Si deux boules ont la même couleur, on leur donne des noms différents (R1, R2). Ainsi les issues restent
    équiprobables.'
- type: exemple
  enonce: On lance une pièce équilibrée, puis un dé équilibré à 4 faces (numérotées 1 à 4). Quelle est
    la probabilité d'obtenir pile et un nombre pair ?
  etapes:
  - 'Tableau : 2 lignes (P, F) et 4 colonnes (1, 2, 3, 4). Il y a 2 × 4 = 8 issues équiprobables.'
  - 'Cases favorables : (P ; 2) et (P ; 4). Il y en a 2.'
  - Probabilité = 2 ÷ 8 = 1/4 = 0,25.
- type: exercice
  enonce: On lance deux dés équilibrés à 6 faces. Combien y a-t-il d'issues possibles (cases du tableau
    à double entrée) ?
  forme: nombre
  reponse: 36
  tolerance: 0.01
  indices:
  - Le premier dé donne une ligne du tableau, le second une colonne.
  - Combien de lignes ? Combien de colonnes ? Multiplie.
  explication: 'Le tableau a 6 lignes et 6 colonnes : 6 × 6 = 36 issues.'
- type: exercice
  enonce: On lance deux dés équilibrés à 6 faces et on additionne les deux nombres. Quelle est la probabilité
    que la somme soit égale à 5 ?
  forme: qcm
  choix:
  - 1/12
  - 1/9
  - 1/11
  - 1/36
  reponse: 1
  indices:
  - Il y a 36 issues au total. Écris les couples dont la somme est 5.
  - '(1 ; 4) est un couple. (4 ; 1) en est un autre : dans le tableau, ce sont deux cases.'
  explication: 'Somme 5 : (1 ; 4), (2 ; 3), (3 ; 2), (4 ; 1). Cela fait 4 cases sur 36 : 4/36 = 1/9.'
- type: exercice
  enonce: On lance deux dés équilibrés à 6 faces et on additionne les deux nombres. Combien de cases du
    tableau donnent une somme supérieure ou égale à 10 ?
  forme: nombre
  reponse: 6
  tolerance: 0.01
  indices:
  - Cherche séparément les cases de somme 10, de somme 11 et de somme 12.
  - Pour la somme 10, il y a trois cases. Cherche les autres sommes de la même façon.
  explication: 'Somme 10 : (4 ; 6), (5 ; 5), (6 ; 4). Somme 11 : (5 ; 6), (6 ; 5). Somme 12 : (6 ; 6).
    Total : 3 + 2 + 1 = 6 cases.'
- type: exercice
  enonce: Un sac contient 3 boules rouges et 2 boules bleues. On tire une boule, on ne la remet pas, puis
    on en tire une seconde. Quelle est la probabilité d'obtenir deux boules rouges ? Donne le résultat
    en écriture décimale.
  forme: nombre
  reponse: 0.3
  tolerance: 0.005
  indices:
  - 'Donne un nom à chaque boule : R1, R2, R3, B1, B2. Combien de boules au 1er tirage ? Et au 2e, sans
    remise ?'
  - Le nombre d'issues est 5 × 4. Compte ensuite les cases où les deux boules sont rouges (jamais la même
    boule deux fois).
  explication: 'Il y a 5 × 4 = 20 issues équiprobables. Cases favorables : 3 × 2 = 6. Probabilité : 6/20
    = 0,3.'
- type: exercice
  enonce: On lance deux dés équilibrés à 6 faces et on multiplie les deux nombres obtenus. Quelle est
    la probabilité que le produit soit pair ? Donne le résultat en écriture décimale.
  forme: nombre
  reponse: 0.75
  tolerance: 0.005
  indices:
  - Quand un produit de deux nombres est-il impair ?
  - 'Compte les cases où le produit est impair, puis utilise l''événement contraire : 1 − p(A).'
  - Un produit est impair seulement si les deux dés sont impairs. Chaque dé a trois faces impaires.
  explication: 'Produit impair : les deux dés sont impairs, soit 3 × 3 = 9 cases sur 36, donc 9/36 = 0,25.
    Produit pair : 1 − 0,25 = 0,75.'
- type: question_ouverte
  question: 'Zoé lance deux pièces équilibrées. Elle dit : « Il y a trois cas : deux piles, deux faces,
    un pile et un face. Donc la probabilité d''avoir un pile et un face est 1/3. » Explique pourquoi elle
    se trompe et donne la bonne probabilité.'
  indices:
  - Combien de cases a le tableau à double entrée de deux pièces ?
  - '« Un pile et un face » : est-ce une seule case du tableau ?'
  criteres:
  - 'L''élève liste les quatre issues équiprobables : (P ; P), (P ; F), (F ; P), (F ; F).'
  - 'L''élève explique que « un pile et un face » regroupe deux issues : (P ; F) et (F ; P).'
  - 'L''élève donne la bonne probabilité : 2/4 = 1/2.'
- type: synthese
  consigne: Écris avec tes mots, en deux ou trois phrases, comment tu calcules une probabilité avec un
    tableau à double entrée, et la différence entre avec remise et sans remise.
