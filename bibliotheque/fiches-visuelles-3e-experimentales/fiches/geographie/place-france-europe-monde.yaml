notion: place-france-europe-monde
titre: "La place et l'influence de la France et de l'Europe dans le monde"
matiere: geographie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Organisation internationale de la francophonie »"
    url: "https://fr.wikipedia.org/w/index.php?title=Organisation_internationale_de_la_francophonie&oldid=238754197"
    licence: CC-BY-SA-4.0
  - titre: "Vikidia, « Union européenne »"
    url: "https://fr.vikidia.org/w/index.php?title=Union_europ%C3%A9enne&oldid=2556631"
    licence: CC-BY-SA-3.0
abreviations:
  ONU: "Organisation des Nations unies"
  OIF: "Organisation internationale de la francophonie"
  UE: "Union européenne"
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: influence-france, titre: "Influence de la France dans le monde", sous_titre: "culturelle, géopolitique, économique", principal: true}
      - {id: conseil-securite, titre: "Conseil de sécurité de l'ONU", sous_titre: "membre permanent, droit de veto"}
      - {id: nucleaire, titre: "Arme nucléaire", sous_titre: "puissance militaire"}
      - {id: francophonie, titre: "Francophonie", sous_titre: "OIF, 90 États"}
      - {id: g7-ue, titre: "G7 et UE", sous_titre: "membre fondateur de l'UE"}
    liens:
      - {de: influence-france, vers: conseil-securite, libelle: "s'appuie sur"}
      - {de: influence-france, vers: nucleaire, libelle: "s'appuie sur"}
      - {de: influence-france, vers: francophonie, libelle: "s'appuie sur"}
      - {de: influence-france, vers: g7-ue, libelle: "s'appuie sur"}
    jules: "L'influence de la France repose sur plusieurs piliers : diplomatique, militaire, culturel et économique."

  - id: methode
    type: methode
    etapes:
      - "Identifier le type d'influence à illustrer : culturelle, géopolitique ou économique."
      - "Citer un exemple précis : siège au **Conseil de sécurité**, arme **nucléaire**, **OIF**, **G7**."
      - "Expliquer pourquoi cet exemple montre une influence mondiale et pas seulement européenne."
      - "Relier, si possible, cette influence française à celle de l'**UE** dans son ensemble."
    jules: "Un exemple précis et bien expliqué vaut toujours mieux qu'une liste d'exemples non développés."

  - id: piege
    type: piege
    mauvaise_idee: "Réduire l'influence française à sa seule puissance militaire ou économique."
    pourquoi_faux: "L'influence française est aussi culturelle, notamment via la **francophonie** et l'**OIF**."
    bonne_idee: "Toujours croiser plusieurs types d'influence : militaire, diplomatique, économique ET culturelle."
    jules: "La francophonie touche 90 États et montre que l'influence française dépasse largement le domaine militaire."

  - id: exemple
    type: exemple
    situation: "La France siège en membre permanent au **Conseil de sécurité de l'ONU**, avec un droit de veto, depuis 1945."
    conclusion: "Ce siège permanent illustre une influence géopolitique mondiale rare, partagée avec seulement quatre autres pays."
    jules: "Le droit de veto au Conseil de sécurité est l'un des symboles les plus forts de la puissance diplomatique française."

  - id: renfort
    type: renfort
    liens:
      - {icone: "📖", titre: "Leçon complète", description: "la France et l'Europe dans le monde", outil: "lecon"}
      - {icone: "❓", titre: "Quiz", description: "outil à venir"}
    jules: "Cette fiche clôt le thème 3 : relie-la à la fiche sur le territoire de l'UE pour une vision complète."
