      niveau_programme: cycle 4
      attendus:
      - 'Viser la fluidité, l''intelligibilité, la sécurité linguistique personnelle dans la production
        orale : ne pas viser « l''accent natif ».'
      mots_cles:
      - fluidité
      - intelligibilité
      - accent
      brevet: false
      source: Programme cycle 4, section « Phonologie »
