textes_officiels:
- intitule: Programmes d'enseignements communs et optionnels de langues vivantes etrangeres pour les classes
    de college et de lycee general et technologique (arrete du 5 mai 2025)
  reference: 'BO n 22 du 29 mai 2025 (NOR : MENE2504621A)'
  url: https://www.education.gouv.fr/bo/2025/Hebdo22/MENE2504621A
  consulte_le: '2026-09-24'
- intitule: Programme d'espagnol pour les classes de college (annexe 4 de l'arrete du 5 mai 2025), section
    Classe de cinquieme
  reference: Annexe 4 au BO n 22 du 29 mai 2025
  url: https://www.education.gouv.fr/sites/default/files/annexe-4-programme-d-espagnol-pour-les-classes-de-coll-ge-440358.pdf
  consulte_le: '2026-09-24'
perimetre: >-
  L'article 4 de l'arrete du 5 mai 2025 (BO n 22 du 29 mai 2025, NOR MENE2504621A) echelonne
  l'entree en vigueur des nouveaux programmes de langues vivantes etrangeres classe par classe :
  classe de sixieme a la rentree 2025, classe de cinquieme a la rentree 2026, classe de quatrieme
  a la rentree 2027, classe de troisieme a la rentree 2028. Pour l'annee scolaire 2026-2027, la
  classe de 5e est donc regie par ce nouveau programme, qui remplace pour elle le programme de
  langues vivantes du cycle 4 (BO n 31 du 30 juillet 2020) et qui, a la difference de ce dernier,
  detaille des contenus propres a chaque annee (niveaux de maitrise CECRL, six axes culturels dont
  un axe consacre a un pays de l'aire hispanique — l'Espagne en 5e —, reperes linguistiques).
  Les classes de 4e et de 3e, elles, ne basculent respectivement qu'aux rentrees 2027 et 2028 et
  restent en 2026-2027 sur le programme du cycle 4 de 2020. L'espagnol est le plus souvent enseigne
  en tant que LVB (= LV2), debutant en classe de 5e ; il peut aussi etre enseigne en LVA (= LV1).
  Ce fichier reprend les deux niveaux vises en fin de 5e (A1+ en LVB, A2 en LVA) et l'ensemble
  des contenus culturels et linguistiques de la section Classe de cinquieme, qui ne sont pas
  distingues par langue vivante 1 ou 2 dans le texte. L'espagnol etant le plus souvent LVB, le
  niveau A1+ est le niveau de reference le plus courant pour cette classe.
brevet:
  evalue: false
  epreuve: >-
    Pas d'epreuve ecrite d'espagnol pour les candidats scolaires au DNB serie generale : l'epreuve
    de langue vivante etrangere ecrite (coefficient 2) ne concerne que les candidats "individuels"
    (art. 4 de l'arrete du 31 decembre 2015 modifie). Pour un candidat scolaire, l'espagnol LVB
    n'est evalue qu'en fin de 3e via le controle continu (moyenne annuelle de 3e, 40 % de la note
    finale du DNB) ; les notions de 5e n'entrent donc pas directement dans la notation du DNB.
  source: https://www.education.gouv.fr/bo/2026/Hebdo4/MENE2623228N
