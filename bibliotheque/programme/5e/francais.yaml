        notions:
          - id: 5e-ecrits-de-travail
            titre: "Écrits de travail : listes, synthèses, brouillons d'oral"
            niveau_programme: "5e"
            attendus:
              - "Utiliser différents supports pour écrire, apprendre et mémoriser."
              - "Repérer l'idée principale d'un message écrit ou oral."
              - "Produire des écrits de travail : listes, synthèses, brouillons d'oral, etc."
            mots_cles: [écrit de travail, synthèse, prise de notes]
            brevet: false
            source: "Programme de français pour le cycle 4 (BO n° 10 du 5 mars 2026), Écriture, Cinquième, « Écrire pour réfléchir, apprendre et mémoriser »"
      - id: 5e-ecrire-textes-invention-reflexion
        titre: "Écrire des textes d'invention et de réflexion pour soi et pour autrui"
        notions:
          - id: 5e-textes-narratifs-descriptifs-argumentatifs
            titre: "Textes narratifs, descriptifs et premiers textes argumentatifs"
            niveau_programme: "5e"
            attendus:
              - "Planifier un écrit en étant accompagné dans sa démarche."
              - "S'initier à une pratique artistique et créative de l'écriture, seul ou avec ses pairs."
              - "Écrire des textes narratifs et descriptifs ; écrire un texte à visée argumentative à partir de consignes simples et explicitées."
            mots_cles: [planification, texte narratif, texte descriptif, argumentation]
            brevet: false
            source: "Programme de français pour le cycle 4 (BO n° 10 du 5 mars 2026), Écriture, Cinquième, « Écrire des textes d'invention et de réflexion pour soi et pour autrui »"
      - id: 5e-evaluer-son-ecrit
        titre: "Évaluer son écrit et savoir le faire évoluer"
        notions:
          - id: 5e-brouillon-et-revision
            titre: "Le brouillon comme outil de révision de l'écrit"
            niveau_programme: "5e"
            attendus:
              - "Savoir utiliser le brouillon comme un écrit pour retravailler son texte."
              - "Réviser un écrit en suivant les consignes des professeurs."
              - "Faire évoluer un écrit en fonction de nouvelles consignes."
            mots_cles: [brouillon, révision, réécriture]
            brevet: false
            source: "Programme de français pour le cycle 4 (BO n° 10 du 5 mars 2026), Écriture, Cinquième, « Évaluer son écrit et savoir le faire évoluer »"
  - id: oral
    titre: "Oral"
    chapitres:
