    - id: 5e-espagnol-grammaire-phrase-et-organisation
      titre: 'Grammaire : la phrase et son organisation'
      niveau_programme: 5e
      attendus:
      - >-
        Niveau A1+ : former des phrases simples (affirmatives, negatives avec no et interrogatives
        avec les deux points d'interrogation) ; faire varier le degre d'intensite de la qualite a
        l'aide d'adverbes de degre (muy, mucho, demasiado) ; utiliser quelques conjonctions de
        coordination dans des enonces simples (y, pero, o) ; utiliser quelques connecteurs
        chronologiques ou logiques (primero, luego, despues, por ejemplo, entonces, asi que) ;
        utiliser les modalisateurs quizas, tal vez.
      - >-
        Niveau A2 : exprimer l'intensite avec des adverbes (tan, bastante, realmente,
        completamente, casi) ; formuler des hypotheses, y compris sous forme lexicalisee (si
        miras este cuadro, veras que...) ; passer du discours direct au discours indirect (El
        autor se pregunta si la ciudad nunca duerme) ; utiliser des subordonnees simples avec
        que et porque.
      mots_cles:
      - phrase
      - conjonctions
      - connecteurs
      - hypothese
      - discours indirect
      - A1+
      - A2
