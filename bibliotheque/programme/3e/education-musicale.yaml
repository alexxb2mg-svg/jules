            niveau_programme: "cycle 4"
            attendus:
              - "Identifier, décrire, commenter une organisation musicale complexe et la situer dans un réseau de références musicales et artistiques diversifiées."
            mots_cles: [analyse, organisation musicale, références]
            brevet: false
            source: "Programme cycle 4, « Attendus de fin de cycle »"
          - id: concevoir-creer-realiser-pieces
            titre: "Concevoir, créer et réaliser des pièces musicales"
            niveau_programme: "cycle 4"
            attendus:
