notion: cm1-civisme-action-bien-public
declencheurs:
- bien commun
- agir pour tous
- respecter les règles
- civisme
- c'est quoi être civique
essentiel: 'Le civisme, c''est agir en fonction du bien public, c''est-à-dire en pensant à ce qui est utile à tous,
  et dans le respect des règles.

  Être civique, c''est par exemple respecter les autres, prendre soin des lieux communs (la classe, l''école) et
  respecter l''environnement.

  Le civisme peut se pratiquer dans la vie quotidienne, à l''école, dans la rue ou même en ligne.'
methode:
- Demande-toi si l'action décrite profite seulement à une personne ou à tout le monde.
- Vérifie si l'action respecte les règles communes.
- Si les deux conditions sont réunies, c'est un exemple de civisme.
vocabulaire:
- terme: civisme
  definition: l'action d'une personne en fonction du bien public et dans le respect des règles
erreurs_frequentes:
- Confondre civisme et simple politesse.
- Penser que le civisme ne concerne que l'école, jamais la vie de tous les jours.
- Croire qu'une action civique doit toujours être une grande action, et non un petit geste quotidien.
exemple:
  enonce: Un élève ramasse un papier tombé dans la cour de récréation, alors que ce n'est pas lui qui l'a jeté.
    Est-ce un exemple de civisme ? Pourquoi ?
  solution: 'Oui, c''est un exemple de civisme : cet élève agit dans l''intérêt de tous (une cour propre) et respecte
    les règles de la vie commune, sans que ce soit une obligation.'
exercices:
- enonce: Donne un exemple de comportement civique que tu pourrais avoir dans ta classe.
  indices:
  - Pense à une action qui profite à tout le groupe, pas seulement à toi.
  solution: 'Réponse variable, par exemple : ranger le matériel commun, respecter le tour de parole, ou prévenir
    un adulte en cas de problème.'
- enonce: Explique pourquoi jeter ses déchets à la poubelle dans la cour est un geste civique.
  indices:
  - 'Pense au bien public : à qui profite une cour propre ?'
  solution: 'Parce que cela respecte les règles et profite à tous les élèves qui utilisent la cour : c''est une
    action pour le bien public.'
sources:
