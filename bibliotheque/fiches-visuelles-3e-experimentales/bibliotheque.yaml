# Fiche d'identite de la bibliotheque (format : bibliotheque/README.md)
id: fiches-visuelles-3e-experimentales
titre: "Fiches visuelles 3e expérimentales"
type: fiches-visuelles
statut: experimentale
licence: CC-BY-SA-4.0          # adaptation de contenus CC BY-SA : même licence (partage à l'identique)
pays: FR
niveaux: [3e]
avertissement: >-
  Bibliothèque EXPÉRIMENTALE, pour tester Jules. Fiches visuelles écrites par les contributeurs du
  projet à partir des leçons de `bibliotheque/lecons-3e-experimentales/` et du référentiel officiel
  (sources et licences citées dans chaque fiche), sans validation par un enseignant ni par
  l'Éducation nationale. Elles peuvent contenir des erreurs. Le cours de l'élève fait toujours foi.
description: >-
  Une fiche visuelle par notion, condensé illustré du cours (formule, carte mentale, figure
  interactive, méthode, piège classique, exemple concret, renforcement), affiché sans aucun appel
  au modèle d'IA (format : `bibliotheque/SCHEMA-FICHE-VISUELLE.md`). Cinq fiches de mathématiques
  de 3e, une par notion qui a déjà une leçon dans `lecons-3e-experimentales` : fonctions linéaires
  et affines, Thalès et triangles semblables, parallélisme et Pythagore, équations, probabilités.
