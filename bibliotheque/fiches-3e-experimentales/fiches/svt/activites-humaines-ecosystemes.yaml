notion: activites-humaines-ecosystemes
declencheurs:
- impact humain sur l'environnement
- déforestation
- pollution des écosystèmes
- perte de biodiversité
- impact sur la biodiversité
essentiel: 'Un écosystème est un ensemble formé par un milieu de vie (le biotope : eau, sol, climat…) et tous les
  êtres vivants qui y habitent et interagissent entre eux (la biocénose).

  Les activités humaines (agriculture intensive, déforestation, urbanisation, pêche, pollution, émission de gaz
  à effet de serre) peuvent modifier l''organisation et le fonctionnement des écosystèmes, parfois de façon rapide
  et importante.

  Ces impacts varient selon le rythme (une pollution ponctuelle ou continue), la nature (bénéfices ou nuisances
  pour l''écosystème), l''importance (locale ou globale) et la variabilité des actions humaines.

  Certains impacts sont directs et locaux (destruction d''un habitat par une construction), d''autres sont indirects
  et globaux (le réchauffement climatique modifie des écosystèmes très éloignés de la source des émissions de gaz
  à effet de serre).

  La biodiversité (diversité des espèces et des milieux) est particulièrement sensible à ces impacts : une perturbation
  d''un écosystème peut entraîner la disparition locale ou la raréfaction de certaines espèces.'
methode:
- Identifier le biotope (milieu physique) et la biocénose (êtres vivants) d'un écosystème étudié.
- Repérer l'activité humaine en cause et la manière dont elle modifie le milieu ou les interactions entre espèces.
- Distinguer un impact direct et local d'un impact indirect et global.
- Relier l'ampleur de l'impact à des critères comme le rythme, la nature (bénéfique/nuisible) et l'importance de
  l'action humaine.
erreurs_frequentes:
- Croire que toute activité humaine est forcément nuisible à un écosystème (certaines pratiques agricoles ou de
  gestion peuvent être bénéfiques).
- Confondre écosystème (milieu + êtres vivants en interaction) et simple paysage.
- Penser que les impacts sur les écosystèmes sont toujours locaux, alors que certains sont globaux (climat).
- Ignorer les interactions en chaîne entre espèces d'un même écosystème lors de l'analyse d'un impact.
exemple:
  enonce: La déforestation d'une forêt tropicale pour l'agriculture modifie-t-elle seulement le biotope, ou aussi
    la biocénose ?
  solution: 'Elle modifie les deux : le biotope change (sol, climat local, disponibilité en eau) et la biocénose
    est bouleversée (disparition ou déplacement des espèces qui dépendaient de la forêt).'
exercices:
- enonce: Donner un exemple d'impact direct et local d'une activité humaine sur un écosystème.
  indices:
  - Pense à une action visible immédiatement, sur un site précis.
  solution: La construction d'un parking qui détruit une zone humide et son écosystème local, par exemple.
- enonce: Donner un exemple d'impact indirect et global d'une activité humaine sur les écosystèmes.
  indices:
  - Pense au climat.
  solution: Les émissions de gaz à effet de serre, où qu'elles soient produites, contribuent au réchauffement climatique
    qui affecte des écosystèmes partout sur la planète.
- enonce: Pourquoi une perturbation d'un écosystème peut-elle affecter des espèces qui ne sont pas directement touchées
    par l'activité humaine en cause ?
  indices:
  - Pense aux chaînes alimentaires et aux interactions entre espèces.
  solution: 'Les espèces d''un écosystème interagissent (chaînes alimentaires, compétition, pollinisation…) : perturber
    une espèce ou son milieu peut donc avoir des répercussions en chaîne sur d''autres espèces qui en dépendent.'
