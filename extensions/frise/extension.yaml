id: frise
titre: "Figure : frise chronologique à curseur date"
version: "1.0.0"
licence: MIT
auteurs: ["projet-jules"]
fournit:
  figures: [frise]
permissions: {}
# Frise générique : le gabarit ne connaît AUCUN événement. Les bornes (debut, fin) et une période surlignée
# facultative (de, a) sont des curseurs figés par la fiche (min = max) ; les repères nommés sont les lectures
# du bloc graphe. Curseurs reconnus : « début », fin, date | mois | souvenir, intervalle | auteur, de, « à »
# (voir gabarit.js ; « date » et non « année » parce qu'une condition « si » n'accepte pas d'accent).
# Limite du contrat (curseurs numériques seulement) : un curseur figé reste affiché à l'élève, immobile ; la
# frise ne peut pas écrire le nom d'un événement, seulement des dates ; une seule période surlignée.
# Complète l'outil « frise-chronologique » (remise en ordre d'événements) sans le remplacer.
# revele: les graduations et le repère écrivent des dates : proposée seulement en mode réexplique.
discussion:
  frise:
    quand: "Pour situer une date dans le temps : une frise de debut à fin (années négatives = avant J.-C.), le repère bleu est à l'année date et la partie déjà écoulée se colore. Pratique pour ordonner des événements ou faire sentir une durée."
    revele: true
    valeurs:
      debut: {min: -3000, max: 2025, pas: 1, defaut: 1900}
      fin: {min: -3000, max: 2025, pas: 1, defaut: 2000}
      date: {min: -3000, max: 2025, pas: 1, defaut: 1950}
