# Figure que Jules peut montrer dans la discussion (bloc ```figure, voir docs/EXTENSIONS.md) ; memes bornes que
# les curseurs des fiches CM1 « longueurs » (longueur, largeur, deroule) et « aires » (longueur, largeur, forme).
# revele: false : la figure n'ecrit ni le perimetre ni l'aire ; l'eleve lit le tour sur la regle ou compte
# les carreaux.
discussion:
  rectangle-quadrille:
    quand: "Pour faire voir le périmètre ou l'aire d'un rectangle sur quadrillage en cm, au CM1 : longueur et largeur en cm ; deroule 1 = le tour se déplie sur une règle (périmètre) ; forme 1 = les mêmes carreaux en escalier (même aire). Rien n'est écrit : l'élève lit la règle ou compte."
    valeurs:
      longueur: {min: 1, max: 12, pas: 1, defaut: 5}
      largeur: {min: 1, max: 8, pas: 1, defaut: 3}
      deroule: {min: 0, max: 1, pas: 1, defaut: 0}
      forme: {min: 0, max: 1, pas: 1, defaut: 0}
