            niveau_programme: "CM1"
            attendus:
              - "Connaître la composition du passé composé en deux parties (auxiliaire + participe passé) ; retrouver la forme infinitive du verbe."
              - "Effectuer la transformation à la forme négative d'un verbe au passé composé en insérant les adverbes de négation à leur juste place."
              - "Identifier par une première approche la composition de la terminaison des verbes conjugués : la marque de temps et la marque de personne."
              - "Connaître les marques de personne pour le présent de l'indicatif, l'imparfait et le futur ; savoir isoler les marques de temps de l'imparfait (-ai-, -i-) et du futur (-r-)."
              - "Mettre en évidence les variations du radical pour certains verbes du premier groupe (avant-dernière syllabe avec e muet ou é, verbes en -yer, -eler et -eter, -cer, -ger)."
              - "Conjugaisons à mémoriser et à maîtriser : présent de l'indicatif, imparfait, futur, passé composé des verbes être et avoir, des verbes du premier et du deuxième groupe et des verbes irréguliers du troisième groupe (faire, aller, dire, venir, pouvoir, voir, vouloir, prendre)."
            mots_cles: [conjugaison, présent, imparfait, futur, passé composé, radical]
            source: "Programme de français cycle 3 (BO 16 du 17-4-2025), Grammaire et orthographe grammaticale, Cours moyen première année, « Approfondir sa maîtrise de la conjugaison », p.18"
