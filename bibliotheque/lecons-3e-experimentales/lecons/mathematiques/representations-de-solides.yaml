notion: representations-de-solides
titre: "Représentations et sections planes de solides"
duree_minutes: 30
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme du cycle 4 (annexe 3), partie Mathématiques, BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Attendus de fin d'année de 3e, Mathématiques, éduscol, 2019"
    url: "https://eduscol.education.gouv.fr/sites/default/files/document/18-maths-3e-attendus-eduscol1114748pdf-74688.pdf"
    licence: etalab-2.0
  - titre: "Repères annuels de progression, Mathématiques, cycle 4, éduscol, 2019"
    url: "https://eduscol.education.gouv.fr/sites/default/files/document/26-maths-c4-reperes-eduscol1114756pdf-74694.pdf"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - type: objectifs
    items:
      - "Connaître les règles de la perspective cavalière, des vues et des patrons."
      - "Trouver la nature d'une section plane d'un solide."
      - "Calculer un rayon ou une aire de section (Pythagore, coefficient de réduction)."

  - type: texte
    titre: "Perspective, vues, patrons"
    contenu: >-
      **Perspective cavalière** : les faces de face sont en vraie grandeur. Les arêtes fuyantes
      sont obliques, parallèles et raccourcies. Les arêtes cachées sont en pointillés.


      **Vues** : de face, de dessus, de côté, ou **en coupe** (on coupe pour voir l'intérieur).
      Un cylindre posé sur sa base donne un disque vu de dessus.


      **Patron** : le solide déplié à plat. Le cube a 6 carrés.

  - type: texte
    titre: "Les patrons du cylindre et du cône"
    contenu: >-
      **Cylindre** (rayon r, hauteur h) : 2 disques et un rectangle.
      Le rectangle a pour côtés **h** et **2 × π × r** (le tour du disque).


      **Cône de révolution** : un disque et un secteur de disque.
      L'arc du secteur a la même longueur que le périmètre du disque de base.

  - type: texte
    titre: "Les sections planes"
    contenu: >-
      Une **section plane** est la figure obtenue en coupant un solide par un plan.


      - Pavé coupé parallèlement à une face : un rectangle.

      - Cylindre : parallèle à la base, un disque ; parallèle à l'axe, un rectangle.

      - Pyramide ou cône coupé parallèlement à la base : une **réduction** de la base,
      de coefficient **k = distance au sommet ÷ hauteur**.

      - Sphère coupée par un plan : un cercle. À la distance d du centre : **r² + d² = R²**.

  - type: exemple
    enonce: >-
      Une boule de centre O a un rayon de 13 cm. On la coupe par un plan situé à 5 cm de O.
      Quel est le rayon de la section ?
    etapes:
      - "La section est un disque. Soit r son rayon."
      - "Le centre O, le centre de la section et un point du bord forment un triangle rectangle."
      - "L'hypoténuse est le rayon de la boule : 13. Un côté de l'angle droit est 5."
      - "r² + 5² = 13², donc r² = 169 − 25 = 144, donc r = 12 cm."

  - type: exercice
    enonce: "On coupe un cylindre par un plan parallèle à son axe. Quelle est la forme de la section ?"
    forme: qcm
    choix:
      - "un disque"
      - "un rectangle"
      - "un triangle"
      - "un cercle"
    reponse: 1
    indices:
      - "Imagine un tube de carton coupé dans le sens de la longueur."
      - "La tranche a deux côtés droits de la hauteur du cylindre."
    explication: "Une coupe parallèle à l'axe d'un cylindre donne un rectangle. Parallèle à la base, on aurait un disque."

  - type: exercice
    enonce: >-
      On dessine le patron d'un cylindre de rayon 5 cm et de hauteur 12 cm.
      Quelle est la longueur du rectangle qui forme la surface latérale, arrondie au dixième ?
    forme: nombre
    reponse: 31.4
    tolerance: 0.05
    unite: cm
    indices:
      - "Quand on enroule le rectangle, sa longueur fait le tour de quelle figure ?"
      - "C'est le périmètre du disque de base : 2 × π × r."
      - "Calcule 2 × π × r à la calculatrice avec r = 5, puis arrondis au dixième."
    explication: "Périmètre du disque : 2 × π × 5 = 10π ≈ 31,416, soit 31,4 cm au dixième."

  - type: exercice
    enonce: >-
      Un cône a une hauteur de 12 cm et une base de rayon 9 cm. On le coupe par un plan parallèle à la base,
      à 8 cm du sommet. Quel est le rayon de la section, en cm ?
    forme: nombre
    reponse: 6
    tolerance: 0.01
    unite: cm
    indices:
      - "La section est une réduction de la base. Quel est le coefficient k ?"
      - "k = distance au sommet ÷ hauteur. Attention : pas la distance à la base."
      - "k = 8/12, à simplifier. Multiplie le rayon de la base par k."
    explication: "k = 8 ÷ 12 = 2/3. Rayon de la section : 9 × 2/3 = 6 cm."

  - type: exercice
    enonce: >-
      Une pyramide a pour hauteur 15 cm et pour base un carré de côté 12 cm.
      On la coupe par un plan parallèle à la base, à 5 cm du sommet.
      Quelle est l'aire de la section, en cm² ?
    forme: nombre
    reponse: 16
    tolerance: 0.01
    unite: cm²
    indices:
      - "La section est un carré. Quel est le coefficient de réduction ?"
      - "k = 5/15 = 1/3. Calcule le côté du carré de section."
      - "Le côté est 12 fois k. Puis calcule l'aire du carré."
    explication: "k = 5/15 = 1/3. Côté de la section : 12 ÷ 3 = 4 cm. Aire : 4 × 4 = 16 cm²."

  - type: exercice
    enonce: >-
      Une boule a un rayon de 17 cm. On la coupe par un plan situé à 8 cm de son centre.
      La section est un disque. Quelle est son aire, arrondie à l'unité, en cm² ?
    forme: nombre
    reponse: 707
    tolerance: 0.5
    unite: cm²
    indices:
      - "Commence par le rayon de la section : fais un triangle rectangle avec Pythagore."
      - "r² + 8² = 17². Calcule r² sans chercher tout de suite r."
      - "r² = 225. L'aire d'un disque est π × r² : calcule π × 225."
    explication: "r² = 17² − 8² = 289 − 64 = 225, donc r = 15 cm. Aire = π × 225 ≈ 706,86, soit 707 cm²."

  - type: question_ouverte
    question: >-
      Explique comment est fait le patron d'un cône de révolution. Dis quelle relation existe
      entre le disque de base et le secteur de disque.
    indices:
      - "Quelles figures composent le patron ?"
      - "Quand on replie, le bord du disque de base se colle sur une partie du secteur."
    criteres:
      - "L'élève dit que le patron est composé d'un disque (la base) et d'un secteur de disque (la surface latérale)."
      - "L'élève dit que la longueur de l'arc du secteur est égale au périmètre du disque de base."

  - type: synthese
    consigne: >-
      Écris, avec tes mots, comment trouver la forme d'une section, et comment calculer son rayon
      pour une sphère et pour un cône.
