# Jules - configuration commune (publiee). Ne rien mettre de personnel ici.
# Les reglages propres a une famille (profil de l'enfant, codes, moteur IA, acces tablette)
# vont dans config.local.yaml, cree a partir de config.local.exemple.yaml et jamais publie.
#
# Chaque brique se choisit par son id (= nom du fichier) :
#   persona/<id>/               -> personnalite du bot (persona.yaml + fichiers .md)
#   profils/<id>.yaml           -> ce que le bot sait de l'eleve
#   jules/modules/<id>.py       -> fonctions (memoire, suivi, rapport...)
#   jules/notifieurs/<id>.py    -> canaux vers le parent
#   jules/llm/<id>.py           -> moteur d'IA
#   bibliotheque/<id>/          -> notions du programme et contenus par notion (voir bibliotheque/README.md)

serveur:
  hote: 127.0.0.1          # seulement cet ordinateur. Tablette sur le wifi : voir config.local.exemple.yaml
  port: 8795

persona: jules
profil: exemple            # eleve fictive ; le vrai profil se choisit dans config.local.yaml

llm:
  backend: demo            # demo (sans IA, pour decouvrir) | anthropic | openai_compatible (OpenAI, Mistral, Ollama...)
  delai_s: 180
  historique_max: 30       # nombre de messages renvoyes au modele a chaque tour

acces:
  # Empreintes des codes (jamais le code en clair), ecrites par `python lancer.py code eleve|parent`
  # dans config.local.yaml. Vide = acces libre, refuse des que le serveur est visible sur le reseau.
  code_eleve: ""
  code_parent: ""

modules:
  - id: modes          # modes de travail = fichiers consignes/modes/*.md
  - id: notions        # rattache la conversation a une notion du programme et nourrit Jules avec
    reglages:
      bibliotheques:   # ordre = priorite (la premiere qui renseigne un point l'emporte)
        - programme                    # referentiel : les notions du programme officiel
        - fiches-3e-experimentales     # fiches de test, contenus libres, NON certifiees
        - fiches-cm1-experimentales    # fiches de test CM1, ressources officielles eduscol, NON certifiees
      detection: true  # reconnait la notion dans le texte ou la photo de l'exercice
  - id: cours          # interface de lecon guidee, notion par notion (etape 2)
    reglages:
      bibliotheques:   # bibliotheques de type 'lecons', par ordre de priorite
        - lecons-3e-experimentales     # ecrite par le lot B ; absente = module actif sans lecon
  - id: studio         # l'eleve fabrique ses supports de revision, Jules relit (etape 4) ; apres 'cours'
  - id: memoire        # ce que le bot retient du parcours de l'eleve (notions, faits)
  - id: suivi          # analyse chaque echange (matiere, notion, statut)
  - id: vigilance      # signaux inquietants -> alerte immediate au parent
  - id: epreuve        # quelques jours apres, reprend sans aide les notions marquees comprises
    reglages:
      delai_jours: 3   # age minimum d'une notion comprise pour etre reprise
      fenetre_jours: 30
      notions_max: 3
  - id: rapport        # resume quotidien pour le parent
    reglages:
      heure: "20:00"
      questions: true  # une ou deux questions a poser a l'eleve, sans savoir faire l'exercice

notifieurs:
  - id: fichier        # donnees/notifications/AAAA-MM-JJ.log
  - id: telegram
    actif: false       # a activer dans config.local.yaml
    reglages:
      token_env: JULES_TELEGRAM_TOKEN
      chat_id_env: JULES_TELEGRAM_CHAT_ID
