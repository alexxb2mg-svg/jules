    - id: 5e-espagnol-grammaire-nom-et-groupe-nominal
      titre: 'Grammaire : le nom, forme et fonction du groupe nominal'
      niveau_programme: 5e
      attendus:
      - >-
        Niveau A1+ : la concordance genre et nombre (el chico alto / la chica alta / los chicos
        altos / las chicas altas) ; les articles definis (el, la, los, las) et indefinis (un, una,
        unos, unas) ; les determinants demonstratifs (este/esta/estos/estas,
        ese/esa/esos/esas) ; les determinants possessifs (mi, tu, su, nuestro/a, vuestro/a,
        su) ; la formation du pluriel des noms et adjectifs (libro > libros, ciudad > ciudades,
        feliz > felices).
      - >-
        Niveau A2 : utiliser des antonymes (separacion/union, tranquilo/ruidoso, urbano/rural) ;
        etablir des comparaisons en utilisant des adjectifs connus associes a des comparatifs et
        des superlatifs (mas... que, menos... que, tan... como, el/la mas... de ; mejor, peor,
        mayor, menor) ; l'apocope de certains adjectifs (buen, mal, gran, primer, tercer).
      mots_cles:
