notion: cm1-egalite-en-droit-dignite-personne
declencheurs:
- égalité
- dignité
- tout le monde pareil devant la loi
- respecter une personne
- discrimination
essentiel: 'L''égalité en droit signifie que toutes les personnes ont les mêmes droits, quelle que soit leur différence.

  Le principe de dignité de la personne humaine signifie que chaque être humain doit être respecté, sans exception.

  Une discrimination ou une atteinte à la personne d''autrui, c''est quand ce respect ou cette égalité ne sont pas
  respectés.'
methode:
- Vérifie si toutes les personnes de la situation ont les mêmes droits.
- Vérifie si le respect dû à chaque personne humaine est bien présent.
- Si l'égalité ou la dignité ne sont pas respectées, identifie qu'il s'agit d'une atteinte ou d'une discrimination.
vocabulaire:
- terme: égalité
  definition: le fait que toutes les personnes aient les mêmes droits
- terme: dignité de la personne humaine
  definition: le respect dû à chaque être humain, sans exception
erreurs_frequentes:
- Croire que l'égalité en droit signifie que tout le monde doit être traité exactement de la même manière en toute
  situation.
- Penser que le respect de la dignité ne concerne que les adultes.
exemple:
  enonce: Dans une situation fictive, deux enfants ont le droit de participer à un jeu de la cour, quelles que soient
    leurs différences. Quel principe cette situation illustre-t-elle ?
  solution: 'Cette situation illustre l''égalité en droit : les deux enfants ont les mêmes droits, malgré leurs
    différences.'
exercices:
- enonce: Explique avec tes mots ce que veut dire « dignité de la personne humaine ».
  indices:
  - Pense au respect que l'on doit à chaque être humain.
  solution: Cela veut dire que chaque être humain mérite le respect, sans exception.
- enonce: Donne un exemple, réel ou inventé, où l'égalité entre deux personnes n'est pas respectée.
  indices:
  - Pense à une situation où une personne n'a pas les mêmes droits qu'une autre.
  solution: 'Réponse variable, par exemple : une personne empêchée de participer à une activité à cause d''une différence
    (origine, apparence, etc.), sans raison valable.'
sources:
