id: demi-droite-graduee
titre: "Figure : un grand nombre entier sur une demi-droite graduée, avec loupes"
version: "1.0.0"
licence: MIT
auteurs: ["projet-jules"]
fournit:
  figures: [demi-droite-graduee]
permissions: {}
# Figure que Jules peut montrer dans la discussion ; memes bornes que les curseurs de la fiche CM1 « numeration des
# entiers ». Le point n'est pas etiquete, mais les deux bouts de chaque ligne de loupe sont ecrits.
# revele: au zoom 2 et 3, la figure ecrit l'encadrement du nombre (entre 200 000 et 300 000, puis entre 240 000 et
# 250 000) : c'est la reponse d'un exercice « encadrer » ou « placer ».
discussion:
  demi-droite-graduee:
    quand: "Pour placer un grand nombre entier (n milliers : n = 245 place 245 000) sur une demi-droite graduée de 0 à 1 000 000 en bonds de 100 000 ; zoom = 2 ajoute une loupe en bonds de 10 000, zoom = 3 une seconde loupe en bonds de 1 000. Sert à encadrer un nombre et à comprendre la valeur des chiffres."
    revele: true
    valeurs:
      n: {min: 0, max: 999, pas: 1, defaut: 245}
      zoom: {min: 1, max: 3, pas: 1, defaut: 1}
