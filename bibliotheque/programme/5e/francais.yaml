            niveau_programme: "5e"
            attendus:
              - "Pratiquer un oral adapté à la situation de communication."
              - "Prendre la parole seul et s'exprimer de façon fluide ; entrer dans un dialogue."
              - "Intervenir dans un débat en respectant les règles d'un échange argumentatif."
            mots_cles: [oral, dialogue, débat, fluidité]
            brevet: false
            source: "Programme de français pour le cycle 4 (BO n° 10 du 5 mars 2026), Oral, Cinquième, « Prendre la parole, communiquer et interagir »"
      - id: 5e-ecouter-comprendre-interpreter
        titre: "Écouter, comprendre et interpréter"
        notions:
          - id: 5e-ecoute-memorisation-visees
            titre: "Écoute active, mémorisation des éléments et compréhension des visées"
            niveau_programme: "5e"
            attendus:
              - "Écouter une production orale et en mémoriser les principaux éléments."
              - "Comprendre les visées d'une production orale spécifique."
            mots_cles: [écoute active, visée d'un discours, mémorisation]
            brevet: false
            source: "Programme de français pour le cycle 4 (BO n° 10 du 5 mars 2026), Oral, Cinquième, « Écouter, comprendre et interpréter »"
      - id: 5e-dire-lire-jouer-un-texte
