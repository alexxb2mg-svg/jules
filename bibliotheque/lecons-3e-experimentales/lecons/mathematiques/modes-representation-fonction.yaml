notion: modes-representation-fonction
titre: Passer d'un mode de représentation d'une fonction à un autre
duree_minutes: 30
auteurs:
- projet-jules
licence: CC-BY-SA-4.0
sources:
- titre: Programme du cycle 4 (annexe 3) — partie Mathématiques — BO n° 31 du 30 juillet 2020
  url: https://eduscol.education.fr/document/621/download
  licence: etalab-2.0
- titre: Attendus de fin d'année de 3e — Mathématiques — éduscol, 2019
  url: https://eduscol.education.gouv.fr/sites/default/files/document/18-maths-3e-attendus-eduscol1114748pdf-74688.pdf
  licence: etalab-2.0
- titre: Repères annuels de progression — Mathématiques, cycle 4 — éduscol, 2019
  url: https://eduscol.education.gouv.fr/sites/default/files/document/26-maths-c4-reperes-eduscol1114756pdf-74694.pdf
  licence: etalab-2.0
relecture:
  statut: a_relire
blocs:
- type: objectifs
  items:
  - Traduire un programme de calcul en expression, puis compléter un tableau de valeurs.
  - 'Placer et lire des points d''une représentation graphique : (abscisse ; ordonnée).'
  - Dire si un point appartient à la courbe d'une fonction, en calculant.
- type: texte
  titre: Quatre façons de donner une fonction
  contenu: 'Une même fonction peut se présenter de quatre façons :


    | Mode | Exemple |

    |---|---|

    | Programme de calcul | « Choisir un nombre, le multiplier par 2, ajouter 1 » |

    | Expression | f(x) = 2x + 1 |

    | Tableau de valeurs | x : 0 ; 1 ; 2 → f(x) : 1 ; 3 ; 5 |

    | Représentation graphique | les points (x ; f(x)) |


    Le nombre choisi au départ est **x**. Le résultat est **f(x)**.'
- type: texte
  titre: Du programme à l'expression, puis au tableau
  contenu: '**Programme → expression.** On part de x et on écrit chaque étape.

    - Quand une opération porte sur **tout** le résultat précédent, on met des **parenthèses**.

    - « Ajouter 3 puis multiplier par 2 » donne **2(x + 3)**.


    **Expression → tableau.** On remplace x par chaque valeur, et on calcule.

    - Un nombre négatif se met entre parenthèses : pour f(x) = 2x + 1, f(−2) = 2 × (−2) + 1 = −3.'
- type: texte
  titre: Du tableau au graphique, et retour
  contenu: '**Tableau → graphique.** Chaque colonne donne un point **(x ; f(x))**.

    - On écrit l''**abscisse** (x) d''abord, puis l''**ordonnée** (f(x)).

    - Si les points sont alignés, on trace une droite. Sinon, on les relie par une courbe régulière, sans
    pointes.


    **Graphique → tableau.** Pour une abscisse choisie, on lit l''ordonnée du point.


    **Point sur la courbe ?** Le point (a ; b) est sur la courbe **exactement quand f(a) = b**. On calcule
    f(a) et on compare à b.'
- type: exemple
  enonce: 'Programme : « Choisir un nombre, ajouter 5, puis multiplier par 4. » Écris f(x), complète le
    tableau pour x = −3, 0 et 2, puis dis si le point (1 ; 24) est sur la courbe.'
  etapes:
  - 'On part de x. On ajoute 5 : x + 5. On multiplie tout le résultat par 4 : f(x) = 4(x + 5).'
  - 'Pour x = −3 : f(−3) = 4 × (−3 + 5) = 4 × 2 = 8.'
  - 'Pour x = 0 : f(0) = 4 × 5 = 20. Pour x = 2 : f(2) = 4 × 7 = 28. Points : (−3 ; 8), (0 ; 20), (2 ;
    28).'
  - 'Point (1 ; 24) : f(1) = 4 × 6 = 24. C''est bien l''ordonnée du point : il est sur la courbe.'
- type: exercice
  enonce: Soit g(x) = 5x − 3. Quel nombre écrit-on dans le tableau de valeurs sous x = −2 ?
  forme: nombre
  reponse: -13
  tolerance: 0.01
  indices:
  - Remplace x par (−2) dans l'expression 5x − 3.
  - Calcule d'abord 5 × (−2), puis enlève 3 au résultat.
  explication: g(−2) = 5 × (−2) − 3 = −10 − 3 = −13.
- type: exercice
  enonce: 'Programme de calcul : « Choisir un nombre x. Soustraire 2. Multiplier le résultat par 5. »
    Quelle expression correspond à ce programme ?'
  forme: qcm
  choix:
  - 5x − 2
  - 5(x − 2)
  - x − 2 × 5
  - 5x + 2
  reponse: 1
  indices:
  - Écris le résultat après chaque étape, en partant de x.
  - Après la première étape, on a x − 2. C'est ce résultat entier qui est multiplié.
  explication: 'Étape 1 : x − 2. Étape 2 : on multiplie tout le résultat par 5, donc 5(x − 2). Les parenthèses
    sont nécessaires.'
- type: exercice
  enonce: Soit h(x) = 2x² − 1. Le point A(3 ; k) est sur la courbe de h. Calcule k.
  forme: nombre
  reponse: 17
  tolerance: 0.01
  indices:
  - Un point est sur la courbe si son ordonnée est l'image de son abscisse. Que vaut donc k ?
  - 'Calcule h(3). Attention : x² veut dire x × x, à calculer avant de multiplier.'
  explication: k = h(3) = 2 × 3² − 1 = 2 × 9 − 1 = 18 − 1 = 17.
- type: exercice
  enonce: 'Voici le tableau de valeurs d''une fonction f. Ligne des x : 0 ; 1 ; 2 ; 3. Ligne des f(x)
    : 4 ; 7 ; 10 ; 13. On sait que f(x) = ax + 4. Calcule f(10).'
  forme: nombre
  reponse: 34
  tolerance: 0.01
  indices:
  - 'Regarde de combien augmente f(x) quand x augmente de 1 : c''est le nombre a.'
  - Écris l'expression complète de f, avec la valeur de a trouvée.
  - Remplace ensuite x par 10 dans cette expression.
  explication: 'Quand x augmente de 1, f(x) augmente de 3 : a = 3, donc f(x) = 3x + 4. Alors f(10) = 3
    × 10 + 4 = 34.'
- type: exercice
  enonce: 'Programme A : « Choisir un nombre, le multiplier par 2, puis ajouter 6. » Programme B : « Choisir
    un nombre, puis soustraire 1. » Pour quel nombre de départ les deux programmes donnent-ils le même
    résultat ?'
  forme: nombre
  reponse: -7
  tolerance: 0.01
  indices:
  - Écris l'expression de chaque programme en partant de x.
  - 'Les deux résultats sont égaux : écris l''égalité 2x + 6 = x − 1.'
  - Mets les x d'un côté et les nombres de l'autre, puis résous.
  explication: 'A : 2x + 6. B : x − 1. On résout 2x + 6 = x − 1, donc x = −1 − 6 = −7. Vérification :
    A(−7) = −14 + 6 = −8 et B(−7) = −8.'
- type: question_ouverte
  question: Comment peux-tu savoir si le point M(a ; b) est sur la courbe d'une fonction f sans dessiner
    la courbe ? Explique avec un exemple de ton choix.
  indices:
  - Quelle coordonnée de M est le nombre de départ ? Laquelle est son image ?
  - Que dois-tu calculer, puis comparer ?
  criteres:
  - L'élève dit qu'on calcule f(a) avec la formule, puis qu'on compare le résultat à b.
  - 'L''élève conclut : si f(a) = b le point est sur la courbe, sinon il n''y est pas.'
  - L'élève donne un exemple chiffré cohérent (formule, calcul, conclusion).
- type: synthese
  consigne: Écris avec tes mots, en deux ou trois phrases, comment on passe d'un programme de calcul à
    une expression, puis à un tableau, puis à des points d'une courbe.
