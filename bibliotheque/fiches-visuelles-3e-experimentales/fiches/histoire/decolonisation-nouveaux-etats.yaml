notion: decolonisation-nouveaux-etats
titre: "La décolonisation et les nouveaux États"
matiere: histoire
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Vikidia, « Décolonisation »"
    url: "https://fr.vikidia.org/w/index.php?title=D%C3%A9colonisation&oldid=1258479"
    licence: CC-BY-SA-3.0
relecture: {statut: a_relire}
abreviations:
  FLN: "Front de libération nationale"
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: decolonisation, titre: "Décolonisation", sous_titre: "accès à l'indépendance", principal: true}
      - {id: asie, titre: "Asie", sous_titre: "1945-1955"}
      - {id: afrique, titre: "Afrique", sous_titre: "1955-1975"}
      - {id: inde-pakistan, titre: "Inde et Pakistan", sous_titre: "1947, voie négociée"}
      - {id: algerie, titre: "Algérie", sous_titre: "1954-1962, voie violente"}
    liens:
      - {de: decolonisation, vers: asie, libelle: "première vague"}
      - {de: decolonisation, vers: afrique, libelle: "seconde vague"}
      - {de: asie, vers: inde-pakistan, libelle: "exemple"}
      - {de: afrique, vers: algerie, libelle: "exemple"}
    jules: "Deux vagues, deux continents : l'**Asie** se décolonise d'abord, puis l'**Afrique** prend le relais dans les années 1950-1970."

  - id: methode
    type: methode
    etapes:
      - "Situer l'événement dans le temps : Asie **1945-1955**, Afrique **1955-1975**."
      - "Choisir un exemple précis pour illustrer : Inde et Pakistan (1947) ou Algérie (1954-1962)."
      - "Distinguer une indépendance **négociée** (discussions, accord) d'une indépendance **violente** (guerre, répression)."
    jules: "Un exemple bien daté et bien qualifié (négocié ou violent) vaut mieux qu'une liste de pays sans dates."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que toutes les indépendances se sont passées de la même façon, sans violence."
    pourquoi_faux: "L'indépendance de l'**Inde** en 1947 est négociée, mais celle de l'**Algérie** (1954-1962) est une guerre très violente menée par le **FLN**."
    bonne_idee: "Toujours préciser si l'exemple choisi est une décolonisation négociée ou une décolonisation violente."
    jules: "Le mot « décolonisation » cache des réalités très différentes selon le pays."

  - id: exemple
    type: exemple
    situation: "L'Algérie, colonie française, réclame son indépendance à partir de 1954."
    calcul: "Le **FLN** lance l'insurrection en novembre 1954 ; la guerre dure jusqu'en 1962, avec des violences des deux côtés."
    conclusion: "Les accords d'Évian, signés en 1962, mettent fin à la guerre et donnent l'indépendance à l'**Algérie**."
    jules: "Retiens le nom du mouvement (FLN) et celui de l'accord final (Évian) : ce sont les deux repères attendus."

  - id: schema
    type: schema
    titre: "Deux vagues de décolonisation, deux exemples"
    svg: |
      <svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <g class="node c-teal">
          <rect x="60" y="40" width="260" height="56" rx="8" stroke-width="0.5"/>
          <text class="th" x="190" y="58" text-anchor="middle" dominant-baseline="central">Asie</text>
          <text class="ts" x="190" y="76" text-anchor="middle" dominant-baseline="central">1945-1955</text>
        </g>
        <g class="node c-coral">
          <rect x="360" y="40" width="260" height="56" rx="8" stroke-width="0.5"/>
          <text class="th" x="490" y="58" text-anchor="middle" dominant-baseline="central">Afrique</text>
          <text class="ts" x="490" y="76" text-anchor="middle" dominant-baseline="central">1955-1975</text>
        </g>
        <line x1="320" y1="68" x2="360" y2="68" class="arr" stroke="#888780" marker-end="url(#arrow)"/>
        <g class="node c-blue">
          <rect x="60" y="140" width="260" height="56" rx="8" stroke-width="0.5"/>
          <text class="th" x="190" y="158" text-anchor="middle" dominant-baseline="central">Inde et Pakistan — 1947</text>
          <text class="ts" x="190" y="176" text-anchor="middle" dominant-baseline="central">indépendance négociée</text>
        </g>
        <g class="node c-red">
          <rect x="360" y="140" width="260" height="56" rx="8" stroke-width="0.5"/>
          <text class="th" x="490" y="158" text-anchor="middle" dominant-baseline="central">Algérie — 1954-1962</text>
          <text class="ts" x="490" y="176" text-anchor="middle" dominant-baseline="central">guerre, FLN, accords d'Évian</text>
        </g>
        <line x1="190" y1="96" x2="190" y2="140" class="leader" stroke="#888780" marker-end="url(#arrow)"/>
        <line x1="490" y1="96" x2="490" y2="140" class="leader" stroke="#888780" marker-end="url(#arrow)"/>
      </svg>
    jules: "Le schéma oppose la voie négociée (bleu) et la voie violente (rouge) à l'intérieur de chaque vague."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "❓", titre: "Quiz", description: "outil à venir"}
    jules: "Entraîne-toi ensuite à situer d'autres exemples de décolonisation sur une frise chronologique."
