# Propose chaque semaine les mises a jour de securite des dependances et des actions GitHub.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependances]
    cooldown:
      default-days: 7   # laisse une semaine a la communaute pour reperer une version piegee

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependances]
    cooldown:
      default-days: 7

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    labels: [dependances]
