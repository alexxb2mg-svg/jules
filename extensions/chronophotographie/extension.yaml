# Figure que Jules peut montrer dans la discussion (bloc ```figure, voir docs/EXTENSIONS.md) ; memes bornes
# que les curseurs de la fiche 3e « mouvement et vitesse ». La figure n'ecrit aucune vitesse ni distance :
# elle ne donne pas la reponse d'un exercice (revele: false).
discussion:
  chronophotographie:
    quand: "Pour faire voir une chronophotographie : un point par seconde, écarts égaux = mouvement uniforme, écarts qui grandissent = accéléré, qui diminuent = ralenti ; r = 1 montre la même scène vue du train (le passager est immobile, l'arbre recule)."
    valeurs:
      v: {min: 1, max: 10, pas: 1, defaut: 5}
      e: {min: -1, max: 1, pas: 1, defaut: 0}
      r: {min: 0, max: 1, pas: 1, defaut: 0}
