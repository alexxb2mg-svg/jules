notion: volume-boule-et-assemblages
essentiel: 'Une sphère de centre O et de rayon r est formée des points situés à la distance r de O ; la boule est
  la sphère « pleine » (tous les points à une distance inférieure ou égale à r).

  Aire de la sphère : A = 4πr². Volume de la boule : V = (4/3)πr³.

  Rappels : pavé V = L × l × h ; prisme et cylindre V = aire de la base × hauteur (cylindre : πr²h) ; pyramide et
  cône V = (aire de la base × hauteur) / 3 (cône : πr²h/3).

  Un assemblage de solides a pour volume la somme des volumes (ou la différence si on creuse un solide dans un autre).

  Si on multiplie le rayon par k, le volume est multiplié par k³ (rayon double : volume × 8).'
methode:
- Décomposer l'objet en solides connus (cylindre + demi-boule, cube − boule…).
- Relever les dimensions utiles ; attention, un diamètre est le double du rayon.
- Écrire chaque formule, garder π dans les calculs (valeur exacte) et arrondir seulement à la fin.
- Additionner ou soustraire les volumes, avec des unités cohérentes (cm³, m³ ; 1 L = 1 dm³).
erreurs_frequentes:
- Utiliser le diamètre à la place du rayon.
- Oublier le cube (r³) ou le coefficient 4/3.
- Confondre aire de la sphère (en cm²) et volume de la boule (en cm³).
- Oublier de diviser par 2 pour une demi-boule, ou par 3 pour un cône.
- Mélanger les unités (cm et m) dans un même calcul.
exemple:
  enonce: Calculer le volume d'une boule de rayon 3 cm (valeur exacte, puis arrondie au dixième).
  solution: V = (4/3) × π × 3³ = (4/3) × π × 27 = 36π cm³ ≈ 113,1 cm³.
exercices:
- enonce: Un silo est formé d'un cylindre de rayon 4 m et de hauteur 10 m, surmonté d'une demi-boule de même rayon.
    Calculer son volume, arrondi au m³.
  indices:
  - 'Cylindre : π × r² × h.'
  - 'Demi-boule : la moitié de (4/3)πr³.'
  solution: 'Cylindre : 160π m³ ; demi-boule : (2/3)π × 64 = (128/3)π m³. Total : (608/3)π ≈ 637 m³.'
- enonce: On place une boule de diamètre 10 cm dans une boîte cubique d'arête 10 cm. Quel volume reste libre ? Quel
    pourcentage de la boîte la boule occupe-t-elle ?
  indices:
  - Le rayon vaut 5 cm.
  - Volume libre = cube − boule.
  solution: 'Cube : 1 000 cm³ ; boule : (4/3)π × 125 ≈ 523,6 cm³. Libre ≈ 476 cm³ ; la boule occupe environ 52 %.'
- enonce: Si on double le rayon d'une boule, par combien son volume est-il multiplié ?
  indices:
  - Compare (2r)³ et r³.
  solution: Par 2³ = 8.
- enonce: Calculer le volume d'un cône de rayon 3 cm et de hauteur 4 cm, au dixième.
  indices:
  - V = π × r² × h / 3
  solution: V = π × 9 × 4 / 3 = 12π ≈ 37,7 cm³.
