notion: effectifs-et-frequences
titre: "Effectifs et fréquences"
duree_minutes: 25
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme du cycle 4 (annexe 3), partie Mathématiques, BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Attendus de fin d'année de 3e, Mathématiques, éduscol, 2019"
    url: "https://eduscol.education.gouv.fr/sites/default/files/document/18-maths-3e-attendus-eduscol1114748pdf-74688.pdf"
    licence: etalab-2.0
  - titre: "Repères annuels de progression, Mathématiques, cycle 4, éduscol, 2019"
    url: "https://eduscol.education.gouv.fr/sites/default/files/document/26-maths-c4-reperes-eduscol1114756pdf-74694.pdf"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - type: objectifs
    items:
      - "Trouver l'effectif d'une valeur et l'effectif total d'une série."
      - "Calculer une fréquence (fraction, décimal, pourcentage)."
      - "Retrouver un effectif ou l'effectif total à partir d'une fréquence, et comparer deux groupes."

  - type: texte
    titre: "Effectif et effectif total"
    contenu: |
      Une **série statistique** est un ensemble de données.

      - L'**effectif** d'une valeur : le nombre de fois où elle apparaît.
      - L'**effectif total** : le nombre de toutes les données. C'est la somme des effectifs.

      On range souvent les données dans un **tableau d'effectifs**. On vérifie que la somme redonne l'effectif total.

  - type: texte
    titre: "La fréquence"
    contenu: |
      **fréquence = effectif de la valeur ÷ effectif total**

      - Elle s'écrit en fraction, en décimal ou en **pourcentage**.
      - Décimal → pourcentage : on multiplie par 100.
      - Elle est toujours comprise entre 0 et 1 (entre 0 % et 100 %).
      - La somme de toutes les fréquences vaut 1 (soit 100 %).
      - Si ça ne tombe pas juste, on arrondit et on le dit : 1/3 ≈ 0,33, soit environ 33 %.

  - type: texte
    titre: "Retrouver un effectif, comparer, conclure"
    contenu: |
      - Retrouver un effectif : **effectif = effectif total × fréquence**.
      - Avec un pourcentage : effectif total × pourcentage ÷ 100.
      - Retrouver l'effectif total : **effectif ÷ fréquence**.
      - Pour comparer deux groupes de tailles différentes, on compare les **fréquences**, pas les effectifs.
      - Un tableur permet de calculer effectifs et fréquences pour beaucoup de données.
      - On conclut par une phrase : « 27,5 % des élèves viennent en bus ».

  - type: exemple
    enonce: >-
      Dans une classe de 24 élèves, 9 élèves choisissent la pizza pour le repas de fin d'année.
      Quelle est la fréquence de « pizza » ?
    etapes:
      - "Effectif de la valeur « pizza » : 9. Effectif total : 24."
      - "Fréquence = 9 ÷ 24 = 0,375."
      - "En pourcentage : 0,375 × 100 = 37,5 %."
      - "Phrase : « 37,5 % des élèves de la classe choisissent la pizza »."

  - type: exercice
    enonce: >-
      Voici les notes de 10 élèves : 12 ; 15 ; 12 ; 9 ; 12 ; 15 ; 8 ; 12 ; 10 ; 9.
      Quel est l'effectif de la note 12 ?
    forme: nombre
    reponse: 4
    tolerance: 0.01
    indices:
      - "L'effectif d'une valeur, c'est le nombre de fois où elle apparaît."
      - "Parcours la liste en entier et fais un trait à chaque fois que tu lis cette note."
      - "La première note 12 est la 1re de la liste. Cherche les autres."
    explication: "La note 12 apparaît en 1re, 3e, 5e et 8e position : son effectif est 4."

  - type: exercice
    enonce: >-
      Dans un collège, 120 élèves sont interrogés. 36 d'entre eux vont au collège à vélo.
      Quelle est la fréquence des élèves qui viennent à vélo, en pourcentage ? Écris seulement le nombre.
    forme: nombre
    reponse: 30
    tolerance: 0.01
    unite: "%"
    indices:
      - "Quel est l'effectif de la valeur « vélo » ? Quel est l'effectif total ?"
      - "Calcule effectif ÷ effectif total, puis multiplie le résultat par 100."
      - "Le quotient s'écrit avec un seul chiffre après la virgule. Multiplie-le par 100."
    explication: "36 ÷ 120 = 0,3 et 0,3 × 100 = 30. Donc 30 % des élèves viennent à vélo."

  - type: exercice
    enonce: "Dans un groupe de 60 élèves, 35 % pratiquent la natation. Combien d'élèves cela représente-t-il ?"
    forme: nombre
    reponse: 21
    tolerance: 0.01
    indices:
      - "35 %, c'est 35 pour 100. Ici, le groupe est plus petit que 100."
      - "Effectif = effectif total × pourcentage ÷ 100."
      - "Pose le calcul 60 × 35, puis divise le résultat par 100."
    explication: "60 × 35 ÷ 100 = 2 100 ÷ 100 = 21 élèves."

  - type: exercice
    enonce: >-
      Le collège Hugo compte 150 élèves et 45 d'entre eux sont des filles demi-pensionnaires.
      Le collège Sand compte 90 élèves et 36 d'entre eux sont des filles demi-pensionnaires.
      Quelle affirmation est vraie ?
    forme: qcm
    choix:
      - "La part de filles demi-pensionnaires est plus grande à Hugo, car il y en a plus."
      - "La part de filles demi-pensionnaires est plus grande à Sand."
      - "La part de filles demi-pensionnaires est la même dans les deux collèges."
    reponse: 1
    indices:
      - "Les deux collèges n'ont pas le même effectif total. Que faut-il comparer ?"
      - "Calcule la fréquence de chaque collège, en pourcentage."
    explication: "Hugo : 45 ÷ 150 = 0,30, soit 30 %. Sand : 36 ÷ 90 = 0,40, soit 40 %. Il y a plus de filles à Hugo, mais leur part est plus grande à Sand."

  - type: exercice
    enonce: >-
      Dans un club de sport, 18 adhérents ont moins de 16 ans. Ils représentent 45 % de tous les adhérents.
      Combien le club compte-t-il d'adhérents en tout ?
    forme: nombre
    reponse: 40
    tolerance: 0.01
    indices:
      - "Ici, on connaît l'effectif de la valeur et sa fréquence. Que cherche-t-on ?"
      - "Effectif total = effectif ÷ fréquence. Écris 45 % en décimal."
      - "45 % = 0,45. Calcule 18 ÷ 0,45. Vérifie ensuite : le résultat × 0,45 redonne 18."
    explication: "45 % = 0,45. Effectif total = 18 ÷ 0,45 = 40. Vérification : 40 × 0,45 = 18."

  - type: question_ouverte
    question: >-
      En 3e A, 12 élèves sur 30 ont un chat. En 3e B, 15 élèves sur 50 ont un chat.
      Léo dit : « Il y a plus d'élèves avec un chat en 3e B, donc c'est la classe où on a le plus de chats. »
      A-t-il raison ? Explique avec des calculs.
    indices:
      - "Les deux classes n'ont pas le même nombre d'élèves. Que faut-il comparer ?"
      - "Calcule la fréquence de chaque classe, en pourcentage."
    criteres:
      - "L'élève remarque que les classes n'ont pas le même effectif total, donc qu'il faut comparer les fréquences."
      - "L'élève calcule 12/30 = 40 % et 15/50 = 30 % et conclut que la part est plus grande en 3e A, malgré un effectif plus petit."
      - "L'élève écrit une phrase de conclusion."

  - type: synthese
    consigne: >-
      Écris en deux ou trois phrases ce que tu retiens : ce que sont l'effectif et la fréquence,
      comment on passe de l'un à l'autre, et pourquoi on compare des fréquences plutôt que des effectifs.
