# Modele de reglages locaux. Copier ce fichier en config.local.yaml puis l'adapter.
# config.local.yaml n'est jamais publie (.gitignore) : c'est ici que vont les reglages de la famille.
# Les cles API ne vont PAS ici : elles restent dans des variables d'environnement (voir .env.exemple).

# 1. Le profil de l'enfant : copier profils/exemple.yaml en profils/<prenom>.yaml, le remplir,
#    puis indiquer son nom ici.
profil: exemple

# 2. Le moteur d'IA : decommenter UN des blocs ci-dessous.

# --- Anthropic (Claude), cle API payante -------------------------------------
# llm:
#   backend: anthropic
#   cle_env: ANTHROPIC_API_KEY
#   modeles:
#     principal: claude-sonnet-5
#     rapide: claude-haiku-4-5

# --- OpenAI, cle API payante -------------------------------------------------
# llm:
