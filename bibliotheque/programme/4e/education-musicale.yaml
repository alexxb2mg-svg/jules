      niveau_programme: cycle 4
      attendus:
      - Apports du numérique à la création et à la diffusion musicales.
      - Outils numériques simples pour capter les sons (enregistrement), les manipuler (timbre) et les
        organiser dans le temps (séquence).
      mots_cles:
