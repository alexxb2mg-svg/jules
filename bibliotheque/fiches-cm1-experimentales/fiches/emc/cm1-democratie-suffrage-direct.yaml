notion: cm1-democratie-suffrage-direct
declencheurs:
- voter
- élection
- démocratie
- suffrage direct
- conseil d'élèves
- élire un délégué
essentiel: 'La démocratie est un système où les citoyens participent aux décisions, notamment par le vote.

  Le suffrage direct est une façon de voter où les citoyens votent eux-mêmes pour élire une personne, sans intermédiaire.

  En France, la démocratie repose sur des principes présents dans la Déclaration des droits de l''homme et du citoyen
  (articles 3, 6 et 16) : la souveraineté populaire, l''égalité devant la loi et la séparation des pouvoirs.

  Un conseil d''élèves est une première expérience de démocratie scolaire.'
methode:
- Vérifie s'il s'agit d'une décision prise par le vote des citoyens.
- Distingue le suffrage direct (les citoyens votent eux-mêmes) d'un autre mode de décision.
- Relie la situation aux principes de citoyenneté, de vote et de participation aux décisions.
vocabulaire:
- terme: démocratie
  definition: un système où les citoyens participent aux décisions, notamment par le vote
- terme: suffrage direct
  definition: un vote où les citoyens élisent eux-mêmes une personne, sans intermédiaire
erreurs_frequentes:
- Croire que la démocratie se limite au seul acte de voter, sans lien avec la participation aux décisions.
- Confondre voter et être obligé de suivre l'avis d'une seule personne.
exemple:
  enonce: Dans une classe, chaque élève vote directement pour élire un délégué qui représentera la classe. Quel
    mot désigne ce type de vote ?
  solution: 'C''est un exemple de suffrage direct : les élèves votent eux-mêmes, sans intermédiaire, pour élire
    leur délégué.'
exercices:
- enonce: Explique avec tes mots ce que signifie le mot « démocratie ».
  indices:
  - Pense à qui participe aux décisions dans une démocratie.
  solution: La démocratie est un système où les citoyens participent aux décisions, par exemple en votant.
- enonce: Pourquoi organiser l'élection d'un délégué de classe est-il une première expérience de démocratie ?
  indices:
  - Pense au vote et à la participation de chaque élève.
  solution: Parce que chaque élève participe à une décision commune en votant, comme les citoyens dans une démocratie.
