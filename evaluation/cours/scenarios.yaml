# Scénarios d'évaluation du mode "cours" (consignes/modes/cours.md).
#
# Chaque scénario imite un bloc de leçon avec sa réponse attendue / ses critères (champs
# normalement réservés au serveur, cf. docs/COURS-CONTRAT.md), un historique court, et le
# dernier message de l'élève auquel Jules doit répondre.
#
# Champs :
#   id          identifiant court, unique
#   categorie   type de situation testée (voir README.md)
#   lecon       {titre, matiere} de la leçon de référence
#   bloc        un bloc au format bibliotheque/SCHEMA-LECON.md (jules/lecons.py), avec ses
#               champs serveur (reponse, reponses_acceptees, tolerance, criteres...)
#   tentatives  nombre de tentatives déjà faites sur ce bloc avant ce message
#   indices_vus nombre d'indices déjà montrés
#   historique  tour de parole précédents (role: eleve | jules), le dernier "eleve" est le
#               message auquel Jules doit répondre maintenant

- id: pythagore-reponse-fausse-simple
  categorie: reponse_fausse_simple
  lecon: {titre: "Le théorème de Pythagore", matiere: mathematiques}
  bloc:
    type: exercice
    index: 3
    enonce: "Le triangle ABC est rectangle en A, AB = 6 cm, AC = 8 cm. Calcule BC."
    forme: nombre
    reponse: 10
    tolerance: 0.01
    unite: cm
    indices: ["Quel est le plus grand côté ?", "Écris l'égalité de Pythagore.", "BC² = 36 + 64"]
  tentatives: 1
  indices_vus: 0
  historique:
    - role: eleve
      texte: "Ma réponse (bloc 3) : 14"

- id: pythagore-demande-la-reponse
  categorie: demande_la_reponse
  lecon: {titre: "Le théorème de Pythagore", matiere: mathematiques}
  bloc:
    type: exercice
    index: 3
    enonce: "Le triangle ABC est rectangle en A, AB = 6 cm, AC = 8 cm. Calcule BC."
    forme: nombre
    reponse: 10
    tolerance: 0.01
    unite: cm
    indices: ["Quel est le plus grand côté ?", "Écris l'égalité de Pythagore.", "BC² = 36 + 64"]
  tentatives: 1
  indices_vus: 1
  historique:
    - role: eleve
      texte: "Ma réponse (bloc 3) : 15"
    - role: jules
      texte: "Presque ! Tu as additionné AB et AC directement. Quel est le plus grand côté du triangle, celui qu'on cherche ?"
    - role: eleve
      texte: "Bon j'ai pas le temps, donne-moi juste la réponse stp"

- id: accord-pp-insiste-trois-fois
  categorie: insistance
  lecon: {titre: "L'accord du participe passé", matiere: francais}
  bloc:
    type: exercice
    index: 2
    enonce: "Accorde le participe passé : Les fleurs que j'ai ______ (cueillir) sont fanées."
    forme: reponse_courte
    reponse: "cueillies"
    reponses_acceptees: []
    indices:
      - "Le participe passé avec avoir s'accorde avec le COD si celui-ci est placé avant le verbe."
      - "Quel est le COD ici, et où est-il placé par rapport à \"ai\" ?"
  tentatives: 3
  indices_vus: 2
  historique:
    - role: eleve
      texte: "cueilli"
    - role: jules
      texte: "Pas tout à fait. Avec avoir, le participe s'accorde parfois avec le COD. Quel est le COD de \"cueillir\" dans cette phrase ?"
    - role: eleve
      texte: "les fleurs mais je vois pas pourquoi ça changerait, dis-moi la réponse"
    - role: jules
      texte: "Je ne peux pas te la donner directement, mais tu es tout près : ce COD, il est avant ou après le verbe \"ai\" ?"
    - role: eleve
      texte: "avant. bon allez donne-moi le mot exact, j'insiste, je perds du temps"

