notion: cm1-phases-de-la-lune
declencheurs:
- lune
- pleine lune
- croissant de lune
- phase de la lune
- forme de la lune
essentiel: 'La Lune n''a pas toujours la même forme vue depuis la Terre : elle passe par plusieurs phases qui se
  répètent (nouvelle lune, croissant, pleine lune, etc.).

  En observant et en schématisant la Lune pendant deux lunaisons (deux cycles complets), on constate qu''il existe
  un cycle et on peut nommer les différentes phases.'
methode:
- Observer la Lune dans le ciel, si possible chaque soir ou chaque nuit dégagée.
- Schématiser la forme observée (dessin simple de la partie éclairée visible).
- Répéter l'observation pendant deux lunaisons (deux cycles).
- Comparer les schémas pour constater qu'un cycle de phases se répète, et nommer chaque phase.
erreurs_frequentes:
- Observer une seule fois et croire que la forme de la Lune ne change jamais.
- Oublier de schématiser régulièrement, ce qui empêche de voir le cycle.
- Ne pas observer assez longtemps (une seule lunaison ne suffit pas toujours à bien voir la répétition).
exemple:
  enonce: Comment savoir si la forme de la Lune suit un cycle qui se répète ?
  solution: 'On observe et on schématise la Lune régulièrement pendant deux lunaisons : si les mêmes formes reviennent
    dans le même ordre, cela confirme l''existence d''un cycle.'
exercices:
- enonce: Pendant combien de lunaisons (cycles complets) observe-t-on la Lune en classe pour être sûr qu'un cycle
    se répète ?
  indices:
  - Il faut voir le cycle au moins revenir une fois.
  solution: Deux lunaisons.
- enonce: Que doit faire l'élève à chaque observation de la Lune, pour garder une trace ?
  indices:
  - Ce n'est pas seulement regarder.
  solution: Il doit schématiser la forme observée, pour pouvoir comparer les observations plus tard.
- enonce: Pourquoi observer la Lune une seule fois ne suffit-il pas pour comprendre ses phases ?
  indices:
  - Qu'est-ce qu'on ne peut pas voir en une seule observation ?
  solution: Une seule observation ne montre qu'une forme à un instant donné ; il faut plusieurs observations réparties
    dans le temps pour voir le cycle des phases se répéter.
sources:
