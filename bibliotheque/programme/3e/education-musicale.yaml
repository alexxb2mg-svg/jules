# DONNÉES D'EXPÉRIMENTATION — référentiel 3e 2026-2027 de Jules.
# Découpage fait par les contributeurs à partir des textes officiels cités ci-dessous,
# non relu par un enseignant, non publié par le ministère. Le cours de l'élève fait foi.
matiere: Éducation musicale
id: education-musicale
niveau: 3e
annee_scolaire: "2026-2027"
statut: experimentale
relecture: a_relire          # a_relire | relue (par un enseignant)
avertissement: >-
  Données d'expérimentation, non validées par un enseignant ni par l'Éducation nationale.
  Le cours de l'élève et la parole de son professeur font toujours foi.
textes_officiels:
  - intitule: "Programme du cycle 4 (annexe 3) — partie « Éducation musicale »"
    reference: "BO n° 31 du 30 juillet 2020 (arrêté du 17 juillet 2020)"
    url: "https://eduscol.education.fr/document/621/download"
    consulte_le: "2026-09-23"
  - intitule: "Enseigner au cycle 4 — confirme que le programme d'éducation musicale 2020 est inchangé pour la rentrée 2026-2027"
    reference: "éduscol"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    consulte_le: "2026-09-23"
perimetre: >
  Le programme d'éducation musicale du cycle 4 (BO n° 31 du 30 juillet 2020) est un programme de cycle,
  non décliné par année (5e/4e/3e) : deux champs de compétences (production et perception) organisent
  le programme sur l'ensemble du cycle, structurés autour de six domaines de connaissances complémentaires.
  Aucune notion n'est réservée explicitement à la 3e seule ; toutes portent la mention "cycle 4". Ce
  programme est inchangé pour l'année 2026-2027.
brevet:
  evalue: true
  epreuve: >
    Pas d'épreuve écrite spécifique d'éducation musicale au DNB. La discipline est évaluée via le
    contrôle continu (moyenne annuelle de 3e, 40 % de la note finale du DNB) ; l'enseignement facultatif
    de chant choral, s'il est suivi, ajoute au contrôle continu les points au-dessus de 10/20 de sa
    moyenne. La discipline peut aussi alimenter l'épreuve orale de soutenance si l'élève y présente un
    objet d'étude ou un projet lié à la musique (histoire des arts, EPI, parcours d'éducation artistique
    et culturelle).
  source: "https://www.education.gouv.fr/bo/2026/Hebdo4/MENE2623228N ; https://www.education.gouv.fr/bo/2026/Special4/MENE2623194N"
themes:
  - id: competences-travaillees
    titre: "Compétences travaillées"
    chapitres:
      - id: quatre-competences
        titre: "Les quatre compétences travaillées"
        notions:
          - id: realiser-projets-musicaux
            titre: "Réaliser des projets musicaux d'interprétation ou de création"
            niveau_programme: "cycle 4"
            attendus:
              - "Définir les caractéristiques musicales d'un projet, puis en assurer la mise en œuvre en mobilisant les ressources adaptées."
              - "Interpréter un projet devant d'autres élèves et présenter les choix artistiques effectués."
            mots_cles: [interprétation, création, projet musical]
            brevet: false
            source: "Programme cycle 4, section « Compétences travaillées »"
          - id: ecouter-comparer-construire-culture
            titre: "Écouter, comparer, construire une culture musicale commune"
            niveau_programme: "cycle 4"
            attendus:
              - "Analyser des œuvres musicales en utilisant un vocabulaire précis."
              - "Situer et comparer des musiques de styles proches ou éloignés dans l'espace et/ou dans le temps pour construire des repères techniques et culturels."
              - "Identifier par comparaison les différences et ressemblances dans l'interprétation d'une œuvre donnée."
            mots_cles: [écoute, comparaison, culture musicale]
            brevet: false
            source: "Programme cycle 4, section « Compétences travaillées »"
          - id: explorer-imaginer-creer-produire
            titre: "Explorer, imaginer, créer et produire"
            niveau_programme: "cycle 4"
            attendus:
              - "Réutiliser certaines caractéristiques (style, technique, etc.) d'une œuvre connue pour nourrir son travail."
              - "Concevoir, réaliser, arranger, pasticher une courte pièce préexistante, notamment à l'aide d'outils numériques."
              - "Réinvestir ses expériences personnelles de la création musicale pour écouter, comprendre et commenter celles des autres."
            mots_cles: [exploration, création, arrangement, numérique]
            brevet: false
            source: "Programme cycle 4, section « Compétences travaillées »"
          - id: echanger-partager-argumenter-debattre
            titre: "Échanger, partager, argumenter et débattre"
            niveau_programme: "cycle 4"
            attendus:
              - "Porter un regard critique sur sa production individuelle."
              - "Développer une critique constructive sur une production collective."
              - "Argumenter une critique adossée à une analyse objective."
              - "Distinguer les postures de créateur, d'interprète et d'auditeur."
              - "Respecter les sources et les droits d'auteur et l'utilisation de sons libres de droit."
            mots_cles: [critique, argumentation, droits d'auteur]
            brevet: false
            source: "Programme cycle 4, section « Compétences travaillées »"
  - id: attendus-fin-de-cycle
    titre: "Attendus de fin de cycle"
    chapitres:
