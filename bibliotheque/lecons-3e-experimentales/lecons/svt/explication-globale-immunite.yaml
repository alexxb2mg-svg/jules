notion: explication-globale-immunite
titre: Explication globale des réactions immunitaires
duree_minutes: 30
auteurs:
- projet-jules
licence: CC-BY-SA-4.0
sources:
- titre: Programme d'enseignement du cycle des approfondissements (cycle 4) — volet 3, Sciences de la vie et de
    la Terre (annexe 3, arrêté du 17-7-2020) — BO n° 31 du 30 juillet 2020
  url: https://eduscol.education.fr/document/621/download
  licence: etalab-2.0
- titre: Définition des épreuves de l'examen du diplôme national du brevet à compter de la session 2027 — épreuve
    de sciences — Note de service du 11-9-2026, BO spécial n° 4 du 17 septembre 2026, NOR MENE2623228N
  url: https://www.education.gouv.fr/bo/2026/Hebdo4/MENE2623228N
