id: serie-statistique
titre: "Figure : série de notes sur un axe (moyenne, médiane, étendue)"
version: "1.0.0"
licence: MIT
auteurs: ["projet-jules"]
fournit:
  figures: [serie-statistique]
permissions: {}
# Figure que Jules peut montrer dans la discussion (bloc ```figure, voir docs/EXTENSIONS.md) ; memes bornes que
# les curseurs des fiches 3e « indicateurs de position » (v) et « etendue d'une serie » (v, vue figee a 1).
# revele false : la serie est fixe (8, 9, 10, 11, 12, 13 et v), la figure place la moyenne, la mediane ou
# l'etendue sur l'axe gradue sans ecrire leur valeur ; l'eleve lit l'axe (comme rectangle-quadrille).
discussion:
  serie-statistique:
    quand: "Pour faire voir, en 3e, sur une série de sept notes (8, 9, 10, 11, 12, 13 et une note v déplaçable de 0 à 20), qu'une valeur extrême tire la moyenne mais pas la médiane (vue = 0), ou que l'étendue ne dépend que du minimum et du maximum (vue = 1). Aucune valeur n'est écrite."
    valeurs:
      v: {min: 0, max: 20, pas: 1, defaut: 14}
      vue: {min: 0, max: 1, pas: 1, defaut: 0}
