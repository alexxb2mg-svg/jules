id: triangle-rectangle
titre: "Figure : triangle rectangle et carrés sur les côtés (Pythagore)"
version: "2.1.0"
licence: MIT
auteurs: ["projet-jules"]
fournit:
  figures: [triangle-rectangle]
permissions: {}
# Figure que Jules peut montrer dans la discussion (bloc ```figure, voir docs/EXTENSIONS.md) ; memes bornes
# que les curseurs des fiches 3e « parallelisme, triangles, Pythagore » et « Thales, trigonometrie ».
# 2.0.0 : carres construits sur les trois cotes, aire ecrite dans chacun (AC², BC², AC² + BC²), echelle adaptee
# a la figure. La longueur AB n'est pas ecrite.
# 2.1.0 : valeur `reponse` (0 ou 1, defaut 0). A 0, le carre orange porte « ? » : aucune valeur de AB ni de AB²
# n'est ecrite, seules les aires AC² et BC² le sont ; la figure ne fait pas l'exercice « calcule AB ».
# revele: false grace a cette variante (aide aux devoirs et cours, les modes qu'utilise l'eleve). A 1, l'aire
# AC² + BC² est ecrite dans l'orange (36, 64 et 100 pour AC = 6, BC = 8) : il ne reste que la racine carree a
# prendre. `valeurs_revele: [reponse]` : la regle tient par le code (jules/modules/figures.py) ; hors du mode
# reexplique, reponse est forcee a 0 et n'est pas proposee au modele ; jamais de curseur reponse dans la bulle.
discussion:
  triangle-rectangle:
    quand: "Triangle ABC rectangle en C et théorème de Pythagore : ac = AC, bc = BC, un carré sur chaque côté ; le carré de l'hypoténuse porte « ? ». Quand la valeur reponse est proposée, reponse = 1 y écrit son aire AC² + BC², pour réexpliquer."
    revele: false
    valeurs_revele: [reponse]
    valeurs:
      ac: {min: 1, max: 12, pas: 1, defaut: 6}
      bc: {min: 1, max: 12, pas: 1, defaut: 8}
      reponse: {min: 0, max: 1, pas: 1, defaut: 0}
