name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # la bibliotheque grossit : Windows depassait 15 min (25/09/2026), puis 25 min (03/10/2026, t_57cf0494 :
    # suite en parallele et couverture sous Linux seulement ; ce plafond n'est qu'un filet).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest   # beaucoup de familles sont sous Windows
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Dependances du projet
        run: python -m pip install -e ".[dev]"
      - name: Chrome Headless Shell (Linux, binaire officiel, empreinte verifiee)
        # /usr/bin/chromium du runner (snapshot) ne rend rien en --dump-dom : chaque test navigateur attend
        # son delai puis echoue (t_e211682a). Chrome for Testing respecte aussi --window-size.
        if: runner.os == 'Linux'
        env:
          VERSION: 154.0.8037.57
          SHA256: 5a6979d0ab7cf952ea575d35164e7bdce4872b2ced8f8a215c8f8e8eda00ee09
        run: |
          curl -sSfL -o chs.zip "https://storage.googleapis.com/chrome-for-testing-public/${VERSION}/linux64/chrome-headless-shell-linux64.zip"
          echo "${SHA256}  chs.zip" | sha256sum -c -
          unzip -q chs.zip -d "${RUNNER_TEMP}"
          rm chs.zip
          echo "JULES_CHROMIUM=${RUNNER_TEMP}/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
          # Navigateur fourni : un test navigateur ignore serait une regression silencieuse, il doit echouer.
          echo "JULES_CHROMIUM_OBLIGATOIRE=1" >> "$GITHUB_ENV"
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (types)
        run: mypy
      # Suite repartie sur les coeurs du runner (pytest-xdist). La couverture est mesuree sous Linux (3 versions
      # de Python) : sous Windows, le tracage triplait la duree des tests de generateurs (03/10/2026, t_57cf0494).
      - name: Tests et couverture (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest -rs -n auto --durations=25 --cov --cov-report=term-missing
      - name: Tests (Windows, macOS)
        if: runner.os != 'Linux'
        # Dossiers temporaires des tests sur le disque du runner (runner.temp, D: sous Windows) plutot que sur C: :
        # la fixture `projet` copie ~850 fichiers par test.
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: python -m pytest -rs -n auto --durations=25
      - name: Tests lents (exclus de la suite par defaut, voir pyproject.toml)
        run: python -m pytest -rs -m lent
      - name: La commande s'installe et demarre
        run: jules verifier

  secrets:
    name: Aucun secret dans l'historique
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (binaire officiel, empreinte verifiee)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  dependances:
    name: Failles connues dans les dependances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pip-audit sur les dependances installees
        run: |
          python -m pip install pip-audit .
          pip-audit --skip-editable --progress-spinner off

  revue-dependances:
    name: Nouvelles dependances (licence, failles)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later
