notion: cm1-espagnol-eoi-exprimer-emotions-souhaits
declencheurs:
- content en espagnol
- exprimer mes émotions en espagnol
- dire que j'ai peur en espagnol
- réagir à une histoire en espagnol
essentiel: 'Pour exprimer une émotion, on peut utiliser des expressions toutes faites comme Estoy bien, Es difícil,
  Es fácil.

  On peut aussi utiliser des onomatopées : ¡Ñam! (miam), ¡Guau! (waouh), ¡Ay! (aïe), ¡Pum!, ¡Splash!

  On réagit à ce que dit ou fait quelqu''un, positivement ou négativement.

  Ces expressions servent dans des situations connues, comme réagir à une chanson ou à une histoire.'
methode:
- Identifier l'émotion ressentie (joie, tristesse, surprise, peur).
- Choisir l'expression ou l'onomatopée qui correspond le mieux.
- Dire la réaction avec l'intonation qui va avec l'émotion.
- S'appuyer sur la réaction de la personne en face pour continuer l'échange.
vocabulaire:
- terme: onomatopée
  definition: un mot qui imite un bruit ou une réaction, comme ¡Guau! ou ¡Ay!
erreurs_frequentes:
- Utiliser toujours la même expression (Estoy bien) pour toutes les émotions.
- Ne pas faire varier l'intonation selon l'émotion exprimée.
exemple:
  enonce: Tu goûtes un nouveau plat et tu le trouves délicieux. Que dis-tu ?
  solution: ¡Ñam! ¡Qué rico!
exercices:
- enonce: Tu te fais mal en trébuchant. Quelle onomatopée utilises-tu ?
  indices:
  - C'est une réaction à la douleur.
  solution: ¡Ay!
- enonce: Un ami te raconte une histoire drôle. Comment réagis-tu simplement en espagnol ?
  indices:
  - Utilise une expression simple pour dire que tu trouves ça drôle ou que tu es content.
  solution: 'Réponse possible : ¡Es una historia muy divertida! ¡Estoy contento!'
