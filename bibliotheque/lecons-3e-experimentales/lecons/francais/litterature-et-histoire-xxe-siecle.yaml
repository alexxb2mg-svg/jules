notion: litterature-et-histoire-xxe-siecle
titre: "Littérature du XXe siècle : engagement, résistance et rapport à l'histoire"
duree_minutes: 30
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
