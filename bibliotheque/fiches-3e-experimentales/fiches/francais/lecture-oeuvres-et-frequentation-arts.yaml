notion: lecture-oeuvres-et-frequentation-arts
declencheurs:
- livre à lire pour l'année
- lecture cursive
- œuvre complète
- lien littérature et art
- livre du patrimoine
- œuvre à lire en autonomie
- relier un roman à un tableau
- même époque littérature peinture
essentiel: 'Au collège, on distingue la lecture intégrale (une œuvre lue et étudiée en entier, en classe, avec le
  professeur) et la lecture cursive (une œuvre lue seul, en autonomie, souvent choisie dans une liste, notamment
  en littérature jeunesse). En 3e, le programme prévoit de lire au moins trois œuvres complètes du patrimoine en
  lecture intégrale, au moins trois œuvres complètes en lecture cursive, et au moins trois groupements de textes
  (courts extraits réunis autour d''un même thème).

  Ces lectures portent sur différentes époques, en lien avec le programme d''histoire, ce qui permet de voir comment
  la littérature a évolué et comment elle éclaire les évènements historiques.

  Le programme invite aussi à relier la production littéraire à la production artistique : un roman peut être mis
  en relation avec un tableau, une sculpture, un film de la même époque ou sur le même thème, pour mieux comprendre
  les échanges entre les arts.'
methode:
- Noter, pour chaque œuvre lue, le titre, l'auteur, l'époque et le genre.
- Distinguer les lectures faites en classe (intégrale, étudiées en détail) et celles faites seul (cursive).
- Chercher, pour une lecture intégrale, une œuvre d'art (peinture, sculpture, film) de la même époque ou sur le
  même thème.
- Résumer en quelques phrases l'intérêt de chaque lecture (ce qu'elle apprend, ce qu'elle fait ressentir).
- Relier les œuvres lues au programme d'histoire de l'année quand c'est pertinent.
erreurs_frequentes:
- Confondre lecture intégrale et lecture cursive.
- Lire une œuvre sans identifier ni son époque ni son genre.
- Ne jamais relier une œuvre littéraire à une autre forme d'art.
- Se contenter d'un résumé de l'histoire sans dire ce que la lecture a apporté personnellement.
exemple:
  enonce: Après avoir lu un roman sur la Première Guerre mondiale en lecture intégrale, quelle œuvre d'art pourrait-on
    lui associer pour éclairer la même période ?
  solution: 'On peut associer une peinture ou une photographie de l''époque montrant les tranchées ou la vie des
    soldats : la comparaison entre le texte et l''image aide à mieux ressentir le contexte historique du roman.'
exercices:
- enonce: Explique en une phrase la différence entre lecture intégrale et lecture cursive.
  indices:
  - Pense à qui choisit le livre et comment il est étudié.
  solution: La lecture intégrale est une œuvre entière étudiée en détail en classe, avec le professeur ; la lecture
    cursive est une œuvre lue seul, en autonomie, souvent au choix.
- enonce: Pour un livre que tu as lu cette année (même en dehors de l'école), rédige une fiche de 4-5 lignes avec
    le titre, l'auteur, l'époque, et une œuvre d'art (tableau, film) que tu pourrais lui associer.
  indices:
  - Cherche une œuvre d'art sur le même thème ou de la même époque.
  solution: Réussite si les informations sur le livre sont exactes et si l'œuvre d'art associée est justifiée par
    un lien de thème ou d'époque.
