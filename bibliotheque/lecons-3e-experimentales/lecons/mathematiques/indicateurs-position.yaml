notion: indicateurs-position
titre: "Moyenne et médiane"
duree_minutes: 25
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme du cycle 4 (annexe 3), partie Mathématiques, BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Attendus de fin d'année de 3e, Mathématiques, éduscol, 2019"
    url: "https://eduscol.education.gouv.fr/sites/default/files/document/18-maths-3e-attendus-eduscol1114748pdf-74688.pdf"
    licence: etalab-2.0
  - titre: "Repères annuels de progression, Mathématiques, cycle 4, éduscol, 2019"
    url: "https://eduscol.education.gouv.fr/sites/default/files/document/26-maths-c4-reperes-eduscol1114756pdf-74694.pdf"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - type: objectifs
    items:
      - "Calculer une moyenne, y compris avec un tableau d'effectifs (moyenne pondérée)."
      - "Trouver une médiane, avec un nombre impair ou pair de valeurs, ou avec un tableau d'effectifs."
      - "Interpréter la moyenne et la médiane par une phrase, et les comparer."

  - type: texte
    titre: "La moyenne"
    contenu: |-
      La **moyenne** = somme de toutes les valeurs ÷ nombre de valeurs.

      Avec un tableau d'effectifs (**moyenne pondérée**) :
      1. On multiplie chaque valeur par son effectif.
      2. On additionne les produits.
      3. On divise par l'effectif total.

      Attention : on ne divise pas par le nombre de colonnes, mais par l'effectif total.

  - type: texte
    titre: "La médiane"
    contenu: |-
      La **médiane** partage la série, rangée dans l'ordre croissant, en deux groupes de même effectif.

      - D'abord, on **range** les valeurs dans l'ordre (on garde les valeurs répétées).
      - On compte les valeurs : n.
      - **n impair** : la médiane est la valeur de rang (n + 1) ÷ 2.
      - **n pair** : la médiane est la moyenne des valeurs de rang n ÷ 2 et n ÷ 2 + 1.
      - Exemple : 3 ; 5 ; 9 ; 12 ; 20 ; 30. Il y a 6 valeurs. Médiane = (9 + 12) ÷ 2 = 10,5.
      - Avec un tableau d'effectifs, on **cumule les effectifs** pour trouver la valeur du rang cherché.

  - type: texte
    titre: "Interpréter et comparer"
    contenu: |-
      - La moyenne tient compte de **toutes** les valeurs. Une valeur très grande la tire vers le haut.
      - La médiane est très peu sensible aux valeurs extrêmes.
      - Deux séries peuvent avoir la même moyenne et des médianes différentes.
      - Interpréter, c'est faire une phrase. Exemple : « la moitié des élèves met moins de 20 minutes ».
      - Un tableur calcule la moyenne (fonction MOYENNE) et la médiane (fonction MEDIANE).

  - type: exemple
    enonce: >-
      Temps de trajet de 6 personnes, en minutes : 12 ; 25 ; 18 ; 30 ; 15 ; 20.
      Calcule la moyenne et la médiane.
    etapes:
      - "Somme : 12 + 25 + 18 + 30 + 15 + 20 = 120."
      - "Moyenne : 120 ÷ 6 = 20 minutes."
      - "On range : 12 ; 15 ; 18 ; 20 ; 25 ; 30."
      - "Il y a 6 valeurs (nombre pair). On prend la 3e et la 4e valeur : 18 et 20."
      - "Médiane : (18 + 20) ÷ 2 = 19 minutes."
      - "Phrase : la moitié des personnes met moins de 19 minutes (au moins la moitié)."

  - type: exercice
    enonce: "Calcule la moyenne de cette série : 6 ; 9 ; 12 ; 5 ; 8."
    forme: nombre
    reponse: 8
    tolerance: 0.01
    indices:
      - "Moyenne = somme des valeurs ÷ nombre de valeurs."
      - "Additionne les cinq valeurs. Puis divise par le nombre de valeurs."
    explication: "6 + 9 + 12 + 5 + 8 = 40, et 40 ÷ 5 = 8."

  - type: exercice
    enonce: "Trouve la médiane de cette série : 7 ; 3 ; 9 ; 1 ; 5 ; 11 ; 4."
    forme: nombre
    reponse: 5
    tolerance: 0.01
    indices:
      - "Commence par ranger les valeurs dans l'ordre croissant."
      - "Il y a 7 valeurs (nombre impair). La médiane est la valeur du milieu : quel est son rang ?"
    explication: "Rangées : 1 ; 3 ; 4 ; 5 ; 7 ; 9 ; 11. Il y a 7 valeurs, la médiane est la 4e : 5."

  - type: exercice
    enonce: "Quelle est la médiane de cette série, déjà rangée : 2 ; 4 ; 7 ; 9 ; 15 ; 30 ?"
    forme: qcm
    choix:
      - "7"
      - "8"
      - "9"
      - "11"
    reponse: 1
    indices:
      - "Il y a 6 valeurs : un nombre pair. Il n'y a pas de valeur exactement au milieu."
      - "Prends les deux valeurs du milieu (3e et 4e), puis calcule leur moyenne."
    explication: "Les valeurs du milieu sont 7 et 9. Médiane = (7 + 9) ÷ 2 = 8."

  - type: exercice
    enonce: >-
      Dans une classe, les notes sont : 10 (2 élèves), 12 (3 élèves) et 15 (5 élèves).
      Calcule la moyenne de la classe.
    forme: nombre
    reponse: 13.1
    tolerance: 0.01
    indices:
      - "C'est une moyenne pondérée : multiplie chaque note par son effectif."
      - "Additionne les trois produits, puis divise par l'effectif total (le nombre d'élèves)."
      - "Effectif total : 2 + 3 + 5. Divise la somme des produits par ce nombre."
    explication: "10 × 2 + 12 × 3 + 15 × 5 = 20 + 36 + 75 = 131. Effectif total : 10. Moyenne : 131 ÷ 10 = 13,1."

  - type: exercice
    enonce: >-
      On a demandé à 25 élèves combien de frères et sœurs ils ont.
      0 frère ou sœur : 4 élèves. 1 : 7 élèves. 2 : 6 élèves. 3 : 5 élèves. 4 : 3 élèves.
      Quelle est la médiane de cette série ?
    forme: nombre
    reponse: 2
    tolerance: 0.01
    indices:
      - "Le nombre de valeurs est impair. Cherche le rang de la valeur du milieu."
      - "Rang = la moitié de (effectif total + 1). Cumule ensuite les effectifs dans l'ordre des valeurs."
      - "Cherche la première ligne où le total cumulé atteint ou dépasse ce rang."
    explication: "Le rang de la médiane est (25 + 1) ÷ 2 = 13. Effectifs cumulés : 4 ; 11 ; 17 ; 22 ; 25. La 13e valeur est dans le groupe qui cumule jusqu'à 17, c'est-à-dire 2 frères et sœurs. Médiane : 2."

  - type: question_ouverte
    question: >-
      Dans une petite entreprise, tous les salaires sont proches. Un nouveau directeur arrive avec
      un salaire énorme. Que devient la moyenne des salaires ? Et la médiane ? Explique.
    indices:
      - "La moyenne utilise toutes les valeurs. Que fait une très grande valeur à la somme ?"
      - "La médiane est la valeur du milieu de la série rangée. Une valeur extrême change-t-elle beaucoup le milieu ?"
    criteres:
      - "L'élève dit que la moyenne augmente nettement, car elle est tirée vers le haut par la valeur très grande."
      - "L'élève dit que la médiane change peu (ou pas du tout), car elle dépend du milieu de la série et pas des valeurs extrêmes."

  - type: synthese
    consigne: >-
      Avec tes mots : comment calcule-t-on une moyenne, comment trouve-t-on une médiane,
      et quelle différence de comportement ont-elles ?
