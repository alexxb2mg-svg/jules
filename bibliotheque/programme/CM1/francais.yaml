              - "Accorder le participe passé avec le sujet dans le cas de l'emploi avec l'auxiliaire être."
              - "Transformer à l'écrit et à l'oral des phrases en faisant varier le temps ou le sujet ; respecter toutes les chaînes d'accord."
              - "Mémoriser les marques de personne des verbes les plus fréquents aux temps de conjugaison étudiés pour apprendre à accorder sujet et verbe dans tous types de productions écrites."
