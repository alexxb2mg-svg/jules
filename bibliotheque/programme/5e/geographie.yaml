            titre: "Croissance démographique : puissance émergente et pays d'Afrique, mise en perspective"
            niveau_programme: "5e"
            attendus:
              - "Sensibiliser les élèves aux problèmes posés aux espaces humains par le changement global et la tension sur les ressources essentielles (énergie, eau, alimentation)."
              - "Étudier la problématique de la croissance démographique à partir de deux études de cas : une puissance émergente (la Chine ou l'Inde) et un pays d'Afrique au choix."
              - "Mettre en perspective ces cas avec les États-Unis et l'Europe, où la question démographique se pose différemment, en montrant aussi les points communs (comme le vieillissement)."
            mots_cles: [croissance démographique, développement durable, puissance émergente, vieillissement]
            brevet: false
            source: "Programme cycle 4, annexe 3, Géographie — Classe de 5e, Thème 1 « La question démographique et l'inégal développement », « La croissance démographique et ses effets »"
