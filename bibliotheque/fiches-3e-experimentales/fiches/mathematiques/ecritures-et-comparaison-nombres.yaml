notion: ecritures-et-comparaison-nombres
essentiel: 'Un même nombre rationnel a plusieurs écritures : fractionnaire (3/4), décimale (0,75), en pourcentage
  (75 %), scientifique (7,5 × 10⁻¹), ou un point sur une droite graduée.

  Certaines fractions n''ont pas d''écriture décimale finie : 2/3 = 0,666… (on en donne une valeur approchée).

  Pour comparer, on se ramène à une même écriture : même dénominateur pour des fractions, écriture décimale, ou
  notation scientifique (on compare d''abord les exposants).

  Parmi les nombres négatifs, le plus petit est celui qui est le plus loin de zéro : −0,6 < −0,5.

  Encadrer un nombre, c''est donner une valeur inférieure et une valeur supérieure (au dixième, au centième…).

  Un ordre de grandeur permet de contrôler un résultat ou de se représenter une quantité.'
methode:
- Choisir une écriture commune (souvent décimale) pour tous les nombres à comparer.
- Comparer d'abord les signes, puis les parties entières, puis les chiffres après la virgule.
- 'Pour des fractions : même dénominateur, puis comparer les numérateurs.'
- 'Pour encadrer une fraction : faire la division et garder le nombre de décimales demandé.'
- 'Sur une droite graduée : repérer la valeur d''une graduation (partager l''unité en autant de parts que le dénominateur).'
erreurs_frequentes:
- Croire que 0,7 < 0,65 parce que 65 > 7 (il faut comparer 0,70 et 0,65).
- Ranger les nombres négatifs comme des positifs (−0,6 est plus petit que −0,5).
- Écrire 2/3 = 0,67 au lieu de 2/3 ≈ 0,67.
- Comparer des notations scientifiques par le seul nombre décimal, sans regarder l'exposant.
exemple:
  enonce: 'Ranger dans l''ordre croissant : −1/2 ; 0,4 ; 3/8 ; −0,6.'
  solution: 'En décimal : −0,5 ; 0,4 ; 0,375 ; −0,6. Donc −0,6 < −1/2 < 3/8 < 0,4.'
exercices:
- enonce: 'Compléter : 3/4 = … (décimal) = … % = … × 10⁻¹.'
  indices:
  - 3 ÷ 4 = ?
  solution: 3/4 = 0,75 = 75 % = 7,5 × 10⁻¹.
- enonce: Comparer 2/3 et 0,67.
  indices:
  - Pose la division 2 ÷ 3.
  solution: 2/3 = 0,666… < 0,67, donc 2/3 < 0,67.
- enonce: Encadrer 22/7 au centième.
  indices:
  - Calcule 22 ÷ 7 avec trois décimales.
  solution: 22/7 ≈ 3,142…, donc 3,14 < 22/7 < 3,15.
- enonce: Comparer 2,5 × 10⁻³ et 3,1 × 10⁻², puis 7,2 × 10⁵ et 1,1 × 10⁶.
  indices:
  - Compare d'abord les exposants.
  solution: 2,5 × 10⁻³ < 3,1 × 10⁻² (exposant −3 < −2) ; 7,2 × 10⁵ < 1,1 × 10⁶ (exposant 5 < 6).
