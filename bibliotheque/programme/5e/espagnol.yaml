        Classe de cinquieme, Outils linguistiques, Grammaire
        [contenu experimental, a verifier]
    - id: 5e-espagnol-grammaire-pronoms
      titre: 'Grammaire : les pronoms'
      niveau_programme: 5e
      attendus:
      - >-
        Niveau A1+ : les pronoms personnels sujets (yo, tu, el/ella/usted, nosotros/as,
        vosotros/as, ellos/ellas/ustedes) et le tutoiement/vouvoiement (tu/usted) ; les pronoms
        complements d'objet direct courants (me, te, lo/la, nos, os, los/las) ; les mots
        interrogatifs (quien, que, donde, cuando, por que, como, cual, cuanto).
      - >-
        Niveau A2 : les pronoms complements d'objet indirect (me, te, le, nos, os, les) et la
        place du pronom avec l'infinitif et le gerondif ; les quantifieurs (mucho/a/os/as,
        poco/a/os/as, bastante, demasiado/a/os/as, algun/alguno/a/os/as, ningun/ninguno/a) ;
        les pronoms personnels reflechis (me, te, se, nos, os, se).
