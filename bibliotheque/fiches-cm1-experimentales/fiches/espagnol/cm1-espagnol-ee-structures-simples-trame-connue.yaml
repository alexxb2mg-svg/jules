notion: cm1-espagnol-ee-structures-simples-trame-connue
declencheurs:
- écrire une carte postale en espagnol
- écrire un message à un correspondant espagnol
- décrire un objet par écrit en espagnol
essentiel: 'Pour écrire des phrases en s''appuyant sur une trame connue, on produit de manière autonome quelques
  phrases sur soi-même, sur les autres ou sur des personnages, en s''appuyant sur des modèles déjà vus.

  On peut rédiger un courrier bref et simple, comme un message électronique court, une carte postale ou une lettre,
  en suivant un modèle.'
methode:
- Relire un modèle déjà vu (carte postale, message) pour s'en inspirer.
- Remplacer les informations du modèle par les siennes (nom, description).
- Vérifier qu'on a gardé la même structure que le modèle.
- Relire pour vérifier l'orthographe des mots déjà appris.
vocabulaire: []
erreurs_frequentes:
- Copier le modèle sans changer les informations personnelles.
- Oublier une partie attendue du modèle (la formule de salutation par exemple).
exemple:
  enonce: En t'appuyant sur un modèle de devinette (« Es un chico. Tiene el pelo rojo. ¿Quién es? »), décris un camarade
    qui porte un pull bleu.
  solution: Es un chico. Lleva un jersey azul. ¿Quién es?
exercices:
- enonce: Écris un court message d'anniversaire à une amie qui s'appelle Fiona, en t'appuyant sur le modèle « ¡Hola
    Fiona, feliz cumpleaños! ».
  indices:
  - Change juste le prénom si besoin, garde la structure.
  solution: ¡Hola Fiona, feliz cumpleaños!
- enonce: 'Rédige une carte postale très courte en t''appuyant sur le modèle : dis que tu es à Madrid et qu''il
    fait très froid.'
  indices:
  - Utilise Estoy en... et Hace mucho frío.
  solution: Queridos padres, estoy en Madrid. Hace mucho frío.
sources:
- titre: Programme de langues vivantes étrangères et régionales pour le cours moyen, arrêté du 26-2-2026, BO n°
    12 du 19/03/2026, p. 16
  url: https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf
  auteurs: Ministère de l'Éducation nationale (DGESCO)
  licence: etalab-2.0
  consulte_le: '2026-09-24'
  usage: reformulé et résumé
