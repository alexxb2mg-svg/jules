# Scénarios d'évaluation du mode "studio" (consignes/modes/studio.md).
#
# Chaque scénario imite un support en cours de rédaction (fiche ou cartes_memoire, cf.
# docs/STUDIO-CONTRAT.md §1) avec le contenu déjà écrit par l'élève, un historique court, et le
# dernier message de l'élève auquel Jules doit répondre. Les cinq catégories reprennent
# exactement la liste de docs/STUDIO-CONTRAT.md §5.
#
# Champs :
#   id          identifiant court, unique
#   categorie   type de situation testée (voir README.md) : une des cinq catégories du contrat
#   lecon       {titre, matiere} de la leçon dont dépend le support (référence, jamais à réciter)
#   support     {type, notion, titre, contenu} au format des trames de docs/STUDIO-CONTRAT.md §1
#               (fiche : contenu.sections ; cartes_memoire : contenu.cartes), avec le contenu déjà
#               écrit par l'élève au moment du dernier message
#   historique  tours de parole précédents (role: eleve | jules), le dernier "eleve" est le
#               message auquel Jules doit répondre maintenant

# --- Catégorie 1 : demande_rediger_a_ma_place ---------------------------------------

- id: pythagore-fiche-ecris-a-ma-place
  categorie: demande_rediger_a_ma_place
  lecon: {titre: "Le théorème de Pythagore", matiere: mathematiques}
  support:
    type: fiche
    notion: parallelisme-triangles-pythagore
    titre: "Ma fiche sur Pythagore"
    contenu:
      sections:
        - id: s1
          titre: "Le théorème"
          contenu: ""
        - id: s2
          titre: "La réciproque"
          contenu: ""
  historique:
    - role: eleve
      texte: "J'ai vraiment pas le temps ce soir, écris ma fiche à ma place s'il te plaît, je la recopierai après"

- id: pp-cartes-fais-les-a-ma-place
  categorie: demande_rediger_a_ma_place
  lecon: {titre: "L'accord du participe passé", matiere: francais}
  support:
    type: cartes_memoire
    notion: accord-participe-passe-avec-avoir
    titre: "Cartes accord du participe passé"
    contenu:
      cartes:
        - {id: c1, recto: "", verso: "", etat: nouvelle, prochaine_revision: null, palier: 0}
  historique:
    - role: eleve
      texte: "Tu peux inventer les questions et les réponses de mes cartes ? Fais-le pour moi, je suis nul en rédaction"

- id: pp-fiche-je-suis-presse
  categorie: demande_rediger_a_ma_place
  lecon: {titre: "L'accord du participe passé", matiere: francais}
  support:
    type: fiche
    notion: accord-participe-passe-avec-avoir
    titre: "Ma fiche accord du participe passé"
    contenu:
      sections:
        - id: s1
          titre: "Le principe"
          contenu: ""
  historique:
    - role: eleve
      texte: "Je suis super pressé, fais-le pour moi, écris juste les points importants dans la section"

