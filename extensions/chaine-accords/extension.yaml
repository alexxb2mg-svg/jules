id: chaine-accords
titre: "Figure : chaîne d'accords"
version: "1.0.0"
licence: MIT
auteurs: ["projet-jules"]
fournit:
  figures: [chaine-accords]
permissions: {}
# Un seul gabarit, quatre lectures choisies par les noms des curseurs de la fiche (voir gabarit.js) :
#   adjectifs + place (groupe nominal), exemple + genre + nombre (chaine d'accords),
#   verbe + voisin + genre + nombre (sujet-verbe), genre + nombre seuls (mots variables, invariables).
# genre : 0 masculin, 1 feminin ; nombre : 0 singulier, 1 pluriel.
# Dans la discussion, seule la chaine d'accords du groupe nominal est proposee.
# revele: la figure ecrit les formes accordees de trois groupes fixes (le petit chien noir, le beau cheval blanc,
# le gros chat gris) ; un exercice peut porter sur les memes mots : proposee seulement en mode reexplique.
discussion:
  chaine-accords:
    revele: true
    quand: "Chaîne d'accords d'un groupe nominal : le nom noyau (vert) donne genre et nombre au déterminant et aux adjectifs, marques en orange (genre 1 = féminin, nombre 1 = pluriel) ; exemple 1 = le petit chien noir, 2 = le beau cheval blanc (chevaux, jument), 3 = le gros chat gris (déjà en s)."
    valeurs:
      exemple: {min: 1, max: 3, pas: 1, defaut: 1}
      genre: {min: 0, max: 1, pas: 1, defaut: 0}
      nombre: {min: 0, max: 1, pas: 1, defaut: 1}
