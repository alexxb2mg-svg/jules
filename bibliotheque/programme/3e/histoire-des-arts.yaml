            source: "Programme cycle 4, introduction de la partie « Histoire des arts »"
          - id: champ-spectacle-vivant
            titre: "Musique, théâtre, opéra, danse, cirque, marionnette"
            niveau_programme: "cycle 4"
            attendus:
              - "La musique, le théâtre, l'opéra et la danse, le cirque et la marionnette."
            mots_cles: [musique, théâtre, opéra, danse, cirque]
            brevet: false
            source: "Programme cycle 4, introduction de la partie « Histoire des arts »"
          - id: champ-photo-cinema
            titre: "Photographie et cinéma"
            niveau_programme: "cycle 4"
            attendus:
              - "La photographie et le cinéma."
            mots_cles: [photographie, cinéma]
            brevet: false
            source: "Programme cycle 4, introduction de la partie « Histoire des arts »"
          - id: champ-arts-decoratifs
            titre: "Arts décoratifs, design, métiers d'art, affiche, publicité, caricature"
            niveau_programme: "cycle 4"
            attendus:
              - "Les arts décoratifs et appliqués, le vêtement, le design et les métiers d'art, l'affiche, la publicité, la caricature."
            mots_cles: [arts décoratifs, design, publicité]
            brevet: false
            source: "Programme cycle 4, introduction de la partie « Histoire des arts »"
          - id: champ-genres-hybrides
            titre: "Genres hybrides ou éphémères des XXe-XXIe siècles"
            niveau_programme: "cycle 4"
            attendus:
              - "Bande dessinée, performance, vidéo, installation, arts de la rue, etc."
              - "La poésie, l'éloquence, la littérature comme champs artistiques associés."
            mots_cles: [bande dessinée, performance, vidéo, arts de la rue]
            brevet: false
            source: "Programme cycle 4, introduction de la partie « Histoire des arts »"
