notion: cm1-espagnol-eoi-etablir-un-contact
declencheurs:
- hola
- saluer en espagnol
- au revoir en espagnol
- se présenter à quelqu'un en espagnol
- gracias
- adiós
- buenos días
essentiel: 'Pour engager un échange, on utilise des formules d''adresse : Hola, Buenos días, Buenas tardes.

  On utilise des formules de politesse : Gracias, Por favor, Perdón, Disculpe.

  On peut relancer la conversation avec des questions simples : ¿Quién? ¿Qué? ¿Dónde? ¿Cuándo?

  Pour clore une conversation, on utilise des mots simples : Gracias, Vale, Adiós, ¡Hasta pronto!'
methode:
- Choisir la formule de salutation adaptée au moment de la journée.
- Utiliser une formule de politesse pendant l'échange (merci, s'il te plaît, pardon).
- Poser une question simple pour continuer l'échange si besoin.
- Terminer poliment la conversation avec une formule de congé.
vocabulaire:
- terme: formule de politesse
  definition: une expression toute faite pour être poli, comme Gracias ou Por favor
erreurs_frequentes:
- Dire Buenos días l'après-midi au lieu de Buenas tardes.
- Oublier de dire au revoir à la fin d'un échange.
- Ne pas utiliser Por favor ou Gracias dans une demande.
exemple:
  enonce: Tu croises ton professeur d'espagnol l'après-midi. Que dis-tu ?
  solution: ¡Buenas tardes!
exercices:
- enonce: Tu veux remercier l'assistante de langue à la fin de sa présentation. Que dis-tu ?
  indices:
  - Utilise une formule de remerciement.
  solution: ¡Muchas gracias!
- enonce: Tu quittes un ami à la fin de la journée d'école, en lui disant que tu le reverras bientôt. Que dis-tu
    ?
  indices:
  - Utilise une expression pour clore la conversation.
  solution: ¡Hasta pronto!
