notion: indicateurs-position
essentiel: 'Moyenne = somme des valeurs / effectif total. Avec un tableau d''effectifs : somme des (valeur × effectif)
  / effectif total.

  Médiane : valeur qui partage la série rangée dans l''ordre croissant en deux groupes de même effectif (au moins
  la moitié des valeurs sont inférieures ou égales, au moins la moitié supérieures ou égales).

  Effectif impair n : la médiane est la valeur de rang (n + 1)/2. Effectif pair : on prend la moyenne des deux valeurs
  centrales (rangs n/2 et n/2 + 1).

  Données regroupées en classes : on utilise le centre de chaque classe pour la moyenne ; la médiane se situe dans
  la classe où la fréquence cumulée dépasse 50 %.'
methode:
- 'Moyenne : calculer le total, puis diviser par l''effectif total ; arrondir seulement à la fin.'
- 'Médiane : ranger d''abord les valeurs dans l''ordre croissant.'
- Compter l'effectif n, puis trouver le rang du milieu ((n + 1)/2 si n est impair).
- Si n est pair, faire la moyenne des deux valeurs centrales.
- 'Interpréter : la moyenne est sensible aux valeurs extrêmes, la médiane beaucoup moins.'
erreurs_frequentes:
- Chercher la médiane sans avoir rangé la série.
- Prendre la valeur au rang n/2 quand l'effectif est impair (ou oublier la moyenne des deux valeurs centrales quand
  il est pair).
- Diviser par le nombre de valeurs différentes au lieu de l'effectif total.
- Confondre médiane et milieu de l'étendue.
exemple:
  enonce: 'Notes d''une classe : 10, 9, 12, 11, 10, 8, 14, 11, 9, 16, 5, 12, 10, 11, 10, 13. Calculer la moyenne
    et la médiane.'
  solution: 'Total 171 pour 16 notes : moyenne 171/16 ≈ 10,7. Rangées : 5, 8, 9, 9, 10, 10, 10, 10, 11, 11, 11,
    12, 12, 13, 14, 16 ; les 8e et 9e valeurs sont 10 et 11, médiane 10,5.'
exercices:
- enonce: 'Série : 12, 7, 15, 9, 11, 8, 14. Calculer la moyenne (au dixième) et la médiane.'
  indices:
  - Range la série d'abord.
  - '7 valeurs : la médiane est la 4e.'
  solution: 'Total 76, moyenne 76/7 ≈ 10,9. Rangée : 7, 8, 9, 11, 12, 14, 15 ; médiane 11.'
- enonce: 'Série : 4, 18, 6, 10, 8, 12. Calculer la médiane.'
  indices:
  - 'Effectif pair : quelles sont les deux valeurs centrales ?'
  solution: 'Rangée : 4, 6, 8, 10, 12, 18 ; médiane (8 + 10)/2 = 9.'
- enonce: 'Nombre de frères et sœurs de 10 élèves : 1 élève en a 2, 4 en ont 3, 3 en ont 5, 2 en ont 4. Calculer
    la moyenne.'
  indices:
  - Multiplie chaque valeur par son effectif, puis additionne.
  solution: (2 × 1 + 3 × 4 + 5 × 3 + 4 × 2)/10 = 37/10 = 3,7.
