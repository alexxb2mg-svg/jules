notion: cm1-espagnol-eoi-echanger-informations
declencheurs:
- poser des questions en espagnol
- répondre à des questions en espagnol
- demander des nouvelles en espagnol
- qué tal en espagnol
essentiel: 'Pour échanger des informations, on pose des questions simples avec ¿Quién?, ¿Qué?, ¿Dónde?, ¿Cuándo?

  On peut demander des nouvelles de quelqu''un et réagir avec des formules de politesse.

  On répond avec des réponses courtes, par exemple Sí ou No.

  On donne aussi des consignes simples à l''impératif, comme Dame un bolígrafo ou Repite, por favor.

  On utilise poder pour demander une autorisation : ¿Puedo...?'
methode:
- Choisir le bon mot interrogatif selon ce qu'on veut savoir (qui, quoi, où, quand).
- Poser la question à voix haute, en respectant l'intonation.
- Répondre par une réponse courte plutôt qu'une phrase complète compliquée.
- Utiliser des formules de politesse pour engager ou continuer l'échange.
vocabulaire:
- terme: réponse courte
  definition: une réponse brève à une question, comme Sí ou No, sans refaire toute la phrase
erreurs_frequentes:
- Répondre par une phrase trop longue au lieu d'une réponse courte.
- Confondre Quién (qui) et Qué (quoi).
- Oublier por favor dans une consigne, ce qui la rend moins polie.
exemple:
  enonce: Tu veux savoir qui est sur la photo. Quelle question poses-tu ?
  solution: ¿Quién está en la foto?
exercices:
- enonce: On te demande « ¿Puedes jugar otra vez? » et tu as le droit. Donne une réponse courte.
  indices:
  - Une réponse courte commence souvent par Sí ou No.
  solution: Sí, puedo.
- enonce: Demande à un camarade où est passée sa gomme (« Dónde »).
  indices:
  - Dónde sert à demander un lieu.
  solution: ¿Dónde está tu goma?
