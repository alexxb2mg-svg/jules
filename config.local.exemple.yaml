#   backend: openai_compatible
#   url: https://api.mistral.ai/v1
#   cle_env: MISTRAL_API_KEY
#   modeles:
#     principal: mistral-medium-latest
#     rapide: mistral-small-latest

# --- Albert : IA publique de l'Etat (DINUM), pour les enseignants et etablissements ---
# Reserve aux agents de la fonction publique d'Etat. Acces gratuit sur demande :
# https://albert.sites.beta.gouv.fr/access/ (cle creee ensuite dans le Playground Albert).
# Heberge en France (SecNumCloud), aucune conversation conservee.
# openweight-medium = Mistral Small 3.2 (lit aussi les photos) ; openweight-small = Ministral 3 8B.
# llm:
#   backend: openai_compatible
#   url: https://albert.api.etalab.gouv.fr/v1
#   cle_env: ALBERT_API_KEY
#   modeles:
#     principal: openweight-medium
#     rapide: openweight-small

# --- Ollama : modele local, gratuit, rien ne sort de la maison ----------------
# Installer Ollama (https://ollama.com), puis : ollama pull qwen3-vl:8b (lit aussi les photos).
# Sans carte graphique, une reponse peut prendre plus d'une minute : augmenter delai_s.
# llm:
#   backend: openai_compatible
#   url: http://127.0.0.1:11434/v1
#   delai_s: 300
#   modeles:
#     principal: qwen3-vl:8b
#     rapide: qwen3-vl:8b
#   parametres:
#     reasoning_effort: none   # coupe la « reflexion » cachee des modeles qwen3 : bien plus rapide

# 3. Acces depuis une tablette sur le wifi de la maison (optionnel).
#    Definir d'abord les deux codes (jules code eleve / jules code parent) :
#    le serveur refuse de s'ouvrir au reseau sans eux.
# serveur:
#   hote: 0.0.0.0

# 4. Alertes et rapport du soir sur Telegram (optionnel) : jeton et identifiant dans .env
