id: journee-repartition
titre: "Figure : la journée d'un enfant en 24 cases, la corvée d'eau grignote le reste"
version: "1.0.0"
licence: MIT
auteurs: ["projet-jules"]
fournit:
  figures: [journee-repartition]
permissions: {}
# 24 cases = 24 heures (une demi-case = une demi-heure) : sommeil, repas et toilette, école, corvée d'eau, temps
# libre. distance : point d'eau à 0-5 km (0 = robinet), trajets : 1 à 3 allers-retours par jour, à 4 km/h. L'eau
# mange d'abord le temps libre puis l'école. Hypothèses et repères OMS-UNICEF en tête de gabarit.js (EX-205).
# revele: false : la figure n'écrit aucune durée, l'élève compte les cases.
discussion:
  journee-repartition:
    quand: "Pour faire sentir l'inégal accès à l'eau : la journée d'un enfant en 24 cases (1 case = 1 heure) ; plus le point d'eau est loin (distance en km) et plus il y a d'allers-retours (trajets), plus la corvée d'eau grignote le temps libre puis l'école."
    valeurs:
      distance: {min: 0, max: 5, pas: 0.5, defaut: 2}
      trajets: {min: 1, max: 3, pas: 1, defaut: 1}
