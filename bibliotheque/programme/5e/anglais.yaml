    - id: 5e-grammaire-adverbes-et-groupes-prepositionnels
      titre: 'Grammaire : les adverbes et les groupes prépositionnels pour situer dans le temps et l''espace'
      niveau_programme: 5e
      attendus:
      - 'Niveau A1+ : exprimer les dates ; utiliser des marqueurs temporels simples (today, this morning,
        tomorrow, yesterday) ; situer dans l''espace à l''aide de prépositions ou d''expressions lexicalisées
        (under, above, over, on the right, at the top, next to) ; utiliser des adverbes de fréquence.'
      - 'Niveau A2 : utiliser des marqueurs temporels (at two o''clock, every day, last month, six months
        ago, in two years) ; situer dans l''espace (in the foreground/in the background, at the top/bottom,
        on the right/left) ; exprimer une opposition, une concession ou un contraste (but, whereas, however,
        or).'
