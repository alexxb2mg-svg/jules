notion: conception-production-diffusion-numerique
titre: "Créer à l'ère du numérique : concevoir, produire, diffuser"
duree_minutes: 30
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme du cycle 4 (annexe 3), partie « Arts plastiques », BO n° 31 du 30 juillet 2020 (arrêté du 17 juillet 2020)"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Enseigner au cycle 4 (éduscol)"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - type: objectifs
    items:
      - "Dire ce que le numérique change pour concevoir, produire et diffuser une œuvre."
      - "Distinguer image matricielle et image vectorielle, image fixe et image animée."
      - "Justifier le choix d'un médium ou d'un outil numérique par son intention."

  - type: texte
    titre: "Concevoir avec le numérique"
    contenu: |-
      Le numérique change la création des images **fixes** et **animées**, en **2D** comme en **3D**.

      Pour concevoir, on peut :
      - essayer, puis **annuler** et revenir en arrière ;
      - travailler sur des **calques** : des couches séparées de l'image ;
      - faire plusieurs **versions** sans abîmer la première.

  - type: texte
    titre: "Produire : pixels, vecteurs, animation, 3D"
    contenu: |-
      - **Image matricielle** (photo numérique, dessin sur tablette) : une grille de petits carrés de couleur, les **pixels**. Trop agrandie, elle devient floue, en petits carrés.
      - **Image vectorielle** : des formes et des lignes calculées. On l'agrandit sans perte de netteté.
      - **Image animée** : une suite d'images fixes montrées vite. À 12 images par seconde, 1 seconde demande 12 images. Au cinéma, on en montre 24 par seconde.
      - **En volume** : un objet modélisé à l'ordinateur peut être fabriqué par une **imprimante 3D**.

  - type: texte
    titre: "Intention, médium et codes numériques"
    contenu: |-
      Chaque **médium** permet des choses différentes : peinture, photo, dessin sur tablette, animation, 3D.
      C'est l'**intention** qui guide le choix. Le numérique est un outil, pas une fin en soi.

      Les outils ont leurs **codes** : logiciels de dessin, de retouche, de montage, filtres, programmation.
      Une artiste peut même écrire un programme qui crée une image.

  - type: texte
    titre: "Diffuser"
    contenu: |-
      Une image numérique se **copie sans perte**. Elle circule partout : écrans, réseaux, impressions de toutes tailles.
      Question : où est l'original, quand il existe mille copies identiques ?

      Exemple : le peintre David Hockney dessine sur iPad depuis 2010 environ. Ses dessins sont montrés sur écrans et en grands tirages.

      Au brevet : justifie ton choix d'outil par l'intention, et dis ce que le numérique change.

  - type: exemple
    enonce: >-
      Un élève (fictif) veut faire pousser une fleur à l'écran. Il a un appareil photo, de la pâte à
      modeler et un logiciel de montage. Comment s'y prendre ?
    etapes:
      - "Concevoir : il dessine d'abord les grandes étapes de la pousse (un scénarimage)."
      - "Produire : il modèle une petite fleur, la photographie, la fait grandir un tout petit peu, la photographie encore, et ainsi de suite."
      - "Le logiciel enchaîne les photos à une cadence régulière : c'est une animation image par image (stop motion)."
      - "Diffuser : il projette la vidéo devant la classe ou la montre sur un écran."

  - type: exercice
    enonce: >-
      Quand on agrandit beaucoup une photo numérique, on voit de petits carrés d'une seule couleur.
      Comment s'appelle chacun de ces petits carrés ?
    forme: reponse_courte
    reponse: "pixel"
    reponses_acceptees:
      - "pixel"
      - "pixels"
      - "un pixel"
      - "le pixel"
      - "les pixels"
    indices:
      - "C'est le plus petit élément d'une image matricielle, comme une petite pièce dans une mosaïque."
      - "Le mot a cinq lettres. Il vient de l'anglais et commence par « pix- »."
    explication: "C'est un pixel : le plus petit élément d'une image matricielle. Une image de 1920 × 1080 a 1920 pixels de large et 1080 de haut."

  - type: exercice
    enonce: >-
      Pour une animation image par image, une élève règle son logiciel sur 12 images par seconde.
      Combien de photos doit-elle prendre pour une animation de 8 secondes ?
    forme: nombre
    reponse: 96
    tolerance: 0
    unite: "photos"
    indices:
      - "Combien de photos faut-il pour une seule seconde ?"
      - "Chaque seconde demande le même nombre de photos : multiplie par la durée."
    explication: "12 photos par seconde × 8 secondes = 96 photos."

  - type: exercice
    enonce: >-
      Une classe crée un logo. Il sera imprimé en tout petit sur un badge et en très grand sur une
      banderole, sans devenir flou. Quel type d'image faut-il choisir ?
    forme: qcm
    choix:
      - "Une image vectorielle, faite de formes calculées"
      - "Une petite image matricielle de 100 × 100 pixels"
      - "Une photo du logo prise avec un téléphone"
    reponse: 0
    indices:
      - "Que devient une image faite de petits carrés quand on l'agrandit beaucoup ?"
      - "Cherche le type d'image qui n'est pas une grille de carrés."
    explication: "L'image vectorielle est recalculée à chaque taille : elle reste nette sur le badge comme sur la banderole. Une image matricielle agrandie devient pixelisée."

  - type: exercice
    enonce: >-
      Dans un logiciel de dessin, une élève veut changer la couleur du ciel sans abîmer le
      personnage qu'elle a déjà dessiné. Quel outil l'aide le plus ?
    forme: qcm
    choix:
      - "Les calques : le ciel et le personnage sont sur des couches séparées"
      - "L'imprimante 3D"
      - "La publication sur un réseau"
    reponse: 0
    indices:
      - "Elle veut travailler une partie de l'image sans toucher au reste."
      - "L'imprimante fabrique un volume, la publication sert à diffuser. Il reste un outil de conception."
    explication: "Les calques permettent de travailler une partie de l'image séparément. C'est un outil de conception."

  - type: exercice
    enonce: >-
      Sujet de type brevet. Un élève veut montrer une ville qui s'allume peu à peu, du jour à la
      nuit. Quel choix est le mieux justifié par cette intention ?
    forme: qcm
    choix:
      - "Une seule photo de la ville à midi, car une photo est toujours fidèle"
      - "Une série d'images sur tablette, reprises sur des calques et diffusées en boucle sur un écran, pour montrer le temps qui passe"
      - "Une sculpture en bois, car le numérique fait le travail tout seul"
    reponse: 1
    indices:
      - "L'intention parle d'un changement dans le temps. Une image fixe unique peut-elle le montrer ?"
      - "Cherche la solution qui donne plusieurs images successives et un moyen de les montrer."
    explication: "Pour montrer un changement, il faut plusieurs images successives : la série sur tablette, diffusée en boucle, sert l'intention. Le numérique ne fait pas le travail seul : c'est l'intention qui guide le choix."

  - type: question_ouverte
    question: >-
      Une élève veut représenter une forêt au fil des quatre saisons. Elle hésite entre une grande
      peinture sur toile et une série d'images sur tablette diffusées sur un écran. Explique ce que
      permet chaque solution, puis justifie un choix.
    indices:
      - "Fais deux colonnes : ce que permet la toile (matière, geste, œuvre unique), ce que permet la tablette (calques, images successives, écran, copies)."
      - "Relis l'intention : montrer le changement au fil du temps. Quelle solution le montre le mieux ?"
    criteres:
      - "L'élève décrit ce que permet la peinture et ce que permet le numérique."
      - "L'élève relie son choix à l'intention (montrer le temps qui passe)."
      - "L'élève emploie au moins deux mots de la leçon (pixel, calque, image fixe ou animée, diffusion, médium)."

  - type: synthese
    consigne: >-
      Écris, avec tes propres mots et en deux ou trois phrases, ce que le numérique change pour
      concevoir, produire et diffuser une œuvre.
