- id: pgm-question-ouverte-incomplete
  categorie: question_ouverte_incomplete
  lecon: {titre: "La Première Guerre mondiale", matiere: histoire}
  bloc:
    type: question_ouverte
    index: 5
    question: "Pourquoi dit-on que la Première Guerre mondiale a été une \"guerre totale\" ?"
    indices:
      - "Pense à qui travaille à l'arrière pendant que les hommes sont au front."
      - "Pense aussi à ce que disent les journaux et les affiches à l'époque."
    criteres:
      - "la mobilisation de l'arrière : usines transformées, femmes au travail"
      - "l'économie tout entière tournée vers l'effort de guerre"
      - "la propagande (bourrage de crâne) qui mobilise les esprits"
  tentatives: 0
  indices_vus: 0
  historique:
    - role: eleve
      texte: "Ma réponse : parce qu'il y a eu énormément de morts, c'était la guerre la plus meurtrière de l'histoire à ce moment-là."

