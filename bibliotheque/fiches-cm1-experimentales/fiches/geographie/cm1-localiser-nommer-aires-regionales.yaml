notion: cm1-localiser-nommer-aires-regionales
declencheurs:
- planisphère
- carte du monde
- continent
- Maghreb
- Asie
- Amérique
- Afrique
- Océanie
essentiel: 'Sur un planisphère, le monde est découpé en grandes aires régionales, plus précises que les continents.

  Le programme de CM1 demande de localiser et de nommer huit aires régionales : l''Afrique subsaharienne, le Maghreb,
  l''Amérique du Nord, l''Amérique du Sud, l''Asie du Sud-Est, l''Asie de l''Est, l''Europe et l''Océanie.

  Localiser, c''est savoir placer une aire régionale au bon endroit sur le planisphère. Nommer, c''est savoir écrire
  ou dire correctement son nom.'
methode:
- Repère d'abord le continent, puis la partie plus précise de ce continent.
- 'Mémorise les huit aires régionales dans l''ordre des continents : Afrique, Amérique, Asie, Europe, Océanie.'
- Entraîne-toi à les placer sur un planisphère vierge.
- Vérifie que tu sais aussi bien les localiser que les nommer à l'écrit.
vocabulaire:
- terme: aire régionale
  definition: une grande partie d'un continent, plus précise que le continent entier
- terme: planisphère
  definition: une carte qui représente le monde entier
erreurs_frequentes:
- Confondre continent et aire régionale (par exemple confondre « Afrique » et « Maghreb »).
- Oublier qu'un même continent peut contenir plusieurs aires régionales (l'Afrique subsaharienne et le Maghreb en
  Afrique).
- Se tromper entre l'Asie du Sud-Est et l'Asie de l'Est.
exemple:
  enonce: Sur un planisphère, on montre une zone au nord du continent africain, qui borde la mer Méditerranée. Quelle
    aire régionale est-ce ?
  solution: 'C''est le Maghreb : c''est l''aire régionale située au nord du continent africain.'
exercices:
- enonce: Cite les deux aires régionales du continent américain vues en CM1.
  indices:
  - Une se trouve au nord, l'autre au sud.
  solution: L'Amérique du Nord et l'Amérique du Sud.
- enonce: Cite les deux aires régionales du continent asiatique vues en CM1.
  indices:
  - Une se trouve à l'est, l'autre au sud-est.
  solution: L'Asie du Sud-Est et l'Asie de l'Est.
- enonce: Liste les huit aires régionales que l'on apprend à situer sur le planisphère en CM1.
  indices:
  - Il y en a deux en Afrique, deux en Amérique, deux en Asie, et une pour l'Europe et une pour l'Océanie.
  solution: Afrique subsaharienne, Maghreb, Amérique du Nord, Amérique du Sud, Asie du Sud-Est, Asie de l'Est, Europe,
    Océanie.
