  - intitule: "Définition des épreuves de l'examen du diplôme national du brevet à compter de la session 2027 — sous-épreuve enseignement moral et civique"
    reference: "Note de service du 11-9-2026, NOR MENE2623228N, BO spécial n° 4 du 17 septembre 2026"
