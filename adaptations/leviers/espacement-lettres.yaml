# Levier d'adaptation (docs/spec/ADAPTATIONS-LOT2.md, §2). Valeur de depart sourcee, a relire par un
# professionnel avant tout reglage pour un eleve. Format : jules/leviers.py.
id: espacement-lettres
canal: css
variable_css: --adapt-espacement-lettres
type: nombre
unite: em
neutre: 0
plage: {min: 0, max: 0.18}  # 2,5 pt sur un texte de 14 pt
combinaison: max
source:
  nature: etude
  reference: "Zorzi et al. 2012, PNAS 109(28):11455-11459, DOI 10.1073/pnas.1205566109. L'etude a regle ensemble lettres, mots et interligne : valeur a n'employer qu'avec eux (amenagement texte aere)."
