- id: risques-auditifs-et-numerique
  titre: Prévention des risques auditifs et apports du numérique
  chapitres:
  - id: sante-auditive-et-numerique
    titre: Physiologie de l'audition, notions d'acoustique, numérique
    notions:
    - id: 4e-physiologie-audition
      titre: Physiologie et fonctionnement de l'audition ; connaissance des risques
      niveau_programme: cycle 4
      attendus:
      - Physiologie et fonctionnement de l'audition ; connaissance des risques.
      - Environnement sonore et développement.
      - Notions d'acoustique et de physique du son ; notion de décibel (dB), de compression du son.
      mots_cles:
      - audition
      - risques auditifs
      - acoustique
      - décibel
      brevet: false
