notion: reperage-sur-une-sphere
essentiel: 'Sur la Terre, assimilée à une sphère, on repère un point par deux angles : sa latitude et sa longitude.

  Les parallèles sont des cercles parallèles à l''équateur ; la latitude mesure l''écart (en degrés) entre un point
  et l''équateur, de 0° à 90° Nord ou Sud. Tous les points d''un même parallèle ont la même latitude.

  Les méridiens sont des demi-cercles qui vont d''un pôle à l''autre ; la longitude mesure l''écart entre le méridien
  du point et le méridien de Greenwich, de 0° à 180° Est ou Ouest.

  On écrit par exemple : Paris (48° 51'' N ; 2° 21'' E). La latitude est donnée en premier.

  Le même principe sert à repérer un point sur n''importe quelle sphère (un globe, une boule).'
methode:
- Repérer l'équateur et le méridien de Greenwich sur la figure.
- 'Latitude : compter les degrés vers le Nord ou le Sud à partir de l''équateur (lire sur un méridien).'
- 'Longitude : compter les degrés vers l''Est ou l''Ouest à partir de Greenwich (lire sur l''équateur ou un parallèle).'
- Écrire le couple (latitude ; longitude) avec N/S et E/O.
vocabulaire:
- terme: parallèle
  definition: cercle de la sphère parallèle à l'équateur (même latitude)
- terme: méridien
  definition: demi-cercle joignant les deux pôles (même longitude)
erreurs_frequentes:
- Inverser latitude et longitude.
- Oublier d'indiquer N/S ou E/O.
- Donner une latitude supérieure à 90° ou une longitude supérieure à 180°.
- Confondre parallèles et méridiens.
exemple:
  enonce: Paris est à environ 48° 51' N et 2° 21' E. Que signifient ces nombres ?
  solution: Paris est dans l'hémisphère Nord, à 48° 51' de l'équateur (latitude), et un peu à l'Est du méridien
    de Greenwich, à 2° 21' (longitude).
exercices:
- enonce: Un point est à 20° N et 20° E. Donner les coordonnées du point diamétralement opposé sur la Terre.
  indices:
  - 'Latitude : même valeur, hémisphère opposé.'
  - 'Longitude : 180° − 20°, de l''autre côté.'
  solution: 20° S et 160° O.
- enonce: Deux villes sont sur le même méridien, à 43° N et 49° N. Sachant qu'un degré de latitude vaut environ
    111 km, estimer la distance qui les sépare.
  indices:
  - Écart de latitude × 111 km.
  solution: (49 − 43) × 111 = 666 km environ.
- enonce: Quelle est la latitude du pôle Nord ? Et de tout point de l'équateur ?
  indices:
  - La latitude se compte à partir de l'équateur.
  solution: 90° N pour le pôle Nord ; 0° pour l'équateur.
