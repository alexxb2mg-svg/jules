id: pres-loin
titre: "Figure : montrer des balles près ou loin (this, these, that, those)"
version: "1.0.0"
licence: MIT
auteurs: ["projet-jules"]
fournit:
  figures: [pres-loin]
permissions: {}
# revele false : la figure place les balles pres ou loin et en montre une ou plusieurs, sans ecrire le
# demonstratif ; c'est l'eleve qui dit this, these, that ou those.
discussion:
  pres-loin:
    quand: "Pour faire voir this, these, that, those : un enfant montre des balles ; d = distance (1 à 3 près de lui, 4 à 6 loin), q = nombre de balles (1 = singulier, 2 ou 3 = pluriel) ; la figure n'écrit pas le mot."
    valeurs:
      d: {min: 1, max: 6, pas: 1, defaut: 2}
      q: {min: 1, max: 3, pas: 1, defaut: 1}
