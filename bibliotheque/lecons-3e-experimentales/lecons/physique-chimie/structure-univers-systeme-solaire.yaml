    url: "https://www.education.gouv.fr/bo/2026/Hebdo4/MENE2623228N"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - type: objectifs
    items:
      - "Placer un astre dans l'emboîtement : Terre, système solaire, Voie lactée, Univers."
      - "Choisir l'unité de distance adaptée : kilomètre, unité astronomique ou année-lumière."
      - "Convertir des ua ou des années-lumière en km, et calculer la durée du trajet de la lumière."

  - type: texte
    titre: "L'Univers et le système solaire"
    contenu: |-
      L'**Univers** contient des centaines de milliards de **galaxies**.
      Une galaxie est un immense ensemble d'étoiles, de gaz et de poussières.
      Notre galaxie s'appelle la **Voie lactée**.
      Le **système solaire** est une toute petite partie de la Voie lactée.
      Emboîtement, du plus petit au plus grand : la Terre, le système solaire, la Voie lactée, l'Univers.

  - type: texte
    titre: "Ce qu'il y a dans le système solaire"
    contenu: |-
      Le système solaire contient le **Soleil** (une étoile) et tout ce qui tourne autour de lui :
      - 8 planètes : Mercure, Vénus, la Terre, Mars (rocheuses, dites **telluriques**), puis Jupiter, Saturne, Uranus, Neptune (géantes, dites **gazeuses**) ;
      - des satellites naturels (la Lune pour la Terre) ;
      - des planètes naines, des astéroïdes et des comètes.
      Une **étoile** produit sa propre lumière. Une planète et un satellite renvoient seulement la lumière du Soleil.

  - type: texte
    titre: "Les unités de distance"
    contenu: |-
      Entre les astres, il y a surtout du vide. Les distances sont immenses. On utilise trois unités :
      - le **kilomètre** (km) sur Terre ;
      - l'**unité astronomique** (ua) dans le système solaire : 1 ua ≈ 150 millions de km ;
      - l'**année-lumière** (al) pour les étoiles et les galaxies : 1 al ≈ 9 460 milliards de km.
      L'année-lumière est une **distance** (celle que la lumière parcourt dans le vide en un an), pas une durée.
      La lumière va à environ 300 000 km/s. Pour une durée : **t = d ÷ v**.

  - type: exemple
    enonce: >-
      Une planète imaginaire est à 1,5 ua du Soleil. Exprime cette distance en millions de km
      (1 ua ≈ 150 millions de km).
    etapes:
      - "L'unité est l'ua : c'est adapté, car on reste dans un système solaire."
      - "Pour passer des ua aux km, on multiplie le nombre d'ua par 150 millions de km."
      - "d = 1,5 × 150 = 225 millions de km."

  - type: exercice
    enonce: "Le Soleil est-il une planète, une étoile ou un satellite ?"
    forme: qcm
    choix:
      - "Une planète"
      - "Une étoile"
      - "Un satellite"
    reponse: 1
    indices:
      - "Regarde qui produit sa propre lumière."
      - "Une planète et un satellite ne font que renvoyer la lumière du Soleil."
    explication: "Le Soleil produit sa propre lumière : c'est une étoile. La Terre est une planète, la Lune un satellite."

  - type: exercice
    enonce: "Un astre est à 2 ua du Soleil. 1 ua vaut environ 150 millions de km. Calcule cette distance en millions de km."
    forme: nombre
    reponse: 300
    tolerance: 0.01
    unite: "millions de km"
    indices:
      - "Pour passer des ua aux km, on multiplie."
      - "Multiplie le nombre d'ua par la valeur d'une ua, en restant en millions de km."
    explication: "d = 2 × 150 = 300 millions de km."

  - type: exercice
    enonce: "Pour donner la distance entre le Soleil et une autre étoile, quelle unité est la plus adaptée ?"
    forme: qcm
    choix:
      - "Le kilomètre"
      - "L'unité astronomique"
      - "L'année-lumière"
    reponse: 2
    indices:
      - "Une autre étoile est beaucoup plus loin que tout le système solaire."
      - "Une unité est faite pour les distances entre étoiles et galaxies."
    explication: "Pour les étoiles et les galaxies, on utilise l'année-lumière. L'ua sert dans le système solaire."

  - type: exercice
    enonce: >-
      La lumière se propage à environ 300 000 km/s. Une sonde est à 600 000 km de la Terre.
      Combien de secondes la lumière met-elle pour faire ce trajet ?
    forme: nombre
    reponse: 2
    tolerance: 0.01
    unite: "s"
    indices:
      - "Tu connais une distance et une vitesse. Tu cherches une durée."
      - "Durée = distance ÷ vitesse. Avec des km et des km/s, on obtient des secondes."
    explication: "t = d ÷ v = 600 000 ÷ 300 000 = 2 s."

  - type: exercice
    enonce: >-
      Une étoile est à 3 années-lumière de nous. 1 année-lumière vaut environ 9 460 milliards de km.
      Calcule la distance de cette étoile en milliards de km.
    forme: nombre
    reponse: 28380
    tolerance: 1
    unite: "milliards de km"
    indices:
      - "Pour passer des années-lumière aux km, on multiplie."
      - "Multiplie le nombre d'années-lumière par la valeur d'une année-lumière."
      - "Calcule 3 × 9 460 : fais 3 × 9 000, puis 3 × 460."
    explication: "d = 3 × 9 460 = 28 380 milliards de km."

  - type: question_ouverte
    question: >-
      Explique pourquoi les astronomes utilisent l'année-lumière plutôt que le kilomètre pour
      la distance des étoiles. Appuie-toi sur un exemple chiffré.
    indices:
      - "Une année-lumière vaut combien de km ? Est-ce un petit ou un grand nombre ?"
      - "Convertis la distance d'une étoile en km pour voir la taille du nombre."
    criteres:
      - "L'élève dit que l'année-lumière est une distance : celle parcourue par la lumière dans le vide en un an."
      - "L'élève explique que les distances des étoiles en km sont des nombres énormes, difficiles à écrire et à comparer."
      - "L'élève donne un exemple chiffré juste."

  - type: synthese
    consigne: >-
      Écris en deux ou trois phrases comment tu placerais la Terre, le Soleil, la Voie lactée et
      l'Univers du plus petit au plus grand, et quelle unité de distance tu choisis pour chacune.
