notion: materialite-qualite-couleur
declencheurs:
- peinture epaisse ou diluee
- effet de la couleur en grande quantite
- melanger les couleurs sur la toile
- matiere coloree
- epaisseur de la peinture
essentiel: 'La couleur n''est pas seulement une teinte : sa qualité physique (peinture diluée et transparente, ou
  épaisse et pâteuse) change complètement son effet, même pour une même teinte de départ.

  La quantité de couleur compte aussi : une petite touche de rouge isolée n''a pas le même effet qu''une surface
  entièrement rouge — la relation entre quantité et qualité de la couleur fait partie des choix plastiques.

  Physiologiquement, la couleur est une sensation perçue par des cellules de l''œil (les cônes de la rétine) puis
  interprétée par le cerveau : elle dépend donc autant de la matière colorée que de la perception du spectateur,
  de la lumière ambiante et des couleurs voisines.'
methode:
- Décider si la couleur doit être diluée (transparente, légère) ou épaisse (dense, en relief).
- 'Réfléchir à la quantité de couleur à utiliser : une touche isolée n''a pas le même poids qu''une surface entière.'
- 'Observer l''effet d''une couleur à côté d''une autre : les couleurs voisines modifient la perception.'
- Tester la même couleur en petite et grande quantité pour comparer les effets.
erreurs_frequentes:
- Penser que seule la teinte compte, en oubliant la quantité et l'épaisseur.
- Utiliser une couleur pure et saturée partout sans varier son intensité.
- Ignorer que deux couleurs voisines modifient la perception l'une de l'autre.
exemple:
  enonce: Une même peinture rouge est utilisée en une fine touche dans un coin, puis en aplat couvrant toute une
    toile.
  solution: La touche isolée attire le regard comme un accent ; l'aplat entier impose une atmosphère colorée dominante.
    La quantité de couleur change son rôle dans la composition, sans que la teinte elle-même change.
exercices:
- enonce: 'À la maison : avec une seule couleur (peinture, feutre ou crayon de couleur), fais un essai en couche
    très fine et un essai en couche très épaisse sur le même papier.'
  indices:
  - Utilise si possible la même quantité de matière mais étalée différemment.
  solution: Réussite si la différence de densité est visible et si tu peux dire lequel des deux essais paraît «
    plus fort » visuellement.
- enonce: Place une petite touche de couleur vive sur un fond très clair, puis la même touche sur un fond sombre,
    et compare son effet.
  indices:
  - Utilise la même quantité de couleur dans les deux cas.
  solution: Réussite si tu observes et expliques que la même couleur paraît plus ou moins intense selon la couleur
    du fond.
