            mots_cles: [création, réalisation, styles]
            brevet: false
            source: "Programme cycle 4, « Attendus de fin de cycle »"
          - id: presenter-justifier-choix
            titre: "Présenter et justifier des choix d'interprétation et de création"
            niveau_programme: "cycle 4"
            attendus:
              - "Présenter et justifier des choix d'interprétation et de création, justifier un avis sur une œuvre et défendre un point de vue en l'argumentant."
            mots_cles: [justification, argumentation, point de vue]
            brevet: false
            source: "Programme cycle 4, « Attendus de fin de cycle »"
