notion: institutions-europeennes-citoyennete
declencheurs:
- citoyen européen
- Cour de justice de l'UE
- CEDH
- Conseil de l'Europe
- droit communautaire
- recours devant une juridiction européenne
- droits en Europe
essentiel: 'Depuis l''après-guerre, la démocratie française s''inscrit dans des institutions européennes qui renforcent
  les droits des citoyens : le Conseil de l''Europe (organisation créée en 1949, distincte de l''Union européenne)
  et l''Union européenne elle-même.

  Au sein de l''Union européenne, les États membres doivent appliquer le droit de l''Union : traités, règlements,
  directives et décisions de la Cour de justice de l''Union européenne (CJUE), installée à Luxembourg depuis 1952.
  La CJUE veille au respect du droit de l''Union par les États membres et l''interprète à la demande des juges nationaux.

  Un citoyen européen peut faire valoir ses droits devant deux juridictions européennes différentes : la Cour de
  justice de l''Union européenne (pour le droit de l''UE) et la Cour européenne des droits de l''homme (CEDH), instituée
  en 1959 par le Conseil de l''Europe et installée à Strasbourg, qui veille au respect de la Convention européenne
  des droits de l''homme dans les 46 pays qui l''ont signée.'
methode:
- 'Distinguer clairement Union européenne et Conseil de l''Europe : deux organisations différentes, pas les mêmes
  membres.'
- 'Distinguer les deux juridictions européennes : CJUE (droit de l''UE, siège à Luxembourg) et CEDH (droits de l''homme,
  siège à Strasbourg).'
- Retenir qu'un citoyen peut saisir ces juridictions pour faire respecter ses droits.
- Ne pas confondre « Cour de justice de l'Union européenne » et « Cour européenne des droits de l'homme », souvent
  confondues à cause de leurs noms proches.
vocabulaire:
- terme: CJUE
  definition: Cour de justice de l'Union européenne, à Luxembourg, qui veille au respect du droit de l'Union européenne
- terme: CEDH
  definition: Cour européenne des droits de l'homme, à Strasbourg, qui veille au respect de la Convention européenne
    des droits de l'homme
- terme: droit communautaire
  definition: l'ensemble des règles juridiques adoptées par l'Union européenne, que ses États membres doivent respecter
erreurs_frequentes:
- 'Confondre la Cour de justice de l''Union européenne (CJUE) et la Cour européenne des droits de l''homme (CEDH)
  : deux institutions différentes, liées à deux organisations différentes.'
- 'Croire que le Conseil de l''Europe est une institution de l''Union européenne : ce sont deux organisations distinctes.'
- Penser qu'un citoyen ne peut s'adresser qu'à la justice de son propre pays.
- Oublier le nombre de pays concernés par la Convention européenne des droits de l'homme (46).
exemple:
  enonce: Quelle est la différence entre la CJUE et la CEDH ?
  solution: La CJUE (Cour de justice de l'Union européenne), à Luxembourg, veille au respect du droit de l'Union
    européenne par ses 27 États membres. La CEDH (Cour européenne des droits de l'homme), à Strasbourg, veille au
    respect de la Convention européenne des droits de l'homme dans 46 pays membres du Conseil de l'Europe, qui est
    une organisation différente de l'UE.
exercices:
- enonce: Où siègent la CJUE et la CEDH ?
  indices:
  - Deux villes différentes.
  solution: La CJUE siège à Luxembourg ; la CEDH siège à Strasbourg.
- enonce: 'Développement construit : explique comment un citoyen européen peut faire valoir ses droits devant une
    juridiction européenne.'
  indices:
  - Distingue les deux juridictions possibles.
  - Précise ce que chacune contrôle.
  solution: 'Un développement réussi doit présenter les deux juridictions : la CJUE, qui contrôle le respect du
    droit de l''Union européenne par les États membres, et la CEDH, qui contrôle le respect de la Convention européenne
    des droits de l''homme ; expliquer qu''un citoyen peut, sous certaines conditions, saisir l''une ou l''autre
    pour faire reconnaître une violation de ses droits ; conclure sur l''intérêt de ce double niveau de protection
    des droits en Europe.'
- enonce: L'Union européenne et le Conseil de l'Europe sont-ils la même organisation ?
  indices:
  - Regarde leurs institutions respectives (CJUE contre CEDH).
  solution: 'Non : ce sont deux organisations distinctes. L''Union européenne (27 membres) a créé la CJUE ; le Conseil
    de l''Europe (46 membres, plus large que l''UE) a créé la CEDH.'
