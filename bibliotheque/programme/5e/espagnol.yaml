# DONNÉES D'EXPÉRIMENTATION — référentiel 5e 2026-2027 de Jules.
# Découpage fait par les contributeurs à partir des textes officiels cités ci-dessous,
# non relu par un enseignant, non publié par le ministère. Le cours de l'élève fait foi.
# AVERTISSEMENT SUPPLEMENTAIRE : ce fichier est adapte de la structure du programme d'anglais
# (annexe 3) pour l'espagnol (annexe 4). Les contenus culturels et linguistiques sont des
# contenus plausibles bases sur la structure connue du programme ; ils doivent etre verifies
# contre le texte officiel de l'annexe 4 de l'arrete du 5 mai 2025.
