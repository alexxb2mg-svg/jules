format: 2
notion: nombres-premiers-decomposition
version: 1
etat: verifiee
declencheurs:
- nombre premier
- nombres premiers
- facteurs premiers
- décomposer en produit
- décomposition en facteurs
prerequis:
- multiples-diviseurs-division-euclidienne
essentiel: 'b est un diviseur de a (a est un multiple de b) s''il existe un entier q tel que a = b × q.


  Un nombre premier a exactement deux diviseurs : 1 et lui-même (2, 3, 5, 7, 11, 13...). 1 n''est pas premier.


  Tout entier supérieur ou égal à 2 est premier ou se décompose de façon unique en produit de facteurs premiers :

  1 848 = 2³ × 3 × 7 × 11.


  La décomposition sert à simplifier une fraction jusqu''à la rendre irréductible.'
methode:
- Diviser le nombre par le plus petit nombre premier possible (2, puis 3, 5, 7...).
- Recommencer avec le quotient, jusqu'à obtenir 1.
- Écrire le produit de tous les diviseurs utilisés, avec des puissances.
- 'Pour savoir si n est premier : tester les nombres premiers dont le carré ne dépasse pas n.'
- 'Pour simplifier une fraction : décomposer numérateur et dénominateur, puis barrer les facteurs communs.'
erreurs_frequentes:
- Croire que 1 est premier, ou que tous les nombres impairs le sont (9, 15, 21, 91 ne le sont pas).
- Laisser un facteur non premier dans la décomposition (par exemple 4 ou 6).
- Arrêter la décomposition avant d'arriver à 1.
exemple:
  enonce: Décomposer 1 250 en produit de facteurs premiers.
  solution: 1 250 = 2 × 625 = 2 × 5 × 5 × 5 × 5 = 2 × 5⁴.
exercices:
- id: un-est-il-premier
  type: texte_court
  difficulte: 1
  enonce: Le nombre 1 est-il un nombre premier ? Réponds par oui ou par non.
  reponse:
    acceptees:
    - non
  indices:
    relance: 'Relis la définition : un nombre premier a exactement combien de diviseurs ?'
    methode: Écris la liste de tous les diviseurs de 1, puis compare avec la définition.
    etape: 'Les diviseurs de 1 : il n''y en a qu''un, 1 lui-même. Est-ce « exactement deux » ?'
  pieges:
  - si:
      valeur: oui
    relance: Combien de diviseurs a le nombre 1 ? Et combien doit en avoir un nombre premier ?
  solution: 'Non : 1 n''a qu''un seul diviseur (lui-même), alors qu''un nombre premier en a exactement deux.'
- id: decomposer-360
  type: nombre
  difficulte: 1
  enonce: Décompose 360 en produit de facteurs premiers.
  reponse:
    valeur: 360
    forme: produit_premiers
  indices:
    relance: Par quel nombre premier 360 est-il divisible ? Commence par le plus petit.
    methode: Divise par 2 tant que c'est possible, puis essaie 3, puis 5... jusqu'à obtenir 1. Note chaque diviseur.
    etape: 'Première étape : 360 = 2 × 180. Continue avec 180, et écris le produit avec des puissances.'
  pieges:
  - si:
      diagnostic: facteur_non_premier
    relance: Ton produit fait bien 360, mais un de tes facteurs n'est pas premier. Lequel peux-tu encore décomposer ?
  - si:
      diagnostic: produit_faux
    relance: 'Calcule ton produit : retrouves-tu 360 ? Reprends tes divisions une par une.'
  solution: 360 = 2 × 180 = 2 × 2 × 90 = 2 × 2 × 2 × 45 = 2 × 2 × 2 × 3 × 15 = 2 × 2 × 2 × 3 × 3 × 5, soit 2³ × 3² × 5.
- id: lesquels-sont-premiers
  type: choix
  difficulte: 2
  enonce: Parmi ces nombres, lesquels sont premiers ?
  reponse:
    options:
    - id: a
      texte: '91'
    - id: b
      texte: '97'
    - id: c
      texte: '51'
    - id: d
      texte: '53'
    bonnes:
    - b
    - d
  indices:
    relance: Un nombre premier a exactement deux diviseurs. Pour chaque nombre, cherche un autre diviseur que 1 et lui-même.
    methode: Teste la division par 2, 3, 5 et 7. Inutile d'aller plus loin ici, car 11 × 11 = 121 dépasse tous ces nombres.
    etape: 'Commence par 51 : 5 + 1 = 6, donc 51 est divisible par 3. Fais de même avec les trois autres.'
  pieges:
  - si:
      contient:
      - a
    relance: 91 est impair, mais est-il divisible par 7 ? Fais la division.
  - si:
      contient:
      - c
    relance: Additionne les chiffres de 51. Que t'apprend le résultat sur la divisibilité par 3 ?
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé, mais pas tous. Teste chaque nombre que tu n'as pas choisi.
  solution: '91 = 7 × 13 et 51 = 3 × 17 ne sont pas premiers. 97 et 53 ne sont divisibles ni par 2, 3, 5 ni 7, et 11² = 121
    dépasse : 97 et 53 sont premiers.'
- id: irreductible-252-360
  type: nombre
  difficulte: 2
  enonce: Rends irréductible la fraction 252/360. Écris ta réponse sous la forme a/b.
  reponse:
    valeur: 7/10
    forme: fraction_irreductible
  indices:
    relance: Quels facteurs premiers 252 et 360 ont-ils en commun ?
    methode: Décompose 252 et 360 en produits de facteurs premiers, puis barre les facteurs communs.
    etape: 252 = 2² × 3² × 7. Décompose 360 de la même façon, puis compare les deux produits.
  pieges:
  - si:
      diagnostic: non_irreductible
    relance: Ta fraction est bien égale à 252/360, mais on peut encore la simplifier. Cherche un facteur commun au numérateur
      et au dénominateur.
  - si:
      diagnostic: pas_une_fraction
    relance: Ta valeur est juste, mais on attend une fraction écrite a/b, avec deux nombres entiers.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta fraction en multipliant son numérateur et son dénominateur par un même nombre. Retrouves-tu 252/360
      ?
  solution: 252 = 2² × 3² × 7 et 360 = 2³ × 3² × 5. On barre 2² × 3² en haut et en bas, il reste 7/(2 × 5) = 7/10.
- id: justifier-97
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi 97 est un nombre premier, en montrant les essais de division que tu fais.
  criteres:
  - L'élève teste la divisibilité par 2, 3, 5 et 7 (et montre que la division ne tombe pas juste).
  - L'élève dit pourquoi il peut s'arrêter à 7 (11 × 11 = 121 dépasse 97).
  - L'élève conclut que 97 n'a que deux diviseurs, 1 et lui-même.
  indices:
    relance: Qu'est-ce qu'il faut montrer pour dire qu'un nombre est premier ?
    methode: Essaie de diviser 97 par les nombres premiers dans l'ordre, et note ce que tu obtiens à chaque fois.
    etape: 'Commence : 97 est impair, donc pas divisible par 2. Et par 3 ? Additionne ses chiffres.'
  solution: '97 est impair (pas divisible par 2) ; 9 + 7 = 16 n''est pas multiple de 3 ; il ne finit ni par 0 ni par 5 ; 97
    = 7 × 13 + 6. Comme 11 × 11 = 121 dépasse 97, inutile de tester plus loin : 97 n''a que deux diviseurs, 1 et 97, il est
    premier.'
