notion: place-france-europe-monde
declencheurs:
- influence de la France dans le monde
- puissance française
- francophonie
- rayonnement culturel
- membre permanent ONU
- diplomatie française
essentiel: 'La France exerce une influence culturelle, géopolitique et économique qui dépasse largement son territoire.
  Sur le plan géopolitique, elle est membre permanent du Conseil de sécurité de l''Organisation des Nations unies
  (ONU), ce qui lui donne un droit de veto sur les décisions internationales importantes, et elle possède l''arme
  nucléaire.

  Sur le plan culturel, la francophonie rassemble les pays et les populations qui utilisent le français, en partie
  héritée de l''ancien empire colonial français. L''Organisation internationale de la Francophonie (OIF), créée
  en 1970, réunit 90 États et gouvernements pour promouvoir la langue française et la coopération entre ses membres.

  Sur le plan économique, la France est une puissance industrielle, agricole et touristique majeure, membre du G7
  (les pays les plus industrialisés). Elle est aussi influente au sein de l''Union européenne, dont elle est l''un
  des membres fondateurs et l''un des principaux moteurs politiques et économiques.'
methode:
- 'Distinguer les trois types d''influence à illustrer : culturelle (francophonie), géopolitique (ONU), économique
  (G7, UE).'
- Pour chaque type d'influence, donner un exemple concret et daté si possible.
- Éviter les généralités du type « la France est une grande puissance » sans preuve précise.
- Relier l'influence actuelle de la France à son histoire (ancien empire colonial, rôle fondateur dans la construction
  européenne).
vocabulaire:
- terme: francophonie
  definition: l'ensemble des populations et des pays qui utilisent le français, en partie liée à l'histoire coloniale
    française
- terme: membre permanent (ONU)
  definition: l'un des cinq pays qui siègent en permanence au Conseil de sécurité de l'ONU avec un droit de veto
    (avec les États-Unis, la Russie, la Chine et le Royaume-Uni)
erreurs_frequentes:
- Confondre francophonie (pratique de la langue française) et OIF (l'organisation qui l'incarne officiellement).
- Oublier que l'influence géopolitique de la France passe notamment par son siège permanent au Conseil de sécurité
  de l'ONU.
- Réduire l'influence de la France au seul plan culturel, en oubliant l'économie et la diplomatie.
- Ne pas illustrer par un exemple précis (organisation, date, chiffre).
exemple:
  enonce: Donne un exemple d'influence géopolitique et un exemple d'influence culturelle de la France dans le monde.
  solution: 'Géopolitique : la France est membre permanent du Conseil de sécurité de l''ONU, avec un droit de veto.
    Culturelle : elle est au cœur de la francophonie, incarnée par l''Organisation internationale de la Francophonie
    (OIF), créée en 1970 et qui réunit 90 États et gouvernements.'
exercices:
- enonce: Qu'est-ce que l'Organisation internationale de la Francophonie et quand a-t-elle été créée ?
  indices:
  - Une date proche de 1970.
  solution: L'OIF est une organisation intergouvernementale créée en 1970, qui réunit 90 États et gouvernements
    pour promouvoir la langue française et la coopération entre ses membres.
- enonce: 'Développement construit : montre que l''influence de la France dans le monde repose sur plusieurs dimensions.'
  indices:
  - Traite au moins deux dimensions (culturelle, géopolitique ou économique).
  - Illustre chaque dimension par un exemple précis.
  solution: 'Un développement réussi doit présenter au moins deux dimensions : par exemple l''influence géopolitique
    (siège permanent au Conseil de sécurité de l''ONU) et l''influence culturelle (la francophonie, incarnée par
    l''OIF) ; on peut ajouter l''influence économique (membre du G7, rôle moteur dans l''Union européenne) ; conclure
    en montrant que cette influence est en partie héritée de l''histoire (ancien empire colonial, construction européenne).'
- enonce: Pourquoi le siège permanent au Conseil de sécurité de l'ONU est-il un atout pour l'influence de la France
    ?
  indices:
  - Que permet un droit de veto ?
  solution: Il permet à la France de participer aux décisions les plus importantes concernant la paix et la sécurité
    internationales et de disposer d'un droit de veto, c'est-à-dire la possibilité de bloquer une décision, ce qui
    lui donne un poids diplomatique important.
