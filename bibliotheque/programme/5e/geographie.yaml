# DONNÉES D'EXPÉRIMENTATION — référentiel 5e 2026-2027 de Jules.
# Découpage fait par les contributeurs à partir des textes officiels cités ci-dessous,
# non relu par un enseignant, non publié par le ministère. Le cours de l'élève fait foi.
matiere: Géographie
id: geographie
niveau: 5e
annee_scolaire: "2026-2027"
statut: experimentale
relecture: a_relire          # a_relire | relue (par un enseignant)
avertissement: >-
  Données d'expérimentation, non validées par un enseignant ni par l'Éducation nationale.
  Le cours de l'élève et la parole de son professeur font toujours foi.
textes_officiels:
  - intitule: "Programme du cycle 4 (annexe 3) — partie Histoire et géographie, classe de 5e"
    reference: "BOEN n° 31 du 30 juillet 2020 (arrêté du 17-7-2020)"
    url: "https://eduscol.education.fr/document/621/download"
    consulte_le: "2026-09-24"
perimetre: >
  Programme de géographie de la classe de 5e, première année du cycle 4. Le BO n° 31 du 30
  juillet 2020 rattache explicitement trois thèmes à la « Classe de 5e » au titre des « Repères
  annuels de programmation » : La question démographique et l'inégal développement ; Des
  ressources limitées, à gérer et à renouveler ; Prévenir les risques, s'adapter au changement
  global. La 5e fait suite au cycle 3, centré sur la notion « Habiter » ; elle initie les élèves
  aux enjeux du développement durable et de la mondialisation à l'échelle mondiale, avant que la
  4e n'approfondisse la mondialisation et que la 3e ne se concentre sur la France et l'Union
  européenne. Comme pour l'histoire, le texte ne fournit pas de liste de repères spatiaux
  distincte : les repères attendus sont ceux mentionnés dans les « démarches et contenus
  d'enseignement » de chaque sous-thème.
brevet:
