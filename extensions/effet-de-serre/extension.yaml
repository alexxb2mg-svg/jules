discussion:
  effet-de-serre:
    quand: "Pour faire voir l'effet de serre : la lumière du Soleil (orange) chauffe le sol, qui émet de l'infrarouge (rouge) ; les gaz à effet de serre en renvoient une partie vers le sol. co2 en ppm : environ 180 aux périodes glaciaires, 280 avant 1850, environ 425 en 2024. Schéma, pas une mesure."
    valeurs:
      co2: {min: 180, max: 560, pas: 20, defaut: 280}
