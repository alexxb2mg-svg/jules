notion: validation-comportement-mecanique
declencheurs:
- résistance mécanique
- déformation
- test mécanique
- flexion
- rupture
- effort
- contrainte mécanique
- solidité
- plie ou casse
- résiste à un poids
- casse sous un poids
essentiel: 'Valider le comportement mécanique d''une pièce ou d''un objet, c''est vérifier qu''il résiste aux efforts
  (forces) qu''il subira en usage réel, sans se déformer de façon excessive ni casser.


  Sous l''effet d''une contrainte croissante, un matériau passe généralement par plusieurs étapes : d''abord une
  déformation élastique (réversible : le matériau reprend sa forme initiale si l''effort cesse), puis, si l''effort
  augmente encore, une déformation plastique (irréversible : une déformation résiduelle subsiste), et enfin la rupture
  si l''effort dépasse la résistance du matériau.


  Pour valider le comportement mécanique, on peut réaliser des essais physiques (appliquer une charge connue et
  observer la déformation) ou des simulations numériques qui calculent, à partir des propriétés du matériau et de
  la forme de la pièce, les zones les plus sollicitées.'
methode:
- Identifier les efforts que la pièce subira réellement en usage (poids, choc, flexion, traction).
- 'Choisir un test adapté : essai physique (appliquer une charge progressive) ou simulation numérique.'
- Observer si la déformation reste élastique (réversible) ou devient plastique (irréversible) sous l'effort testé.
- 'Comparer le résultat du test aux exigences du cahier des charges (par exemple : « ne doit pas se déformer sous
  5 kg »).'
vocabulaire:
- terme: déformation plastique
  definition: déformation irréversible qui subsiste après la disparition de l'effort
- terme: rupture
  definition: séparation du matériau en plusieurs morceaux quand l'effort dépasse sa résistance
erreurs_frequentes:
- Confondre déformation élastique (réversible) et déformation plastique (définitive).
- Tester une pièce avec un effort très différent de celui qu'elle subira réellement.
- Ne pas répéter le test alors qu'une seule mesure peut être trompeuse.
exemple:
  enonce: On teste une étagère en plaçant progressivement des poids dessus. À 3 kg elle plie légèrement et reprend
    sa forme une fois les poids retirés ; à 8 kg elle reste pliée même sans poids. Nommer les deux comportements
    observés.
  solution: 'À 3 kg : déformation élastique (réversible, l''étagère reprend sa forme). À 8 kg : déformation plastique
    (irréversible, une déformation résiduelle subsiste).'
exercices:
- enonce: Pourquoi est-il important de tester une pièce avec un effort légèrement supérieur à celui qu'elle subira
    réellement en usage ?
  indices:
  - Pense à la marge de sécurité.
  solution: 'Pour avoir une marge de sécurité : l''objet doit pouvoir supporter sans problème un effort un peu plus
    important que celui prévu en usage normal, au cas où l''usage réel dépasserait légèrement les prévisions (choc
    accidentel, surcharge ponctuelle).'
