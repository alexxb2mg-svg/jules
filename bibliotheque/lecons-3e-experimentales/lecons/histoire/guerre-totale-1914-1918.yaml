    url: "https://fr.vikidia.org/wiki/Premi%C3%A8re_Guerre_mondiale"
    licence: CC-BY-SA-3.0
  - titre: "Vikidia, « Bataille de Verdun »"
    url: "https://fr.vikidia.org/wiki/Bataille_de_Verdun"
    licence: CC-BY-SA-3.0
  - titre: "Vikidia, « Génocide arménien »"
