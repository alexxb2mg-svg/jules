id: phrase-en-blocs
titre: "Figure : une phrase en blocs de couleur, qu'on transforme et qu'on manipule"
version: "1.0.0"
licence: MIT
auteurs: ["projet-jules"]
fournit:
  figures: [phrase-en-blocs]
permissions: {}
# Figure que Jules peut montrer dans la discussion (bloc ```figure, voir docs/EXTENSIONS.md). Une seule figure pour
# quatre fiches CM1 de grammaire : le curseur phrase choisit la scene (1 types et formes, 2 manipuler les groupes,
# 3 nature et fonction) ; chaque fiche le fige (min = max). Les lectures ne sont pas choisies par la PRESENCE d'un
# curseur (vague 2 : aucun curseur lu hors discussion), donc tous les curseurs sont declares ici.
# Sept valeurs declarees : chaque fiche n'en montre que deux ou trois, les autres sont figees (min = max).
# revele false : la figure ecrit ses trois phrases modeles (Tu ranges ta chambre ; Le chat
# poursuit la souris dans le jardin ; le matin), pas celles des exercices, et ne donne aucune reponse a calculer.
discussion:
  phrase-en-blocs:
    quand: "Phrase en blocs : sujet bleu, verbe rouge, COD vert, circonstanciel orange. phrase 1 : type 1 à 4 (déclaratif, inversion, est-ce que, impératif), negatif 0/1. phrase 2 : groupe 1 sujet, 2 COD, 3 circ. ; position 1 déplacé, pronom 1, supprime 1. phrase 3 : position 0 à 2 = fonction."
    valeurs:
      phrase: {min: 1, max: 3, pas: 1, defaut: 2}
      type: {min: 1, max: 4, pas: 1, defaut: 1}
      negatif: {min: 0, max: 1, pas: 1, defaut: 0}
      groupe: {min: 1, max: 3, pas: 1, defaut: 3}
      position: {min: 0, max: 2, pas: 1, defaut: 0}
      pronom: {min: 0, max: 1, pas: 1, defaut: 0}
      supprime: {min: 0, max: 1, pas: 1, defaut: 0}
