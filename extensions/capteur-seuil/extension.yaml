    quand: "Pour faire voir une chaîne d'information (acquérir, traiter, communiquer) et un test « si… alors… sinon » : un capteur de lumière donne une mesure de 0 à 1023, le programme teste « mesure < seuil ? » ; oui : il allume la LED, non : il l'éteint. Au cas limite mesure = seuil, le test « < » est faux."
