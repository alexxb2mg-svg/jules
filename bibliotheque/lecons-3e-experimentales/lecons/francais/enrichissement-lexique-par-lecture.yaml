relecture: {statut: a_relire}
blocs:
  - type: objectifs
    items:
      - "Chercher un mot inconnu (contexte, découpage, dictionnaire) et réutiliser les mots appris."
      - "Distinguer champ lexical et champ sémantique, et classer des mots par intensité ou par généralité."
      - "Donner le sens de quelques préfixes, suffixes et étymons grecs ou latins."

  - type: texte
    titre: "Enrichir son lexique"
    contenu: >-
      Le **lexique**, ce sont les mots que tu connais et que tu sais utiliser.


      - **Lire** : chaque texte t'apprend des mots en contexte.

      - **Écrire et parler** : tu réutilises les mots appris, à bon escient (le bon mot au bon endroit).

      - **Chercher** : le dictionnaire (papier ou numérique) donne le sens, la nature du mot, des exemples,
      parfois l'origine.


      Si un mot a plusieurs sens, choisis celui qui va avec le contexte.

  - type: texte
    titre: "Champ lexical et champ sémantique"
    contenu: >-
      Ces deux expressions se ressemblent. Ne les confonds pas.


      | Expression | Ce que c'est | Exemple |

      |---|---|---|

      | **Champ lexical** | des mots **différents** liés à un même thème | mer : vague, marée, écume |

      | **Champ sémantique** | les **différents sens d'un seul mot** | glace : eau gelée, miroir, dessert |


      Un champ lexical peut mélanger des noms, des verbes et des adjectifs.

  - type: texte
    titre: "Classer les mots, comprendre leur origine"
    contenu: >-
      **Par intensité**, du plus faible au plus fort : tiède, chaud, brûlant. Deux synonymes n'ont pas
      toujours la même force.


      **Par généralité**, du plus général au plus précis : chaque mot est « contenu » dans le précédent.


      **Affixes et étymons** : un préfixe se place avant le radical, un suffixe après. Un étymon est le
      mot d'origine, souvent latin ou grec.


      | Élément | Sens |

      |---|---|

      | bio- | la vie |

      | chrono- | le temps |

      | hydro- | l'eau |

      | télé- | loin |

      | poly- | nombreux |

      | extra- | en dehors de |

      | -logie | étude |

      | -graphie | écriture |


      Attention : un préfixe n'a pas toujours le même sens. Vérifie dans le dictionnaire.

  - type: exemple
    enonce: >-
      Range ces trois mots du plus faible au plus fort : « content », « ravi », « satisfait ».
    etapes:
      - "Je cherche l'idée commune : ces trois mots expriment une joie."
      - "Je me demande pour chacun : est-ce une joie mesurée, simple ou très forte ?"
      - "« Satisfait » exprime un accord mesuré. « Content » exprime une joie simple. « Ravi » exprime une joie très intense."
      - "Résultat, du plus faible au plus fort : satisfait, content, ravi."

  - type: exercice
    enonce: "Lequel de ces mots appartient au champ lexical de la forêt ?"
    forme: qcm
    choix:
      - "feuillage"
      - "cartable"
      - "radiateur"
      - "clavier"
    reponse: 0
    indices:
      - "Pense à ce que tu vois quand tu marches sous les arbres."
      - "Trois mots parlent de l'école ou de la maison. Un seul parle des arbres."
    explication: "« Feuillage » désigne les feuilles des arbres : il appartient au champ lexical de la forêt. Les trois autres mots n'ont pas de lien avec ce thème."

  - type: exercice
    enonce: "Comment s'appelle l'ensemble des différents sens d'un même mot, comme « glace » (eau gelée, miroir, dessert) ? Réponds par deux mots."
    forme: reponse_courte
    reponse: "champ sémantique"
    reponses_acceptees:
      - "le champ sémantique"
      - "champ semantique"
      - "le champ semantique"
    indices:
      - "Le premier mot est le même que dans « champ lexical »."
      - "Le second mot est un adjectif qui vient du mot « sens »."
    explication: "Le champ sémantique regroupe les différents sens d'un seul mot. Le champ lexical, lui, regroupe des mots différents autour d'un thème."

  - type: exercice
    enonce: "Quelle liste va du moins intense au plus intense pour parler du froid ?"
    forme: qcm
    choix:
      - "frais, froid, glacial"
      - "glacial, froid, frais"
      - "froid, glacial, frais"
    reponse: 0
    indices:
      - "Imagine une échelle de température qui descend. Commence par le mot le plus doux."
      - "« Frais » décrit une soirée légèrement fraîche. « Glacial » décrit un froid extrême."
    explication: "Du moins intense au plus intense : frais, froid, glacial. « Frais » est léger, « froid » est net, « glacial » est extrême."

  - type: exercice
    enonce: "Parmi les mots « rose », « fleur » et « plante », lequel est le plus général ?"
    forme: qcm
    choix:
      - "rose"
      - "fleur"
      - "plante"
    reponse: 2
    indices:
      - "Imagine des cercles emboîtés : le plus grand contient les autres."
      - "Une rose est une fleur. Et une fleur fait partie de quel groupe encore plus large ?"
    explication: "Une rose est une fleur, et une fleur est une plante. « Plante » est le mot le plus général, « rose » le plus précis."

  - type: exercice
    enonce: >-
      Le mot « chronologie » est formé de « chrono- » et de « -logie ». D'après le tableau de la leçon,
      que veut dire littéralement ce mot ? Réponds par trois mots.
    forme: reponse_courte
    reponse: "étude du temps"
    reponses_acceptees:
      - "l'étude du temps"
      - "etude du temps"
      - "l'etude du temps"
    indices:
      - "Cherche chaque morceau dans le tableau de la leçon."
      - "Lis le mot dans l'ordre : d'abord le sens de « -logie », puis celui de « chrono- »."
    explication: "« Chrono- » veut dire le temps et « -logie » veut dire étude. Littéralement, « chronologie » signifie l'étude du temps."

  - type: question_ouverte
    question: >-
      Tu rencontres le mot inconnu « hydrographie » dans un texte. Explique les étapes pour deviner son sens,
      comment tu vérifies, puis écris une phrase qui réutilise ce mot.
    indices:
      - "Découpe le mot en deux morceaux. Cherche le sens de chacun dans le tableau."
      - "Fais une hypothèse de sens, puis dis où tu la vérifies."
    criteres:
      - "L'élève découpe le mot en éléments d'origine grecque (hydro- : l'eau ; -graphie : écriture) et en déduit un sens probable lié à l'eau."
      - "L'élève dit qu'il vérifie son hypothèse dans un dictionnaire papier ou numérique et la confronte au contexte."
      - "L'élève réutilise correctement le mot dans une phrase de sa composition."

  - type: synthese
    consigne: >-
      Écris, avec tes mots et en deux ou trois phrases, la différence entre champ lexical et champ
      sémantique, et ce que tu fais quand tu rencontres un mot inconnu.
