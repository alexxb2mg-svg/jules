id: itineraire-carte
titre: "Figure : un navire avance sur une carte le long d'un itinéraire historique"
version: "1.0.0"
licence: MIT
auteurs: ["projet-jules"]
fournit:
  figures: [itineraire-carte]
permissions: {}
# Carte simplifiée (projection équirectangulaire), route parcourue en trait plein, route à venir en pointillé.
# avancee : part du voyage en % du temps ; jeu : 1 = Magellan et Elcano (1519-1522), 2 = Colomb (1492, aller),
# 3 = commerce triangulaire (contenu de la cale à chaque trajet). Dates et sources en tête de gabarit.js (EX-205).
# revele: les jeux 1 et 2 écrivent la date du moment (« avril 1521 ») et le jeu 3 le contenu de la cale : réponse
# d'un exercice « quand » ou « que transporte le navire » ; la version sans écrit ne disait plus rien de l'étape.
discussion:
  itineraire-carte:
    quand: "Pour suivre un voyage historique sur une carte : jeu 1 = premier tour du monde de Magellan et Elcano (1519-1522), 2 = premier voyage de Colomb (1492), 3 = commerce triangulaire Europe-Afrique-Amérique (ce que contient la cale) ; avancee = part du voyage déjà faite, en %."
    revele: true
    valeurs:
      avancee: {min: 0, max: 100, pas: 5, defaut: 0}
      jeu: {min: 1, max: 3, pas: 1, defaut: 1}
