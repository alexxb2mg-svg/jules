    - id: 5e-grammaire-phrase-et-organisation
      titre: 'Grammaire : la phrase et son organisation'
      niveau_programme: 5e
      attendus:
      - 'Niveau A1+ : former des phrases simples (affirmatives, négatives avec not et interrogatives)
        ; faire varier le degré d''intensité de la qualité à l''aide d''adverbes de degré (very, much,
        too) ; utiliser quelques conjonctions de coordination dans des énoncés simples (and, but, or)
        ; utiliser quelques connecteurs chronologiques ou logiques (first, then, like, for example, so)
        ; utiliser les modalisateurs maybe ou perhaps.'
      - 'Niveau A2 : exprimer l''intensité avec des adverbes (so, enough, really, completely, almost,
        quite) ; formuler des hypothèses, y compris sous forme lexicalisée (If you gaze at this painting,
        you''ll notice…) ; passer du discours direct au discours indirect (The author wonders if the city
        ever sleeps).'
      mots_cles:
      - phrase
      - conjonctions
      - connecteurs
      - hypothèse
      - discours indirect
      - A1+
      - A2
      brevet: false
