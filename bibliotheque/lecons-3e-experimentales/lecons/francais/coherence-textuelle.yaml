notion: coherence-textuelle
titre: "La cohérence d'un texte : reprises, connecteurs, temps"
duree_minutes: 30
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme du cycle 4 (annexe 3), enseignement du français — BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Attendus de fin d'année de 3e — Français — éduscol, 2019"
    url: "https://eduscol.education.gouv.fr/sites/default/files/document/17-francais-3e-attendus-eduscolpdf-74685.pdf"
    licence: etalab-2.0
  - titre: "Repères annuels de progression pour le cycle 4 — Français — éduscol, 2019"
    url: "https://eduscol.education.gouv.fr/sites/default/files/document/25-francais-c4-reperes-eduscol1114755pdf-74691.pdf"
    licence: etalab-2.0
  - titre: "Définition des épreuves de l'examen du diplôme national du brevet à compter de la session 2027 — I. Épreuve écrite de français — Note de service du 11-9-2026 (NOR MENE2623228N), BO spécial n° 4 du 17 septembre 2026"
    url: "https://www.education.gouv.fr/bo/2026/Hebdo4/MENE2623228N"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - type: objectifs
    items:
      - "Repérer les reprises, les indicateurs de temps et de lieu et les connecteurs logiques d'un texte."
      - "Reconnaître le rôle des temps verbaux dans un texte long (temps de base, arrière-plan, antériorité)."
      - "Utiliser des marques d'organisation (paragraphes, ponctuation, connecteurs) dans ses propres textes."

  - type: texte
    titre: "Les reprises"
    contenu: |-
      Un texte est **cohérent** quand on peut le suivre sans se perdre.

      Pour ne pas répéter toujours le même mot, on **reprend** un élément déjà cité.

      | Sorte de reprise | Exemple pour « le chat » |
      |---|---|
      | Pronom | il, le, celui-ci |
      | Synonyme | le matou |
      | Autre groupe nominal | l'animal, le petit félin |
      | Déterminant démonstratif | ce chat |

      Toutes ces reprises forment une **chaîne de reprises** : elles désignent la même chose.
      Une bonne reprise ne laisse jamais le lecteur hésiter.

  - type: texte
    titre: "Temps, lieu et relations logiques"
    contenu: |-
      **Indicateurs de temps** : le lendemain, ensuite, au même moment.
      **Indicateurs de lieu** : plus loin, là-bas, en face.

      Les **connecteurs logiques** relient les idées et disent quelle relation les unit :

      | Relation | Connecteurs |
      |---|---|
      | Cause | car, parce que, en effet |
      | Conséquence | donc, ainsi, par conséquent |
      | Opposition | mais, pourtant, cependant, toutefois |
      | Addition | de plus, en outre, et |
      | Succession | d'abord, puis, enfin |

  - type: texte
    titre: "Le système des temps"
    contenu: |-
      Dans un texte long, on choisit un **temps de base**.

      Au passé :
      - le **passé simple** (ou le passé composé) raconte les actions du **premier plan** ;
      - l'**imparfait** décrit l'**arrière-plan** (décors, habitudes) ;
      - le **plus-que-parfait** marque ce qui s'est passé **avant**.

      Quand on change de temps, il faut une raison : description, retour en arrière, commentaire.

  - type: texte
    titre: "Les marques d'organisation"
    contenu: |-
      Elles montrent la structure du texte :
      - les **paragraphes** (alinéas) : une idée par paragraphe ;
      - la **ponctuation** : virgules, points, deux-points ;
      - les **tirets**, les titres, les majuscules ;
      - les **connecteurs d'organisation** : d'abord, ensuite, enfin.

      Au brevet, on te demande de repérer ces éléments, puis de les utiliser dans ta rédaction.

  - type: exemple
    enonce: >-
      Analyse la cohérence de ce texte : « Le soir venu, Karim rentra chez lui. Il avait beaucoup marché,
      donc il était épuisé. Le garçon s'assit devant la fenêtre. Dehors, la pluie tombait. »
    etapes:
      - "Chaîne de reprises : Karim → Il → il → Le garçon. Ces mots désignent la même personne."
      - "Indicateurs de temps : « Le soir venu ». Indicateur de lieu : « Dehors »."
      - "Connecteur logique : « donc » exprime la conséquence (il avait beaucoup marché, alors il était épuisé)."
      - "Temps : le passé simple (rentra, s'assit) porte les actions du premier plan."
      - "Le plus-que-parfait (avait marché) marque ce qui s'est passé avant. L'imparfait (tombait) décrit l'arrière-plan."

  - type: exercice
    enonce: "Dans « Thomas a un chien. Cet animal le suit partout. », quel groupe de mots reprend « un chien » ?"
    forme: qcm
    choix:
      - "Thomas"
      - "Cet animal"
      - "partout"
      - "le suit"
    reponse: 1
    indices:
      - "Une reprise désigne à nouveau la même chose, avec d'autres mots."
      - "Quel groupe de mots peut se remplacer par « le chien » sans changer le sens ?"
    explication: "« Cet animal » désigne le chien : c'est une reprise par un autre groupe nominal, avec un déterminant démonstratif."

  - type: exercice
    enonce: "Dans « Le match a été annulé car le terrain était inondé. », quelle relation logique exprime le mot « car » ? (un mot)"
    forme: reponse_courte
    reponse: "cause"
    reponses_acceptees: ["la cause", "une cause", "Cause"]
    indices:
      - "Regarde la partie de phrase qui suit « car » : que fait-elle par rapport à l'annulation ?"
      - "Elle explique pourquoi le match a été annulé. Dans le tableau, quelle ligne contient « car » ?"
    explication: "« Le terrain était inondé » explique pourquoi le match est annulé. « car » exprime la cause."

  - type: exercice
    enonce: "Dans « Il pleuvait depuis l'aube. Quand Paul sortit, il ouvrit son parapluie. », quel temps décrit l'arrière-plan ?"
    forme: qcm
    choix:
      - "L'imparfait"
      - "Le passé simple"
      - "Le plus-que-parfait"
      - "Le futur"
    reponse: 0
    indices:
      - "L'arrière-plan décrit le décor, la situation qui dure."
      - "Quel verbe dit ce qui dure (le temps qu'il fait) : « pleuvait » ou « sortit » ? À quel temps est-il ?"
    explication: "« pleuvait » est à l'imparfait : il décrit l'arrière-plan. « sortit » et « ouvrit » sont au passé simple : ils racontent les actions du premier plan."

  - type: exercice
    enonce: "Dans « Léa marchait dans la forêt. Plus loin, elle vit une clairière. », quel groupe est un indicateur de lieu ?"
    forme: qcm
    choix:
      - "Plus loin"
      - "Léa"
      - "marchait"
      - "elle vit"
    reponse: 0
    indices:
      - "Un indicateur de lieu répond à la question : où ?"
      - "Cherche l'expression qui situe l'action plus loin dans l'espace."
    explication: "« Plus loin » situe l'action dans l'espace : c'est un indicateur de lieu."

  - type: exercice
    enonce: >-
      Combien de connecteurs logiques y a-t-il dans ce texte ?
      « Ce matin, il pleuvait. Pourtant, Léa est sortie, car elle devait aller au marché.
      Ainsi, elle a acheté des pommes. »
    forme: nombre
    reponse: 3
    tolerance: 0.01
    indices:
      - "Un connecteur logique relie deux idées (cause, conséquence, opposition...). « Ce matin » est un indicateur de temps."
      - "Regarde au début des phrases et à l'intérieur de la deuxième phrase."
    explication: "Pourtant (opposition), car (cause) et Ainsi (conséquence) : il y a 3 connecteurs logiques."

  - type: question_ouverte
    question: >-
      Voici deux phrases : « Marie a perdu ses clés. Elle a téléphoné à son frère. »
      Ajoute un connecteur logique entre les deux idées, puis explique quelle relation il exprime.
    indices:
      - "Demande-toi : la deuxième action est-elle une conséquence de la première ?"
      - "Choisis un connecteur dans le tableau, par exemple dans la ligne « conséquence » ou « succession »."
    criteres:
      - "L'élève propose un connecteur adapté (donc, alors, puis, ensuite...)."
      - "L'élève nomme correctement la relation exprimée (conséquence ou succession)."
      - "La phrase reste correcte et cohérente, avec une ponctuation adaptée."

  - type: synthese
    consigne: >-
      Écris, avec tes mots et en deux ou trois phrases, quels éléments rendent un texte cohérent
      (reprises, connecteurs, temps, organisation) et comment tu les repères dans un texte.
