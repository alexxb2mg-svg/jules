  - id: grammaire
    titre: Grammaire
    notions:
    - id: 5e-espagnol-grammaire-verbe
      titre: 'Grammaire : le verbe'
      niveau_programme: 5e
      attendus:
      - >-
        Niveau A1+ : le presente de indicativo des verbes reguliers (-ar, -er, -ir) aux formes
        affirmative, negative et interrogative ; la distinction ser/estar (ser pour les
        caracteristiques permanentes, estar pour les etats temporaires et la localisation) ; les
        verbes a diphtongue courants (querer > quiero, poder > puedo, dormir > duermo) ; les
        verbes pronominaux courants (llamarse, levantarse, acostarse) ; la construction gustar +
        infinitif ou nom (me gusta, me gustan) ; l'imperatif affirmatif (tu) des verbes reguliers
        (habla, come, escribe) ; l'expression du futur proche avec ir a + infinitif (voy a
        estudiar).
      - >-
        Niveau A2 : le preterito indefinido (passe simple espagnol) des verbes reguliers et de
        quelques irreguliers courants (fui, fue, hice, tuve, dije) ; le preterito perfecto
        (passe compose : he comido, has viajado) ; l'expression de l'obligation avec
        tener que + infinitif, hay que + infinitif et deber + infinitif ; l'expression du souhait
        avec querer + infinitif et me gustaria + infinitif ; l'expression de l'opinion avec
        creo que, pienso que, en mi opinion, para mi.
      mots_cles:
      - verbe
      - presente de indicativo
      - ser/estar
      - preterito
      - futur proche
      - gustar
      - A1+
      - A2
