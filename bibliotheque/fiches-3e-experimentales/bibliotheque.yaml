# Fiche d'identite de la bibliotheque (format : bibliotheque/README.md)
id: fiches-3e-experimentales
titre: "Fiches 3e expérimentales"
type: fiches
statut: experimentale
licence: CC-BY-SA-4.0          # adaptation de contenus CC BY-SA : même licence (partage à l'identique)
pays: FR
niveaux: [3e]
avertissement: >-
  Bibliothèque EXPÉRIMENTALE, pour tester Jules. Fiches écrites par les contributeurs du projet à
  partir de ressources libres (sources et licences citées dans chaque fiche), sans validation par
  un enseignant ni par l'Éducation nationale. Elles peuvent contenir des erreurs. Le cours de
  l'élève et la parole de son professeur font toujours foi.
description: >-
  Repères par notion : essentiel du cours, méthode, erreurs fréquentes, exemple résolu et exercices
  d'entraînement avec indices. Couvre les 252 notions du programme de 3e, dans les 12 matières
  (français, mathématiques, histoire, géographie, EMC, SVT, physique-chimie, technologie, anglais,
  arts plastiques, éducation musicale, histoire des arts). Aucune fiche n'est encore relue.
  Sources admises et écartées : SOURCES.md.
