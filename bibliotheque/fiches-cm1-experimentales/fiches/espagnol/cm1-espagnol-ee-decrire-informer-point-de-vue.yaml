notion: cm1-espagnol-ee-decrire-informer-point-de-vue
declencheurs:
- donner mon avis en espagnol à l'écrit
- avis en espagnol
- compléter une fiche en espagnol
- écrire ce que j'aime en espagnol
essentiel: 'Pour écrire et donner son avis, on écrit des mots ou des expressions isolées pour décrire très simplement
  des objets familiers.

  On peut compléter une fiche de renseignements très simple, ou rédiger un court message.

  On exprime ses goûts avec des adjectifs (bonito, bueno, divertido) et des verbes (gustar, encantar).

  On peut dire si on est d''accord ou pas d''accord : Estoy de acuerdo, No estoy de acuerdo.'
methode:
- Choisir l'information ou l'objet dont on veut parler.
- Utiliser un adjectif simple pour donner son avis (bonito, bueno, divertido).
- Ajouter Estoy de acuerdo ou No estoy de acuerdo si on réagit à quelque chose.
- Relire pour vérifier que la phrase est simple et compréhensible.
vocabulaire: []
erreurs_frequentes:
- Écrire une phrase trop compliquée au lieu d'une expression simple.
- Oublier de dire pourquoi on aime ou pas (ajouter un adjectif).
exemple:
  enonce: Tu regardes une oeuvre d'art de Picasso et tu la trouves drôle et colorée. Écris ton avis en espagnol.
  solution: Me gusta. Es divertido. Me encantan los colores.
exercices:
- enonce: 'Complète une fiche de renseignements très simple : dis ton prénom et que tu es bon en mathématiques.'
  indices:
  - Utilise Me llamo... et Soy muy bueno en...
  solution: Me llamo Martín. Tengo 9 años. Soy muy bueno en matemáticas.
- enonce: Un camarade dit qu'il n'aime pas les épinards, et toi non plus. Dis que tu es d'accord.
  indices:
  - Utilise Estoy de acuerdo.
  solution: Estoy de acuerdo.
