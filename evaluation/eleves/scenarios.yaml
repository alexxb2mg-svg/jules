      - {matiere: Français, notion: "accord du participe passé avec avoir", sait: true}
      - {matiere: Physique-Chimie, notion: "loi d'additivité en dérivation", sait: false}
  situation: >-
    Épreuve sans aide sur 3 notions travaillées il y a 5 jours. Tu réponds juste sur Pythagore et sur
    l'accord du participe passé. Sur la loi d'additivité en dérivation tu te trompes (tu crois que
    l'intensité est la même dans toutes les branches). Tu commences par « prêt ».
