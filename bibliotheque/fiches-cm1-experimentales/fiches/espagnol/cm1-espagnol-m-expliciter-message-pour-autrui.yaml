notion: cm1-espagnol-m-expliciter-message-pour-autrui
declencheurs:
- expliquer une affiche en espagnol à quelqu'un
- dire ce qu'il faut faire à un copain en espagnol
- expliquer un panneau en espagnol
essentiel: 'Expliciter un message pour autrui, c''est indiquer avec des mots et des gestes simples les besoins d''une
  autre personne : tiene hambre, tiene sed, tiene frío, tiene calor, tiene miedo.

  On peut attirer l''attention sur une information importante donnée dans une affiche, un panneau, un programme.

  On utilise des verbes comme mira, escucha et des mots pour situer : aquí, allí.'
methode:
- Repérer le besoin ou l'information à transmettre.
- Choisir un mot simple (hambre, sed, frío, calor) ou un geste pour l'exprimer.
- Utiliser aquí ou allí pour montrer où se trouve l'information.
- Vérifier que la personne aidée a bien compris.
vocabulaire: []
erreurs_frequentes:
- Confondre tiene hambre (avoir faim) et tiene sed (avoir soif).
- Ne pas montrer avec le geste l'information qu'on transmet.
exemple:
  enonce: Un camarade a faim et tu dois transmettre son besoin au serveur d'un jeu de rôle. Que dis-tu ?
  solution: Tiene hambre. ¿Puedo tener un bocadillo, por favor?
exercices:
- enonce: Une camarade a soif. Transmets son besoin.
  indices:
  - Utilise tiene sed.
  solution: Tiene sed.
- enonce: Une invitation dit que la fête est le 16 juillet à 14h. Transmets ces informations en espagnol.
  indices:
  - Utilise el + date, a las + heure.
  solution: La fiesta es el sábado 16 de julio a las 2 de la tarde.
