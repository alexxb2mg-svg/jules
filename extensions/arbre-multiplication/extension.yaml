id: arbre-multiplication
titre: "Figure : un arbre qui se multiplie à chaque étape (partages d'un message, divisions de cellules)"
version: "1.0.0"
licence: MIT
auteurs: ["projet-jules"]
fournit:
  figures: [arbre-multiplication]
