notion: cm1-accorder-sujet-verbe
declencheurs:
- accord sujet verbe
- le verbe s'accorde
- j'accorde mal le verbe
- accord du participe passé
- auxiliaire être
- est tombée
essentiel: 'Le verbe s''accorde toujours avec son sujet, en nombre et en personne.

  Pour bien accorder, il faut d''abord repérer le sujet du verbe, notamment le nom noyau quand le sujet est un groupe
  nominal.

  Au passé composé, le participe passé s''accorde avec le sujet uniquement quand le verbe est employé avec l''auxiliaire
  être : Anna est tombée dans le jardin (accord avec Anna, féminin singulier).

  Il ne faut pas confondre les variations du verbe avec celles du nom : il élève / tu élèves / elles élèvent (verbe)
  sont différentes de une élève / des élèves (nom).'
methode:
- Repérer le sujet du verbe (le nom noyau si c'est un groupe nominal, ou le pronom).
- Vérifier le genre et le nombre du sujet.
- Accorder le verbe en personne et en nombre avec ce sujet.
- Si le verbe est au passé composé avec l'auxiliaire être, accorder aussi le participe passé avec le sujet.
- Vérifier que tu n'as pas confondu la terminaison du verbe avec celle d'un nom qui lui ressemble.
vocabulaire:
- terme: auxiliaire
  definition: le verbe être ou avoir utilisé avec le participe passé pour former un temps composé
- terme: participe passé
  definition: la forme du verbe utilisée avec un auxiliaire (mangé, tombée...)
erreurs_frequentes:
- Oublier d'accorder le participe passé avec le sujet quand l'auxiliaire est être.
- Accorder le participe passé avec le sujet même quand l'auxiliaire est avoir (dans les cas simples étudiés au CM1,
  il reste invariable).
- Confondre la terminaison d'un verbe et celle d'un nom qui se prononce pareil.
exemple:
  enonce: 'Accorde le participe passé dans : « Les filles sont (tomber) dans la cour. »'
  solution: 'Les filles sont tombées dans la cour : l''auxiliaire être impose l''accord du participe passé avec
    le sujet « les filles » (féminin pluriel).'
exercices:
- enonce: 'Accorde le verbe entre parenthèses : « Le chien (aboyer, présent) fort. »'
  indices:
  - Le sujet « le chien » est à la 3e personne du singulier.
  solution: Le chien aboie fort.
- enonce: 'Accorde le participe passé : « Marie et Paul sont (partir) tôt ce matin. »'
  indices:
  - 'Le sujet est composé de deux personnes : quel est son nombre et son genre ?'
  solution: Marie et Paul sont partis tôt ce matin (sujet pluriel, masculin car il y a un masculin dans le groupe).
