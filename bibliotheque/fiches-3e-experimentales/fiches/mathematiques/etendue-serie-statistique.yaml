notion: etendue-serie-statistique
essentiel: 'L''étendue d''une série statistique est l''écart entre sa plus grande et sa plus petite valeur : étendue
  = valeur maximale − valeur minimale.

  Elle mesure la dispersion : plus elle est grande, plus les valeurs sont éparpillées. Elle ne dit rien sur le centre
  de la série (c''est le rôle de la moyenne et de la médiane).'
methode:
- Repérer la plus grande et la plus petite valeur (ranger la série aide).
- 'Soustraire : maximum − minimum, avec l''unité.'
- 'Comparer deux séries : même moyenne mais étendues différentes = régularité différente.'
erreurs_frequentes:
- Donner l'intervalle « de 5 à 16 » au lieu de la différence 11.
- Confondre étendue et effectif total.
exemple:
  enonce: 'Notes : de 5 (la plus basse) à 16 (la plus haute). Quelle est l''étendue ?'
  solution: 16 − 5 = 11 points.
exercices:
- enonce: 'Série : 12, 7, 15, 9, 11, 8, 14. Calculer l''étendue.'
  indices:
  - Maximum − minimum.
  solution: 15 − 7 = 8.
