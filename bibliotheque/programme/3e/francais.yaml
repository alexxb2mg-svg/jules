            titre: "Chaînes d'accord dans le groupe nominal"
            niveau_programme: "cycle 4"
            attendus:
              - "Connaître le fonctionnement des chaînes d'accord ; maîtriser l'accord dans le groupe nominal complexe (avec plusieurs noms, plusieurs adjectifs, une relative, des déterminants comme tout, chaque, leur, etc.)."
              - "Maîtriser l'accord du participe passé avec être et avec avoir (cas simples) ; maîtriser l'accord de l'adjectif et du participe passé mis en apposition."
            mots_cles: [chaîne d'accord, groupe nominal, participe passé]
            brevet: true
            source: "Programme cycle 4, annexe 3, Français — Étude de la langue, « Consolider l'orthographe lexicale et grammaticale »"
